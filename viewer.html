\n\n| Field | Value |\n| --- | --- |\n| Source ID | DOC-HB-002 |\n| Title | Discretionary Housing Payments: Guidance for Local Authority Administration |\n| Raw source | [DOC-HB-002-discretionary-housing-payments.md](../../structured_files/DOC-HB-002-discretionary-housing-payments.md) |\n| Format | md |\n| Document type | procedural-manual |\n| Department | [DEPT-A] |\n| Owner |  |\n| Status | current |\n| Version | 2.1 |\n| Publication date | 2025-03-01 |\n| Last updated | 2025-09-15 |\n| Audience | Local authority housing officers |\n| Topics | housing-benefit, discretionary-housing-payments, local-authority-administration, homelessness-and-social-housing, incident-risk-and-assurance, welsh-language-standards |\n| Data origin | Challenge 2 corpus data is synthetic hackathon fixture data. |\n| Contains real personal data | false |\n| Contains synthetic identifiers | false |\n| SHA-256 | 9c282d4c6bcc1c54ebaa35f19956e25d6c0ff43c1b8e5818628b1082195244b2 |\n\n## Related Sources\n\n- [DOC-HB-001](doc-hb-001-housing-benefit-check-if-you-re-eligible-gov-uk.md) - Housing Benefit: Check if you're eligible - GOV.UK\n- [DOC-HB-008](doc-hb-008-summary-of-responses-to-the-consultation-on-discretiona.md) - SUMMARY OF RESPONSES TO THE CONSULTATION ON DISCRETIONARY HOUSING PAYMENTS REFORM\n\n## Navigation\n\n- Topic: [Housing Benefit](../topics/housing-benefit.md)\n- Topic: [Discretionary Housing Payments](../topics/discretionary-housing-payments.md)\n- Topic: [Homelessness And Social Housing](../topics/homelessness-and-social-housing.md)\n- Topic: [Incident Risk And Assurance](../topics/incident-risk-and-assurance.md)\n- Topic: [Welsh Language Standards](../topics/welsh-language-standards.md)\n- Entity: [Local Authorities](../entities/local-authorities.md)\n\n## Extracted Content\n\n# Discretionary Housing Payments: Guidance for Local Authority Administration\n\n## 1. Purpose and scope\n\nThis manual provides local authority housing officers with the procedural framework for assessing, awarding, and administering Discretionary Housing Payments (DHPs). DHPs are made under Section 2 of the Discretionary Financial Assistance Regulations 2001 and are intended to provide short-term financial assistance to claimants who are entitled to Housing Benefit or the housing costs element of Universal Credit but who require further help to meet their housing costs.\n\nLocal authorities have broad discretion in determining DHP awards. There is no statutory right to a DHP, and each application must be considered on its individual merits. This guidance sets out the minimum procedural standards expected by the [Government Department A] but does not remove the authority's discretion in individual cases.\n\n### 1.1 Legal basis\n\nDHPs are governed by the Discretionary Financial Assistance Regulations 2001 (SI 2001/1167), as amended. The power to make DHPs rests with the local authority, and the Secretary of State allocates an annual DHP budget to each authority. Authorities may supplement this allocation from their own funds up to a maximum of two and a half times the government contribution.\n\n### 1.2 Relationship to Housing Benefit\n\nA DHP may only be awarded where the claimant has an entitlement to Housing Benefit (as described in [DOC-HB-001](doc-hb-001-housing-benefit-check-if-you-re-eligible-gov-uk.md)) or the housing costs element of Universal Credit. The DHP is not a payment of Housing Benefit itself and is not subject to the same statutory calculation rules. Officers should note that a claimant does not need to be receiving the maximum amount of Housing Benefit to qualify for a DHP.\n\n## 2. Eligibility assessment procedure\n\n### 2.1 Initial screening\n\nUpon receipt of a DHP application, the processing officer must first confirm that the applicant satisfies the gateway condition: entitlement to Housing Benefit or the housing costs element of Universal Credit. If the applicant does not meet this condition, the application must be refused at this stage.\n\n**Decision point:** If the applicant meets the gateway condition, proceed to step 2.2. If the applicant does not meet the gateway condition, issue a refusal notice under section 3.4 of this manual and inform the applicant of their right to request a review.\n\n### 2.2 Assessment of need\n\nThe officer must assess the applicant's financial circumstances, taking into account all sources of income and expenditure. The following factors should be considered:\n\n- the shortfall between the applicant's Housing Benefit or Universal Credit housing element and their contractual rent liability\n- the applicant's overall financial position, including income, essential expenditure, debts, and any other financial commitments\n- whether the applicant has taken reasonable steps to reduce their housing costs, for example by seeking cheaper accommodation or negotiating a rent reduction with their landlord\n- any medical or disability-related needs that affect the applicant's housing requirements\n- the impact of welfare reform measures such as the benefit cap, the removal of the spare room subsidy, or Local Housing Allowance restrictions\n\n### 2.3 Decision flowchart\n\nThe following decision process must be followed for each application:\n\n1. Confirm Housing Benefit or UC housing element entitlement (see [DOC-HB-001](doc-hb-001-housing-benefit-check-if-you-re-eligible-gov-uk.md) for eligibility criteria).\n2. If entitled, assess the shortfall between benefit and rent liability.\n   - If the shortfall is zero or negative, proceed to step 5.\n   - If the shortfall is positive, proceed to step 3.\n3. Evaluate the applicant's financial hardship using the assessment criteria in section 2.2.\n   - If the applicant demonstrates financial hardship, proceed to step 4.\n   - If financial hardship is not demonstrated, proceed to section 4.2.1 for alternative support options.\n4. Determine the DHP award amount and duration (see section 3.1).\n5. If no shortfall exists but the applicant faces exceptional circumstances (for example, the need to remain in adapted accommodation due to disability), the officer may exercise discretion. Consult with the senior housing officer before proceeding. See also the exceptional circumstances guidance in [DOC-HB-008](doc-hb-008-summary-of-responses-to-the-consultation-on-discretiona.md).\n\n### 2.4 Evidence requirements\n\nOfficers should request proportionate evidence to support the application. Mandatory evidence includes proof of identity, tenancy agreement, and a recent bank statement or income declaration. Additional evidence may be requested where the officer considers it necessary to reach a fair decision, but authorities must not impose excessive evidence requirements that could deter vulnerable applicants from claiming.\n\n## 3. Award determination\n\n### 3.1 Calculating the award\n\nThe DHP award amount should generally be set at the level required to bridge the gap between the applicant's Housing Benefit entitlement and their eligible rent, unless the authority determines that a partial award is more appropriate. Awards must not exceed the applicant's eligible rent liability. The duration of the award should reflect the applicant's circumstances; short-term awards of 13 weeks are typical, with a review before any extension.\n\n### 3.2 Payment method\n\nDHPs may be paid to the claimant, the landlord, or a third party acting on behalf of the claimant. The authority should apply the same safeguarding considerations as for Housing Benefit payments and should pay directly to the landlord where there is a risk of the claimant not using the payment to meet rent.\n\n### 3.3 Recording and monitoring\n\nAll DHP decisions must be recorded on the authority's housing benefit system with a clear audit trail showing the evidence considered, the reasoning for the decision, and the amount and duration of the award. Authorities must submit quarterly monitoring returns to [DEPT-A] summarising DHP expenditure, the number of awards made, and the reasons for awards.\n\n### 3.4 Notification and review\n\nThe applicant must be notified of the decision in writing within 14 working days of the authority having all necessary information. Where a DHP is refused, the notification must set out the reasons for refusal and inform the applicant of their right to request an internal review. Reviews must be conducted by an officer who was not involved in the original decision.\n\n## 4. Special circumstances\n\n### 4.1 Welfare reform impacts\n\nDHPs are frequently used to mitigate the impact of specific welfare reform measures. Officers should be particularly alert to applications from claimants affected by the benefit cap, the removal of the spare room subsidy in social housing, and reductions to the Local Housing Allowance. The Department expects authorities to prioritise DHP awards for claimants in these categories who are taking active steps to improve their circumstances.\n\n### 4.2 Alternative support\n\n#### 4.2.1 Signposting to other assistance\n\nWhere a DHP application is refused or where the DHP alone is insufficient, officers should signpost the applicant to alternative sources of support, including the local welfare assistance scheme, charitable grants, debt advice services, and housing options teams. Officers should also consider whether the applicant may benefit from a referral under the Duty to Refer provisions (see [DOC-HB-008](doc-hb-008-summary-of-responses-to-the-consultation-on-discretiona.md) for cross-referencing homelessness duties).\n\n## Raw Metadata\n\n| Field | Value |\n| --- | --- |\n| audience | Local authority housing officers |\n| department | [DEPT-A] |\n| document_id | DOC-HB-002 |\n| exif_ExifToolVersion | 13.55 |\n| exif_FileModifyDate | 2026:04:16 16:01:34+01:00 |\n| exif_FileName | DOC-HB-002-discretionary-housing-payments.md |\n| exif_FilePermissions | -rw-r--r-- |\n| exif_FileSize | 7.9 kB |\n| exif_FileType | TXT |\n| exif_FileTypeExtension | txt |\n| exif_LineCount | 101 |\n| exif_MIMEEncoding | us-ascii |\n| exif_MIMEType | text/plain |\n| exif_Newlines | Unix LF |\n| exif_WordCount | 1166 |\n| last_updated | 2025-09-15 |\n| publication_date | 2025-03-01 |\n| related_documents | [\"DOC-HB-001\", \"DOC-HB-008\"] |\n| status | current |\n| supersedes | DOC-HB-002 v1.4 (2023-07-01) |\n| title | Discretionary Housing Payments: Guidance for Local Authority Administration |\n| topics | [\"housing-benefit\", \"discretionary-housing-payments\", \"local-authority-administration\"] |\n| type | procedural-manual |\n| version | 2.1 |\n\n## Related Notes\n\n- [Knowledge base index](../index.md)\n- [Lint report](../lint-report.md)"},"sources/doc-hb-003-council-tax-reduction-schemes-regulatory-framework-and.md":{"id":"sources/doc-hb-003-council-tax-reduction-schemes-regulatory-framework-and.md","type":"Source","title":"COUNCIL TAX REDUCTION SCHEMES: REGULATORY FRAMEWORK AND LOCAL AUTHORITY OBLIGATIONS","description":"Source note for DOC-HB-003: COUNCIL TAX REDUCTION SCHEMES: REGULATORY FRAMEWORK AND LOCAL AUTHORITY OBLIGATIONS.","timestamp":"March 2024","aliases":"DOC-HB-003;COUNCIL TAX REDUCTION SCHEMES: REGULATORY FRAMEWORK AND LOCAL AUTHORITY OBLIGATIONS;DOC-HB-003-council-tax-reduction-regulations","section":"sources","source":"challenge-2/wiki/sources/doc-hb-003-council-tax-reduction-schemes-regulatory-framework-and.md","body":"# COUNCIL TAX REDUCTION SCHEMES: REGULATORY FRAMEWORK AND LOCAL AUTHORITY OBLIGATIONS\n## Summary\n\n- Source: [DOC-HB-003-council-tax-reduction-regulations.txt](../../structured_files/DOC-HB-003-council-tax-reduction-regulations.txt)\n- Extraction: `plain-text-regex` with `medium` quality.\n- Flags: stale/conflicted: DOC-HB-009 says it replaces the March 2024 version.\n- Extract: COUNCIL TAX REDUCTION SCHEMES: REGULATORY FRAMEWORK AND LOCAL AUTHORITY OBLIGATIONS Document ID: DOC-HB-003 Published: March 2024 Department: [Government Department A] Status: Current Audience: Local authority revenues and benefits officers 1. Introduction and statutory basis 1.1 This document provides a summary of the regulatory framework governing Council Tax Reduction (CTR) schemes in England. CTR replaced the national Council Tax Benefit scheme with effect from 1 April 2013 pursuant to the provisions of the Local Government Finance Act 2012. Each billing authority in England is required under section 13A(2) of the Local Government...\n\n## Metadata\n\n| Field | Value |\n| --- | --- |\n| Source ID | DOC-HB-003 |\n| Title | COUNCIL TAX REDUCTION SCHEMES: REGULATORY FRAMEWORK AND LOCAL AUTHORITY OBLIGATIONS |\n| Raw source | [DOC-HB-003-council-tax-reduction-regulations.txt](../../structured_files/DOC-HB-003-council-tax-reduction-regulations.txt) |\n| Format | txt |\n| Document type | framework |\n| Department | [Government Department A] |\n| Owner |  |\n| Status | current |\n| Version |  |\n| Publication date | March 2024 |\n| Last updated |  |\n| Audience | Local authority revenues and benefits officers |\n| Topics | housing-benefit, council-tax-reduction, incident-risk-and-assurance, overpayment-recovery |\n| Data origin | Challenge 2 corpus data is synthetic hackathon fixture data. |\n| Contains real personal data | false |\n| Contains synthetic identifiers | false |\n| SHA-256 | 107a852fbcdc525dc4815e528be968308dde25d50a97d8e671b20dcf1cdbed9a |\n\n## Related Sources\n\n- [DOC-HB-001](doc-hb-001-housing-benefit-check-if-you-re-eligible-gov-uk.md) - Housing Benefit: Check if you're eligible - GOV.UK\n\n## Navigation\n\n- Topic: [Housing Benefit](../topics/housing-benefit.md)\n- Topic: [Council Tax Reduction](../topics/council-tax-reduction.md)\n- Topic: [Incident Risk And Assurance](../topics/incident-risk-and-assurance.md)\n- Topic: [Overpayment Recovery](../topics/overpayment-recovery.md)\n- Entity: [Local Authorities](../entities/local-authorities.md)\n\n## Extracted Content\n\nCOUNCIL TAX REDUCTION SCHEMES: REGULATORY FRAMEWORK AND LOCAL AUTHORITY OBLIGATIONS\n\nDocument ID: DOC-HB-003\nPublished: March 2024\nDepartment: [Government Department A]\nStatus: Current\nAudience: Local authority revenues and benefits officers\n\n\n1. Introduction and statutory basis\n\n1.1 This document provides a summary of the regulatory framework governing Council Tax Reduction (CTR) schemes in England. CTR replaced the national Council Tax Benefit scheme with effect from 1 April 2013 pursuant to the provisions of the Local Government Finance Act 2012. Each billing authority in England is required under section 13A(2) of the Local Government Finance Act 1992 (as amended) to make a scheme specifying the reductions to council tax liability to which persons may be entitled.\n\n1.2 The Secretary of State has prescribed certain requirements with which all local CTR schemes must comply. These prescribed requirements are set out in The Council Tax Reduction Schemes (Prescribed Requirements) (England) Regulations 2012 (SI 2012/2885), as subsequently amended by The Council Tax Reduction Schemes (Prescribed Requirements) (England) (Amendment) Regulations 2013 (SI 2013/3181), The Council Tax Reduction Schemes (Prescribed Requirements) (England) (Amendment) Regulations 2014 (SI 2014/3312), and subsequent annual amendment regulations through to the most recent amending instrument.\n\n1.3 The prescribed requirements regulations establish the framework within which billing authorities must operate. They specify the classes of person who must be included in the scheme, the maximum period for which a reduction may be backdated, and the procedural requirements for applications and determinations. Authorities retain discretion in respect of the level of reduction offered to working-age claimants, subject to the requirement that pensioner-age claimants must receive reductions calculated in accordance with the prescribed scheme set out in Schedule 1 to SI 2012/2885.\n\n\n2. Scope of local authority discretion\n\n2.1 For working-age applicants, each billing authority may design its own scheme, subject to the prescribed requirements. This means that the level of council tax reduction available to a working-age person varies between different local authority areas. Some authorities have maintained schemes that broadly replicate the former national Council Tax Benefit scheme, providing up to 100 per cent reduction. Other authorities have introduced minimum payments, income tapers, or capital limits that differ from the previous national scheme.\n\n2.2 Billing authorities must consult with precepting authorities and publish a draft scheme before adoption. Any revision to an existing scheme for a financial year must be agreed by a resolution of the full council before 11 March in the preceding financial year. Where an authority fails to agree a revised scheme by that date, the scheme from the previous year continues in effect by default.\n\n2.3 The interaction between CTR schemes and Housing Benefit entitlement (see [DOC-HB-001](doc-hb-001-housing-benefit-check-if-you-re-eligible-gov-uk.md) for Housing Benefit eligibility criteria) requires careful consideration. A person who receives Housing Benefit or Universal Credit housing costs element may also be eligible for CTR. The CTR assessment takes into account the applicant's income, capital, and household composition, and local schemes may apply different disregards and premiums to those used in the Housing Benefit calculation.\n\n\n3. Prescribed requirements for pensioner-age applicants\n\n3.1 The prescribed requirements mandate that all CTR schemes must include provision for persons who have attained the qualifying age for state pension credit. The reduction available to pensioner-age applicants is calculated in accordance with Schedule 1 to SI 2012/2885 and is not subject to local variation. This ensures that pensioner-age applicants receive the same level of protection regardless of which billing authority area they reside in.\n\n3.1.1 The applicable amount for a pensioner-age single claimant is determined by reference to the amounts set out in Schedule 2 to the prescribed requirements regulations. These amounts are uprated annually by statutory instrument.\n\n3.1.2 For pensioner-age couples, the applicable amount includes the couple rate personal allowance together with any relevant premiums, including the severe disability premium where the qualifying conditions are met. The calculation follows the methodology previously used under the national Council Tax Benefit scheme.\n\n3.1.3 Where a pensioner-age applicant has income that exceeds the applicable amount, the excess income is subject to a taper of 20 per cent. That is, for every pound by which the applicant's weekly income exceeds the applicable amount, the weekly CTR entitlement is reduced by 20 pence.\n\n\n4. Procedural requirements\n\n4.1 Applications for CTR must be made to the billing authority in whose area the dwelling is situated. Authorities must accept applications made in writing, electronically, or by telephone where appropriate arrangements are in place. An authority may require an applicant to provide such information and evidence as it reasonably requires to determine the application.\n\n4.1.1 Where an application is defective by reason of it being made on the incorrect form or omitting material information, the authority must afford the applicant an opportunity to rectify the deficiency. The authority may not refuse the application solely on the ground that the prescribed form was not used if the applicant has provided sufficient information for the authority to determine entitlement.\n\n4.2 Billing authorities must make a determination on a CTR application as soon as reasonably practicable after receiving all necessary information and evidence. The authority must give written notice of its determination, including where the application is refused the reasons for refusal and the applicant's right of appeal to the Valuation Tribunal for England under section 16 of the Local Government Finance Act 1992.\n\n4.3 Any person aggrieved by a decision of a billing authority regarding CTR entitlement may appeal to the Valuation Tribunal for England. Before making an appeal, the person should first request that the authority reconsider the decision under the authority's own review procedure. If the dispute is not resolved, an appeal may be made within two months of notification of the authority's decision on review.\n\n\n5. Fraud and compliance\n\n5.1 Council Tax Reduction is subject to the same fraud investigation powers as apply to Housing Benefit and Council Tax Benefit under the Social Security Administration Act 1992 and the Council Tax Reduction Schemes (Detection of Fraud and Enforcement) (England) Regulations 2013 (SI 2013/501). Billing authorities have the power to require information from applicants and third parties for the purpose of investigating potential fraud.\n\n5.1.1 Where an authority determines that a person has received CTR to which they were not entitled as a result of fraud, the authority may impose a civil penalty of 50 per cent of the excess reduction, subject to a minimum of 100 pounds and a maximum of 1,000 pounds. The authority must give the person written notice of the penalty and the right to appeal to the Valuation Tribunal.\n\n## Raw Metadata\n\n| Field | Value |\n| --- | --- |\n| audience | Local authority revenues and benefits officers |\n| department | [Government Department A] |\n| document_id | DOC-HB-003 |\n| exif_ExifToolVersion | 13.55 |\n| exif_FileModifyDate | 2026:04:16 16:01:34+01:00 |\n| exif_FileName | DOC-HB-003-council-tax-reduction-regulations.txt |\n| exif_FilePermissions | -rw-r--r-- |\n| exif_FileSize | 7.3 kB |\n| exif_FileType | TXT |\n| exif_FileTypeExtension | txt |\n| exif_LineCount | 54 |\n| exif_MIMEEncoding | us-ascii |\n| exif_MIMEType | text/plain |\n| exif_Newlines | Unix LF |\n| exif_WordCount | 1078 |\n| published | March 2024 |\n| status | Current |\n\n## Related Notes\n\n- [Knowledge base index](../index.md)\n- [Lint report](../lint-report.md)"},"sources/doc-hb-004-social-housing-frequently-asked-questions-gov-uk.md":{"id":"sources/doc-hb-004-social-housing-frequently-asked-questions-gov-uk.md","type":"Source","title":"Social Housing: Frequently Asked Questions - GOV.UK","description":"Source note for DOC-HB-004: Social Housing: Frequently Asked Questions - GOV.UK.","timestamp":"2025-08-10","aliases":"DOC-HB-004;Social Housing: Frequently Asked Questions - GOV.UK;DOC-HB-004-social-housing-faq","section":"sources","source":"challenge-2/wiki/sources/doc-hb-004-social-housing-frequently-asked-questions-gov-uk.md","body":"# Social Housing: Frequently Asked Questions - GOV.UK\n## Summary\n\n- Source: [DOC-HB-004-social-housing-faq.html](../../structured_files/DOC-HB-004-social-housing-faq.html)\n- Extraction: `pandoc-html` with `high` quality.\n- Extract: <div class=\"govuk-breadcrumbs\" style=\"margin-bottom: 20px; font-size: 0.9em;\"> Home \\> Housing \\> Social housing </div> Social Housing: Frequently Asked Questions <div class=\"publication-info\"> Last updated 10 August 2025\\ From: \\[Government Department A\\] </div> This page answers common questions about applying for and living in social housing in England. Social housing includes homes owned and managed by local councils and by housing associations (also known as registered providers of social housing). Your questions answered <div class=\"faq-item\"> 1. What is social housing and who provides it? Social housing is affordable rented...\n\n## Metadata\n\n| Field | Value |\n| --- | --- |\n| Source ID | DOC-HB-004 |\n| Title | Social Housing: Frequently Asked Questions - GOV.UK |\n| Raw source | [DOC-HB-004-social-housing-faq.html](../../structured_files/DOC-HB-004-social-housing-faq.html) |\n| Format | html |\n| Document type | FAQ |\n| Department | [DEPT-A] |\n| Owner |  |\n| Status | current |\n| Version |  |\n| Publication date |  |\n| Last updated | 2025-08-10 |\n| Audience | Citizens |\n| Topics | social-housing, housing, council-housing, allocation, housing-benefit, homelessness-and-social-housing |\n| Data origin | Challenge 2 corpus data is synthetic hackathon fixture data. |\n| Contains real personal data | false |\n| Contains synthetic identifiers | false |\n| SHA-256 | 118e10465b16b57701aa15b4c7c5285bd8a53cbadc22aca4e05a8d6dcb6e84be |\n\n## Related Sources\n\n- [DOC-HB-005](doc-hb-005-homelessness-prevention-and-relief-local-authority-duti.md) - Homelessness Prevention and Relief: Local Authority Duties and Assessment Procedures\n- [DOC-HB-001](doc-hb-001-housing-benefit-check-if-you-re-eligible-gov-uk.md) - Housing Benefit: Check if you're eligible - GOV.UK\n\n## Navigation\n\n- Topic: [Housing Benefit](../topics/housing-benefit.md)\n- Topic: [Homelessness And Social Housing](../topics/homelessness-and-social-housing.md)\n- Entity: [Local Authorities](../entities/local-authorities.md)\n\n## Extracted Content\n\n<div class=\"govuk-breadcrumbs\" style=\"margin-bottom: 20px; font-size: 0.9em;\">\n\nHome \\> Housing \\> Social housing\n\n</div>\n\n# Social Housing: Frequently Asked Questions\n\n<div class=\"publication-info\">\n\nLast updated 10 August 2025\\\nFrom: **\\[Government Department A\\]**\n\n</div>\n\nThis page answers common questions about applying for and living in social housing in England. Social housing includes homes owned and managed by local councils and by housing associations (also known as registered providers of social housing).\n\n## Your questions answered\n\n<div class=\"faq-item\">\n\n### 1. What is social housing and who provides it?\n\nSocial housing is affordable rented accommodation provided by local councils or housing associations. Rents in social housing are set significantly below market levels and are regulated by the government. Local councils own and manage council housing directly, while housing associations are independent not-for-profit organisations registered with the Regulator of Social Housing. Both types of social housing are allocated through your local council's housing register or waiting list.\n\n</div>\n\n<div class=\"faq-item\">\n\n### 2. How do I apply for social housing?\n\nTo apply for social housing you need to join your local council's housing register, sometimes called the waiting list. You can usually apply online through your council's website, or by contacting the council's housing options team by telephone or in person. You will need to provide information about your current living situation, your household, your income, and any particular housing needs you may have. Some councils operate a choice-based lettings system where you bid for available properties once you are on the register.\n\n</div>\n\n<div class=\"faq-item\">\n\n### 3. Who is eligible to go on the housing register?\n\nMost people aged 18 or over can apply to join their council's housing register. However, certain groups are excluded by law, including:\n\n- people from abroad who are subject to immigration control and do not have leave to remain that entitles them to public funds\n- people who are not habitually resident in the United Kingdom, the Channel Islands, the Isle of Man, or the Republic of Ireland\n\nCouncils may also set their own qualification criteria, such as a local connection requirement. If you are found not to qualify, the council must give you written reasons and you have the right to request a review of that decision.\n\n</div>\n\n<div class=\"faq-item\">\n\n### 4. How are social housing properties allocated?\n\nCouncils must have an allocation scheme that sets out how they prioritise applicants. By law, reasonable preference must be given to certain groups, including:\n\n- people who are homeless or threatened with homelessness (see [DOC-HB-005](doc-hb-005-homelessness-prevention-and-relief-local-authority-duti.md) for more detail on homelessness duties)\n- people living in unsanitary, overcrowded, or otherwise unsatisfactory housing\n- people who need to move on medical or welfare grounds\n- people who need to move to a particular area to avoid hardship\n\nWithin these groups, the council applies a banding or points system to determine the relative priority of applicants. The exact criteria differ between councils.\n\n</div>\n\n<div class=\"faq-item\">\n\n### 5. How long will I have to wait for social housing?\n\nWaiting times vary considerably depending on your area, the type of property you need, and your priority band. In areas of high demand, particularly in London and the South East, waiting times of several years are common for general needs applicants. Applicants with urgent housing needs, such as those who are homeless or living in severely overcrowded conditions, are typically housed more quickly. Your council can give you an indication of likely waiting times in your area and band.\n\n</div>\n\n<div class=\"faq-item\">\n\n### 6. Can I choose where I live?\n\nMany councils operate choice-based lettings systems that allow you to express a preference for available properties by placing a bid. You can usually bid for properties in areas you are interested in, subject to any restrictions on property size based on your household. However, there is no guarantee that you will be offered a property in your preferred area, particularly if demand is high. You are entitled to express a preference, but the council is not bound to allocate in accordance with that preference if doing so would not be consistent with the allocation scheme.\n\n</div>\n\n<div class=\"faq-item\">\n\n### 7. What size property am I entitled to?\n\nThe size of property you are eligible for is determined by the bedroom standard, which takes into account the number and ages of people in your household. The general rules are:\n\n- one bedroom for each adult couple\n- one bedroom for each other person aged 16 or over\n- one bedroom for two children of the same sex under 16\n- one bedroom for two children under 10 regardless of sex\n- one bedroom for any remaining child\n\nAn additional bedroom may be allowed for a carer who does not live with you but provides overnight care, or for a disabled person who cannot share a bedroom with their partner due to their disability.\n\n</div>\n\n<div class=\"faq-item\">\n\n### 8. Can I get help with rent in social housing?\n\nYes. If you are on a low income, you may be entitled to Housing Benefit or the housing costs element of Universal Credit to help with your rent. The eligibility rules and income thresholds for Housing Benefit are set out in the Housing Benefit eligibility guidance ([DOC-HB-001](doc-hb-001-housing-benefit-check-if-you-re-eligible-gov-uk.md)). Many social housing tenants are entitled to the full amount of their rent through benefits because social rents are set at affordable levels.\n\n</div>\n\n<div class=\"faq-item\">\n\n### 9. What is the difference between a secure tenancy and an assured tenancy?\n\nIf you rent from a local council, you will usually have a secure tenancy under the Housing Act 1985. If you rent from a housing association, you will usually have an assured tenancy under the Housing Act 1988. Both types of tenancy give you strong security of tenure, meaning your landlord cannot evict you without a court order and a valid ground for possession. Some newer tenancies may be fixed-term rather than lifetime, particularly those granted under the flexible tenancy or assured shorthold tenancy provisions.\n\n</div>\n\n<div class=\"faq-item\">\n\n### 10. Can I transfer to a different social housing property?\n\nIf you are already a social housing tenant and want to move to a different property, you can apply for a transfer through your council's allocation scheme. Transfer applicants are assessed in the same way as new applicants, although some councils give additional priority to tenants who are under-occupying their current home and willing to move to a smaller property. You can also arrange a mutual exchange with another social housing tenant, which allows you to swap homes. Mutual exchanges must be approved by both landlords.\n\n</div>\n\n<div class=\"faq-item\">\n\n### 11. What if I am refused social housing or unhappy with a decision?\n\nIf your application to join the housing register is refused, or if you disagree with the priority band you have been placed in, you have the right to request a review. The council must carry out the review and notify you of the outcome with reasons. If you remain dissatisfied after the review, you may be able to make a complaint through the council's complaints procedure or, ultimately, to the Local Government and Social Care Ombudsman.\n\n</div>\n\n<div class=\"faq-item\">\n\n### 12. What rights do I have as a social housing tenant?\n\nAs a social housing tenant, you have a number of important rights, including:\n\n- the right to live in the property undisturbed, provided you comply with the tenancy conditions\n- the right to have repairs carried out within reasonable timescales\n- the right to be consulted about changes to the management of your home or estate\n- the right to take in lodgers or, with permission, sublet part of the property\n- the right to buy your home at a discount (for most secure council tenants under the Right to Buy scheme)\n- the right to make complaints and have them dealt with fairly\n\nYour landlord must provide you with a written tenancy agreement setting out both your rights and responsibilities. If you believe your landlord has failed to meet their obligations, you can raise the matter with the Housing Ombudsman.\n\n</div>\n\n<div class=\"related-links\">\n\n## Related guidance\n\n- [Housing Benefit: Check if you're eligible (DOC-HB-001)](doc-hb-001-housing-benefit-check-if-you-re-eligible-gov-uk.md)\n- [Homelessness prevention and relief: local authority duties (DOC-HB-005)](doc-hb-005-homelessness-prevention-and-relief-local-authority-duti.md)\n\n</div>\n\n## Raw Metadata\n\n| Field | Value |\n| --- | --- |\n| audience | Citizens |\n| author | omelessness Prevention and Relief: Local Authority Duties and Assessment Procedures;DOC-HB-005-homelessness-prevention","section":"sources","source":"challenge-2/wiki/sources/doc-hb-005-homelessness-prevention-and-relief-local-authority-duti.md","body":"# Homelessness Prevention and Relief: Local Authority Duties and Assessment Procedures\n## Summary\n\n- Source: [DOC-HB-005-homelessness-prevention.txt](../../structured_files/DOC-HB-005-homelessness-prevention.txt)\n- Extraction: `plain-text-regex` with `medium` quality.\n- Extract: Homelessness Prevention and Relief: Local Authority Duties and Assessment Procedures [Government Department A] Published: January 2025 Document ID: DOC-HB-005 LOCAL AUTHORITY DUTIES UNDER HOMELESSNESS LEGISLATION Local authorities in England have a range of statutory duties towards people who are homeless or threatened with homelessness. These duties are principally contained in Part 7 of the Housing Act 1996, as significantly amended by the Homelessness Reduction Act 2017. The 2017 Act introduced new prevention and relief duties that substantially expanded the obligations placed on local authorities and extended the period during which a...\n\n## Metadata\n\n| Field | Value |\n| --- | --- |\n| Source ID | DOC-HB-005 |\n| Title | Homelessness Prevention and Relief: Local Authority Duties and Assessment Procedures |\n| Raw source | [DOC-HB-005-homelessness-prevention.txt](../../structured_files/DOC-HB-005-homelessness-prevention.txt) |\n| Format | txt |\n| Document type | assessment |\n| Department |  |\n| Owner |  |\n| Status | unknown |\n| Version |  |\n| Publication date | January 2025 |\n| Last updated |  |\n| Audience |  |\n| Topics | housing-benefit, discretionary-housing-payments, homelessness-and-social-housing, incident-risk-and-assurance |\n| Data origin | Challenge 2 corpus data is synthetic hackathon fixture data. |\n| Contains real personal data | false |\n| Contains synthetic identifiers | false |\n| SHA-256 | 3e6c147f5162a94f8937def5bff15de1347d59bec2c93e2265bafa9a4ff60412 |\n\n## Related Sources\n\n- [DOC-HB-001](doc-hb-001-housing-benefit-check-if-you-re-eligible-gov-uk.md) - Housing Benefit: Check if you're eligible - GOV.UK\n- [DOC-HB-002](doc-hb-002-discretionary-housing-payments-guidance-for-local-autho.md) - Discretionary Housing Payments: Guidance for Local Authority Administration\n- [DOC-HB-004](doc-hb-004-social-housing-frequently-asked-questions-gov-uk.md) - Social Housing: Frequently Asked Questions - GOV.UK\n- [DOC-SB-008](doc-sb-008-employer-duties-under-the-homelessness-reduction-act-20.md) - Employer duties under the Homelessness Reduction Act 2017\n\n## Navigation\n\n- Topic: [Housing Benefit](../topics/housing-benefit.md)\n- Topic: [Discretionary Housing Payments](../topics/discretionary-housing-payments.md)\n- Topic: [Homelessness And Social Housing](../topics/homelessness-and-social-housing.md)\n- Topic: [Incident Risk And Assurance](../topics/incident-risk-and-assurance.md)\n- Entity: [Local Authorities](../entities/local-authorities.md)\n- Entity: [Housing Act 1996](../entities/housing-act-1996.md)\n- Entity: [Homelessness Reduction Act 2017](../entities/homelessness-reduction-act-2017.md)\n\n## Extracted Content\n\nHomelessness Prevention and Relief: Local Authority Duties and Assessment Procedures\n[Government Department A]\nPublished: January 2025\nDocument ID: DOC-HB-005\n\n\nLOCAL AUTHORITY DUTIES UNDER HOMELESSNESS LEGISLATION\n\nLocal authorities in England have a range of statutory duties towards people who are homeless or threatened with homelessness. These duties are principally contained in Part 7 of the Housing Act 1996, as significantly amended by the Homelessness Reduction Act 2017. The 2017 Act introduced new prevention and relief duties that substantially expanded the obligations placed on local authorities and extended the period during which a person is treated as threatened with homelessness from 28 days to 56 days before the likely loss of accommodation. When a person approaches a local authority for assistance because they are homeless or at risk of becoming homeless, the authority must carry out an assessment of their circumstances and their housing and support needs. This initial assessment is a critical stage in the process and must be conducted in a manner that is thorough, sensitive, and compliant with the requirements set out in the legislation and the accompanying statutory code of guidance. The assessment should consider the full range of the applicant's circumstances, including the reasons for their homelessness or threatened homelessness, their housing history, their financial situation including any entitlement to Housing Benefit as set out in the Housing Benefit eligibility guidance ([DOC-HB-001](doc-hb-001-housing-benefit-check-if-you-re-eligible-gov-uk.md)), their health and wellbeing, any support needs they may have, and whether they have dependent children or other members of their household who must be accommodated with them. Authorities should ensure that assessments are conducted by appropriately trained staff and that interpreting services are made available where the applicant's first language is not English. The outcome of the assessment must be recorded in writing and a copy provided to the applicant in the form of a personalised housing plan, which sets out the steps that both the authority and the applicant will take to try to prevent or relieve their homelessness.\n\nThe prevention duty arises under section 195 of the Housing Act 1996 where the authority is satisfied that the applicant is threatened with homelessness and is eligible for assistance. The authority must take reasonable steps to help the applicant secure that accommodation does not cease to be available for their occupation. Reasonable steps may include negotiation with landlords to prevent eviction, assistance with rent arrears or deposits through Discretionary Housing Payments as described in the guidance for local authorities ([DOC-HB-002](doc-hb-002-discretionary-housing-payments-guidance-for-local-autho.md)), referral to debt advice or mediation services, or assistance to secure alternative accommodation in the private or social rented sector. The prevention duty lasts for 56 days or until it is brought to an end by one of the circumstances specified in the Act, for example where the applicant becomes homeless, where suitable accommodation is secured for at least six months, or where the applicant deliberately and unreasonably refuses to cooperate with the steps set out in the personalised housing plan. Authorities are expected to engage actively with applicants during the prevention duty period and to take a proactive rather than reactive approach. Where the authority becomes aware that an applicant's circumstances have changed, for example because an eviction date has been brought forward or because the applicant's health has deteriorated, the personalised housing plan should be reviewed and updated accordingly. The effectiveness of prevention work is monitored through the Homelessness Case Level Information Collection (H-CLIC) data returns that authorities are required to submit to the Department on a quarterly basis, and authorities are encouraged to use this data to identify trends and improve their prevention services.\n\nWhere homelessness is not prevented and the applicant becomes homeless, the relief duty under section 189B of the Housing Act 1996 is engaged. The authority must take reasonable steps to help the applicant secure suitable accommodation. This may involve assisting the applicant to find accommodation in the private rented sector, making a direct offer of temporary accommodation, or facilitating access to supported housing or social housing through the council's allocation scheme, the details of which are commonly asked about in the social housing frequently asked questions ([DOC-HB-004](doc-hb-004-social-housing-frequently-asked-questions-gov-uk.md)). The relief duty also lasts for 56 days and is subject to similar provisions regarding cooperation and the circumstances in which it may come to an end. During the relief duty period, the authority must also consider whether it has a duty to provide interim accommodation under section 188 of the Act. This duty arises where the authority has reason to believe that the applicant may be homeless, eligible for assistance, and in priority need. Priority need categories include households with dependent children, pregnant women, persons who are vulnerable as a result of old age, mental illness, physical disability, or other special reason, and persons who are homeless as a result of an emergency such as a fire or flood. The standard of temporary accommodation provided must be suitable for the applicant and their household, and the suitability of accommodation is assessed by reference to factors including location, affordability, condition, and the needs of the household.\n\nIf the relief duty comes to an end without the applicant having secured accommodation, the authority must then consider whether it owes the main housing duty under section 193 of the Housing Act 1996. The main duty is owed where the applicant is homeless, eligible for assistance, in priority need, and not intentionally homeless. Where the main duty is accepted, the authority must secure that suitable accommodation is available for the applicant until the duty comes to an end, which typically occurs when the applicant accepts an offer of settled accommodation through the allocation scheme or accepts a qualifying offer of an assured shorthold tenancy in the private rented sector. The main duty represents the final safety net and authorities should ensure that applicants who are owed this duty are provided with accommodation that meets their needs and that active efforts continue to help them secure long-term settled housing. Authorities should also be mindful of the duty to refer introduced by section 213B of the Housing Act 1996, which requires specified public authorities including hospitals, prisons, jobcentres, and social services departments to refer service users who they have reason to believe may be homeless or threatened with homelessness to the local housing authority with the individual's consent. This duty to refer is intended to ensure that people at risk of homelessness are identified early and connected with housing assistance before they reach crisis point, and it requires effective information-sharing protocols between the referring authority and the housing authority. Further guidance on how the duty to refer interacts with welfare benefits support is set out in the state benefits coordination guidance ([DOC-SB-008](doc-sb-008-employer-duties-under-the-homelessness-reduction-act-20.md)).\n\n## Raw Metadata\n\n| Field | Value |\n| --- | --- |\n| document_id | DOC-HB-005 |\n| exif_ExifToolVersion | 13.55 |\n| exif_FileModifyDate | 2026:04:16 16:01:34+01:00 |\n| exif_FileName | DOC-HB-005-homelessness-prevention.txt |\n| exif_FilePermissions | -rw-r--r-- |\n| exif_FileSize | 7.3 kB |\n| exif_FileType | TXT |\n| exif_FileTypeExtension | txt |\n| exif_LineCount | 15 |\n| exif_MIMEEncoding | us-ascii |\n| exif_MIMEType | text/plain |\n| exif_Newlines | Unix LF |\n| exif_WordCount | 1107 |\n| published | January 2025 |\n\n## Related Notes\n\n- [Knowledge base index](../index.md)\n- [Lint report](../lint-report.md)"},"sources/doc-hb-006-housing-benefit-claim-form-hb1-completion-instructions.md":{"id":"sources/doc-hb-006-housing-benefit-claim-form-hb1-completion-instructions.md","type":"Source","title":"Housing Benefit Claim Form (HB1) — Completion Instructions","description":"Source note for DOC-HB-006: Housing Benefit Claim Form (HB1) — Completion Instructions.","timestamp":"2024-01-15","aliases":"DOC-HB-006;Housing Benefit Claim Form (HB1) — Completion Instructions;DOC-HB-006-housing-benefit-claim-form-instructions","section":"sources","source":"challenge-2/wiki/sources/doc-hb-006-housing-benefit-claim-form-hb1-completion-instructions.md","body":"# Housing Benefit Claim Form (HB1) — Completion Instructions\n## Summary\n\n- Source: [DOC-HB-006-housing-benefit-claim-form-instructions.md](../../structured_files/DOC-HB-006-housing-benefit-claim-form-instructions.md)\n- Extraction: `markdown-frontmatter` with `high` quality.\n- Flags: superseded, points readers to DOC-HB-006a.\n- Extract: Housing Benefit Claim Form (HB1) — Completion Instructions Version 2.3 — Published 15 January 2024 > Note: These instructions apply to form HB1 version 2.3. For the current version 3.0 instructions, see DOC-HB-006a. These instructions guide claimants through the process of completing the Housing Benefit claim form (HB1). Read all instructions carefully before beginning. Incomplete or incorrectly completed forms will delay your claim. For background on Housing Benefit eligibility and rates, refer to the Housing Benefit Regulations Overview (DOC-HB-001). Before You Start Ensure you have all required supporting documents to hand before...\n\n## Metadata\n\n| Field | Value |\n| --- | --- |\n| Source ID | DOC-HB-006 |\n| Title | Housing Benefit Claim Form (HB1) — Completion Instructions |\n| Raw source | [DOC-HB-006-housing-benefit-claim-form-instructions.md](../../structured_files/DOC-HB-006-housing-benefit-claim-form-instructions.md) |\n| Format | md |\n| Document type | form-instructions |\n| Department | [DEPT-A] |\n| Owner |  |\n| Status | superseded |\n| Version | 2.3 |\n| Publication date | 2024-01-15 |\n| Last updated |  |\n| Audience |  |\n| Topics | housing-benefit, council-tax-reduction, homelessness-and-social-housing, small-business-and-self-employment, employment-rights-and-flexible-working |\n| Data origin | Challenge 2 corpus data is synthetic hackathon fixture data. |\n| Contains real personal data | false |\n| Contains synthetic identifiers | false |\n| SHA-256 | 511e2c69895afc5be2d5ffb75cfa0a39e72cf00188821d294af09b2478a13469 |\n\n## Related Sources\n\n- `DOC-HB-006a` - referenced but not found in this corpus\n- [DOC-HB-001](doc-hb-001-housing-benefit-check-if-you-re-eligible-gov-uk.md) - Housing Benefit: Check if you're eligible - GOV.UK\n\n## Navigation\n\n- Topic: [Housing Benefit](../topics/housing-benefit.md)\n- Topic: [Council Tax Reduction](../topics/council-tax-reduction.md)\n- Topic: [Homelessness And Social Housing](../topics/homelessness-and-social-housing.md)\n- Topic: [Small Business And Self-employment](../topics/small-business-and-self-employment.md)\n- Topic: [Employment Rights And Flexible Working](../topics/employment-rights-and-flexible-working.md)\n- Entity: [Local Authorities](../entities/local-authorities.md)\n- Entity: [HB1 Form](../entities/hb1-form.md)\n\n## Extracted Content\n\n# Housing Benefit Claim Form (HB1) — Completion Instructions\n\n**Version 2.3 — Published 15 January 2024**\n\n> Note: These instructions apply to form HB1 version 2.3. For the current version 3.0 instructions, see DOC-HB-006A.\n\nThese instructions guide claimants through the process of completing the Housing Benefit claim form (HB1). Read all instructions carefully before beginning. Incomplete or incorrectly completed forms will delay your claim. For background on Housing Benefit eligibility and rates, refer to the Housing Benefit Regulations Overview ([DOC-HB-001](doc-hb-001-housing-benefit-check-if-you-re-eligible-gov-uk.md)).\n\n## Before You Start\n\nEnsure you have all required supporting documents to hand before completing the form. You will need to provide evidence at various stages.\n\n## Step-by-Step Instructions\n\n### Step 1: Personal Details (Sections A and B)\n\n1. Enter your full legal name as it appears on your birth certificate or passport. This must match the name on your tenancy agreement.\n2. Provide your National Insurance number. You can find this on payslips, tax correspondence, or your personal tax account.\n3. Enter your current residential address including the full postcode. If you have moved within the last 12 months, also complete box A7 with your previous address.\n4. Enter your date of birth in DD/MM/YYYY format.\n   - 4.1. If you are part of a couple, enter your partner's details in Section B.\n   - 4.2. Your partner's National Insurance number is required even if they are not making the claim.\n\n### Step 2: Housing Costs (Section C)\n\n1. State your total weekly rent. If your rent is paid monthly, divide the monthly amount by calendar days in the month and multiply by 7.\n2. Indicate whether your rent includes any service charges. If yes, provide a breakdown in box C4.\n3. Attach a copy of your current tenancy agreement or the most recent rent statement from your landlord.\n   - 3.1. If you are a private tenant, you must also provide your landlord's name and contact address in box C8.\n   - 3.2. If your landlord is a registered social housing provider, tick box C9 and provide the provider registration number.\n\n### Step 3: Income and Capital (Section D)\n\n1. Declare all sources of income for yourself and your partner, including wages, benefits, pensions, and any other regular payments.\n2. Provide details of all savings, investments, and capital assets exceeding 6,000 pounds.\n3. If you or your partner are self-employed, complete the supplementary schedule SE1 and attach certified accounts for the most recent trading year.\n\n### Step 4: Other Occupants (Section E)\n\n1. List all persons residing at the property who are not your dependants.\n2. Enter each non-dependant's gross weekly income. This information is used to calculate non-dependant deductions as set out in [DOC-HB-001](doc-hb-001-housing-benefit-check-if-you-re-eligible-gov-uk.md).\n\n### Step 5: Declaration and Signature (Section F)\n\n1. Read the declaration statement in full before signing.\n2. Sign and date the form. Both you and your partner must sign if making a joint claim.\n3. Ensure you have attached all required supporting documents listed below.\n\n## Required Supporting Documents\n\n| Document Type | When Needed | Accepted Formats |\n|---|---|---|\n| Proof of identity | All claims | Passport, driving licence, or biometric residence permit |\n| Proof of National Insurance number | All claims | NI card, payslip, or [DEPT-D] letter |\n| Tenancy agreement | All claims | Original or certified copy |\n| Proof of rent payments | All claims | Bank statement, rent book, or landlord letter |\n| Proof of income | All employed or self-employed claimants | Payslips (last 5 weeks or 2 months), P60, or certified accounts |\n| Proof of savings/capital | If savings exceed 6,000 pounds | Bank or building society statements (last 3 months) |\n| Proof of other benefits | If receiving other state benefits | Award letters dated within last 3 months |\n| Council Tax bill | If also claiming Council Tax Reduction | Most recent Council Tax bill or statement |\n\n## What Happens Next\n\nYour local authority will assess your claim within 14 days of receiving a complete application. If further information is required, you will be contacted in writing. Sincerely incomplete forms will be returned without processing.\n\nFor general guidance on Housing Benefit entitlement and payment schedules, see the Housing Benefit Regulations Overview ([DOC-HB-001](doc-hb-001-housing-benefit-check-if-you-re-eligible-gov-uk.md)).\n\n## Raw Metadata\n\n| Field | Value |\n| --- | --- |\n| department | [DEPT-A] |\n| document_id | DOC-HB-006 |\n| exif_ByteOrderMark | No |\n| exif_ExifToolVersion | 13.55 |\n| exif_FileModifyDate | 2026:04:16 16:01:34+01:00 |\n| exif_FileName | DOC-HB-006-housing-benefit-claim-form-instructions.md |\n| exif_FilePermissions | -rw-r--r-- |\n| exif_FileSize | 4.5 kB |\n| exif_FileType | TXT |\n| exif_FileTypeExtension | txt |\n| exif_LineCount | 76 |\n| exif_MIMEEncoding | utf-8 |\n| exif_MIMEType | text/plain |\n| exif_Newlines | Unix LF |\n| exif_WordCount | 727 |\n| publication_date | 2024-01-15 |\n| status | superseded |\n| title | Housing Benefit Claim Form (HB1) — Completion Instructions |\n| type | form-instructions |\n| version | 2.3 |\n\n## Related Notes\n\n- [Knowledge base index](../index.md)\n- [Lint report](../lint-report.md)"},"sources/doc-hb-007-housing-benefit-caseload-statistics-quarter-3-2025-26.md":{"id":"sources/doc-hb-007-housing-benefit-caseload-statistics-quarter-3-2025-26.md","type":"Source","title":"Housing Benefit Caseload Statistics: Quarter 3 2025/26","description":"Source note for DOC-HB-007: Housing Benefit Caseload Statistics: Quarter 3 2025/26.","timestamp":"2026-01-28","aliases":"DOC-HB-007;Housing Benefit Caseload Statistics: Quarter 3 2025/26;DOC-HB-007-housing-benefit-statistics-q3","section":"sources","source":"challenge-2/wiki/sources/doc-hb-007-housing-benefit-caseload-statistics-quarter-3-2025-26.md","body":"# Housing Benefit Caseload Statistics: Quarter 3 2025/26\n## Summary\n\n- Source: [DOC-HB-007-housing-benefit-statistics-q3.html](../../structured_files/DOC-HB-007-housing-benefit-statistics-q3.html)\n- Extraction: `pandoc-html` with `high` quality.\n- Extract: <div> \\[Government Department A\\] Housing Benefit Caseload Statistics: Quarter 3 2025/26 Official statistics — published 28 January 2026 Reference: DOC-HB-007 </div> Contents - Summary - Regional Caseload - Expenditure Summary - Methodology - Data Quality Statement - Revision History <div id=\"summary\" class=\"section\"> Summary This bulletin presents national and regional statistics on Housing Benefit caseload and expenditure for the third quarter of 2025/26 (October to December 2025). As outlined in the Housing Benefit Regulations Overview (DOC-HB-001), Housing Benefit helps eligible claimants with rental costs in both the social and private...\n\n## Metadata\n\n| Field | Value |\n| --- | --- |\n| Source ID | DOC-HB-007 |\n| Title | Housing Benefit Caseload Statistics: Quarter 3 2025/26 |\n| Raw source | [DOC-HB-007-housing-benefit-statistics-q3.html](../../structured_files/DOC-HB-007-housing-benefit-statistics-q3.html) |\n| Format | html |\n| Document type | statistical-bulletin |\n| Department | [DEPT-A] |\n| Owner |  |\n| Status | current |\n| Version |  |\n| Publication date | 2026-01-28 |\n| Last updated |  |\n| Audience |  |\n| Topics | housing-benefit, council-tax-reduction |\n| Data origin | Challenge 2 corpus data is synthetic hackathon fixture data. |\n| Contains real personal data | false |\n| Contains synthetic identifiers | false |\n| SHA-256 | bc1ac80dd8591d3a2916a8c67de4f19e5cc9fdcd46b0ea350077f6c5c24a5714 |\n\n## Related Sources\n\n- [DOC-HB-001](doc-hb-001-housing-benefit-check-if-you-re-eligible-gov-uk.md) - Housing Benefit: Check if you're eligible - GOV.UK\n\n## Navigation\n\n- Topic: [Housing Benefit](../topics/housing-benefit.md)\n- Topic: [Council Tax Reduction](../topics/council-tax-reduction.md)\n- Entity: [Local Authorities](../entities/local-authorities.md)\n\n## Extracted Content\n\n<div>\n\n\\[Government Department A\\]\n\n# Housing Benefit Caseload Statistics: Quarter 3 2025/26\n\nOfficial statistics — published 28 January 2026\n\nReference: DOC-HB-007\n\n</div>\n\n## Contents\n\n- [Summary](#summary)\n- [Regional Caseload](#caseload)\n- [Expenditure Summary](#expenditure)\n- [Methodology](#methodology)\n- [Data Quality Statement](#data-quality)\n- [Revision History](#revisions)\n\n<div id=\"summary\" class=\"section\">\n\n## Summary\n\nThis bulletin presents national and regional statistics on Housing Benefit caseload and expenditure for the third quarter of 2025/26 (October to December 2025). As outlined in the Housing Benefit Regulations Overview ([DOC-HB-001](doc-hb-001-housing-benefit-check-if-you-re-eligible-gov-uk.md)), Housing Benefit helps eligible claimants with rental costs in both the social and private rented sectors.\n\nThe total Housing Benefit caseload in England at the end of December 2025 was 2,487,300, a decrease of 1.8% compared with the previous quarter and a decrease of 4.3% compared with the same quarter in the previous year. The ongoing reduction reflects the continued migration of working-age claimants to Universal Credit.\n\nAverage weekly awards increased by 2.1% compared with the previous quarter, reaching 117.45 pounds nationally. This increase is largely driven by uprating of Local Housing Allowance rates and increases in social sector rents.\n\n</div>\n\n<div id=\"caseload\" class=\"section\">\n\n## Regional Caseload\n\nTable 1 shows the Housing Benefit caseload by region at the end of December 2025, together with the average weekly award in each region.\n\n| Region | Claimant Count | Change from Q2 (%) | Average Weekly Award |\n|----|----|----|----|\n| North East | 168,200 | -1.4 | 96.30 |\n| North West | 341,500 | -1.9 | 102.15 |\n| Yorkshire and The Humber | 254,800 | -1.7 | 99.80 |\n| East Midlands | 189,400 | -2.0 | 104.20 |\n| West Midlands | 278,600 | -1.6 | 107.55 |\n| East of England | 213,700 | -2.1 | 118.90 |\n| London | 456,300 | -1.5 | 162.40 |\n| South East | 298,100 | -2.3 | 131.75 |\n| South West | 186,700 | -1.9 | 112.60 |\n| England Total | 2,387,300 | -1.8 | 117.45 |\n\nTable 1: Housing Benefit caseload by region, Q3 2025/26 {border=\"1\" cellpadding=\"6\" cellspacing=\"0\" summary=\"Housing Benefit caseload and average weekly award by English region, Q3 2025/26\"}\n\nNote: Figures are rounded to the nearest 100. Average weekly award is given in pounds sterling. Wales and Scotland publish Housing Benefit statistics separately. Regional totals may not sum to the England total due to rounding.\n\n</div>\n\n<div id=\"expenditure\" class=\"section\">\n\n## Expenditure Summary\n\nTable 2 summarises total Housing Benefit expenditure in England for Q3 2025/26.\n\n| Measure                                   | Value               |\n|-------------------------------------------|---------------------|\n| Total expenditure (Q3 2025/26)            | 3.64 billion pounds |\n| Change from previous quarter (Q2 2025/26) | -0.9%               |\n| Year-on-year change (Q3 2024/25)          | -3.7%               |\n| Social rented sector expenditure          | 2.41 billion pounds |\n| Private rented sector expenditure         | 1.23 billion pounds |\n| Average cost per claim (weekly)           | 117.45 pounds       |\n\nTable 2: Expenditure summary, Q3 2025/26 {border=\"1\" cellpadding=\"6\" cellspacing=\"0\" summary=\"Housing Benefit expenditure summary for Q3 2025/26\"}\n\nTotal expenditure continues to decline in real terms as the caseload contracts. However, the average cost per claim continues to rise, reflecting upward pressure on rents across both sectors. Expenditure figures are provisional and subject to revision in the year-end release.\n\n</div>\n\n<div id=\"methodology\" class=\"section\">\n\n## Methodology\n\nThese statistics are derived from the Single Housing Benefit Extract (SHBE), a monthly electronic scan of Housing Benefit claimant records held by local authorities. SHBE records are submitted to the Department by all 309 English billing authorities and are subject to automated validation checks on receipt.\n\nCaseload figures represent the number of live claims at the snapshot date (last working day of the quarter). Average weekly award is the arithmetic mean of weekly entitlements across all live claims at the snapshot date. Expenditure estimates are based on aggregate weekly entitlements multiplied by the number of weeks in the quarter, adjusted for the timing of payments.\n\nUsers should note that Housing Benefit statistics exclude the housing costs element of Universal Credit. A combined statistical series is published separately by the \\[Government Department C\\].\n\n</div>\n\n<div id=\"data-quality\" class=\"section\">\n\n## Data Quality Statement\n\nThese statistics are classified as Official Statistics and are produced in accordance with the Code of Practice for Statistics. The SHBE data source covers the full population of Housing Benefit claimants (no sampling is involved) and is subject to comprehensive automated validation. However, the following quality considerations apply:\n\n- A small number of local authority returns may be delayed or incomplete. Where this occurs, figures are carried forward from the previous period. In Q3 2025/26, data from 4 local authorities (representing approximately 0.6% of the total caseload) were carried forward.\n- Figures are rounded independently and therefore may not sum exactly to totals.\n- Revisions policy: these statistics are provisional and may be revised in subsequent publications. Any revisions will be noted in the revision history section.\n\n</div>\n\n<div id=\"revisions\" class=\"section\">\n\n## Revision History\n\n| Date            | Description       |\n|-----------------|-------------------|\n| 28 January 2026 | First publication |\n\nRevision history {border=\"1\" cellpadding=\"6\" cellspacing=\"0\" summary=\"Revision history for this publication\"}\n\n</div>\n\nCrown copyright 2026. Published by the \\[Government Department A\\].\n\nRelated publications: Housing Benefit Regulations Overview ([DOC-HB-001](doc-hb-001-housing-benefit-check-if-you-re-eligible-gov-uk.md)).\n\n## Raw Metadata\n\n| Field | Value |\n| --- | --- |\n| date-published | 2026-01-28 |\n| department | [DEPT-A] |\n| document-id | DOC-HB-007 |\n| exif_DatePublished | 2026-01-28 |\n| exif_Department | [DEPT-A] |\n| exif_DocumentId | DOC-HB-007 |\n| exif_ExifToolVersion | 13.55 |\n| exif_FileModifyDate | 2026:04:16 16:01:34+01:00 |\n| exif_FileName | DOC-HB-007-housing-benefit-statistics-q3.html |\n| exif_FilePermissions | -rw-r--r-- |\n| exif_FileSize | 8.7 kB |\n| exif_FileType | HTML |\n| exif_FileTypeExtension | html |\n| exif_Frequency | quarterly |\n| exif_MIMEType | text/html |\n| exif_Status | current |\n| exif_Title | Housing Benefit Caseload Statistics: Quarter 3 2025/26 |\n| exif_Type | statistical-bulletin |\n| exif_Viewport | width=device-width, initial-scale=1.0 |\n| frequency | quarterly |\n| status | current |\n| title | Housing Benefit Caseload Statistics: Quarter 3 2025/26 |\n| type | statistical-bulletin |\n| viewport | width=device-width, initial-scale=1.0 |\n\n## Related Notes\n\n- [Knowledge base index](../index.md)\n- [Lint report](../lint-report.md)"},"sources/doc-hb-008-summary-of-responses-to-the-consultation-on-discretiona.md":{"id":"sources/doc-hb-008-summary-of-responses-to-the-consultation-on-discretiona.md","type":"Source","title":"SUMMARY OF RESPONSES TO THE CONSULTATION ON DISCRETIONARY HOUSING PAYMENTS REFORM","description":"Source note for DOC-HB-008: SUMMARY OF RESPONSES TO THE CONSULTATION ON DISCRETIONARY HOUSING PAYMENTS REFORM.","timestamp":"15/11/2025","aliases":"DOC-HB-008;SUMMARY OF RESPONSES TO THE CONSULTATION ON DISCRETIONARY HOUSING PAYMENTS REFORM;DOC-HB-008-dhp-consultation-responses","section":"sources","source":"challenge-2/wiki/sources/doc-hb-008-summary-of-responses-to-the-consultation-on-discretiona.md","body":"# SUMMARY OF RESPONSES TO THE CONSULTATION ON DISCRETIONARY HOUSING PAYMENTS REFORM\n## Summary\n\n- Source: [DOC-HB-008-dhp-consultation-responses.txt](../../structured_files/DOC-HB-008-dhp-consultation-responses.txt)\n- Extraction: `plain-text-regex` with `medium` quality.\n- Extract: SUMMARY OF RESPONSES TO THE CONSULTATION ON DISCRETIONARY HOUSING PAYMENTS REFORM [Government Department A] Date of Publication: 15/11/2025 INTRODUCTION This document summarises the responses received to the public consultation on the reform of Discretionary Housing Payments (DHP), which ran from 1 June 2025 to 31 August 2025. The consultation received 342 responses from local authorities, housing associations, voluntary sector organisations, individual claimants, and other interested parties. Responses were received via the online consultation portal, by email, and by post. This summary should be read alongside the original consultation...\n\n## Metadata\n\n| Field | Value |\n| --- | --- |\n| Source ID | DOC-HB-008 |\n| Title | SUMMARY OF RESPONSES TO THE CONSULTATION ON DISCRETIONARY HOUSING PAYMENTS REFORM |\n| Raw source | [DOC-HB-008-dhp-consultation-responses.txt](../../structured_files/DOC-HB-008-dhp-consultation-responses.txt) |\n| Format | txt |\n| Document type | guidance |\n| Department |  |\n| Owner |  |\n| Status | unknown |\n| Version |  |\n| Publication date | 15/11/2025 |\n| Last updated |  |\n| Audience |  |\n| Topics | housing-benefit, discretionary-housing-payments, homelessness-and-social-housing |\n| Data origin | Challenge 2 corpus data is synthetic hackathon fixture data. |\n| Contains real personal data | false |\n| Contains synthetic identifiers | false |\n| SHA-256 | 460446908678b9fad8d0e29a62db9fbe20f27a0e6584c72a5d8d4823c67883a2 |\n\n## Related Sources\n\n- [DOC-HB-002](doc-hb-002-discretionary-housing-payments-guidance-for-local-autho.md) - Discretionary Housing Payments: Guidance for Local Authority Administration\n\n## Navigation\n\n- Topic: [Housing Benefit](../topics/housing-benefit.md)\n- Topic: [Discretionary Housing Payments](../topics/discretionary-housing-payments.md)\n- Topic: [Homelessness And Social Housing](../topics/homelessness-and-social-housing.md)\n- Entity: [Local Authorities](../entities/local-authorities.md)\n\n## Extracted Content\n\nSUMMARY OF RESPONSES TO THE CONSULTATION ON DISCRETIONARY HOUSING PAYMENTS REFORM\n[Government Department A]\nDate of Publication: 15/11/2025\n\n\nINTRODUCTION\n\nThis document summarises the responses received to the public consultation on the reform of Discretionary Housing Payments (DHP), which ran from 1 June 2025 to 31 August 2025. The consultation received 342 responses from local authorities, housing associations, voluntary sector organisations, individual claimants, and other interested parties. Responses were received via the online consultation portal, by email, and by post. This summary should be read alongside the original consultation document and the DHP Good Practice Guide ([DOC-HB-002](doc-hb-002-discretionary-housing-payments-guidance-for-local-autho.md)).\n\n\nTHEME 1: ELIGIBILITY CRITERIA REFORM\n\n73% of respondents agreed that the current eligibility criteria for DHP awards are too narrowly defined and should be broadened to capture a wider range of housing-related financial hardship. There was strong consensus that the existing requirement to be in receipt of Housing Benefit or the housing costs element of Universal Credit creates a gap where vulnerable individuals who have recently lost entitlement are unable to access emergency support.\n\nSeveral respondents highlighted the position of claimants affected by the benefit cap. As one local authority respondent noted: \"The current process places undue burden on applicants who are already in crisis. By the time a DHP application is processed, many have already fallen into arrears and face possession proceedings.\"\n\nA minority of respondents (14%) argued against broadening eligibility on the grounds that DHP funding is already insufficient to meet current demand and that expanding the pool of eligible claimants without additional funding would dilute support for the most vulnerable.\n\nKey recommendations from respondents under this theme included:\n- Extending eligibility to individuals in the 28-day transition period after loss of Housing Benefit entitlement\n- Introducing a fast-track assessment process for applicants facing imminent homelessness\n- Removing the requirement for a separate DHP application where a claimant has already provided relevant financial information as part of a Housing Benefit or Universal Credit claim\n\n\nTHEME 2: FUNDING ALLOCATION MODEL\n\nRespondents were divided on the proposed changes to the DHP funding allocation model. 58% supported moving from a model based primarily on historic expenditure to one that incorporates indicators of housing need, including local rent levels, homelessness rates, and the proportion of the local population affected by welfare reform measures.\n\nLocal authorities in London and the South East were broadly supportive, arguing that the current allocation model does not adequately reflect the acute affordability pressures in high-cost areas. Conversely, authorities in the North of England expressed concern that a needs-based model could reduce their allocations despite significant levels of deprivation. One respondent from a metropolitan authority in the North West stated: \"Deprivation in our area manifests differently to London but it is no less severe. A reallocation based on market rents alone would penalise communities with longstanding structural disadvantage.\"\n\nThe Department acknowledges these concerns and will undertake further modelling of allocation scenarios before finalising proposals.\n\n\nTHEME 3: APPEALS PROCESS\n\nThe consultation asked whether the DHP appeals process should be formalised and whether applicants should have access to an independent review. 81% of respondents supported the introduction of a statutory right of appeal, replacing the current non-statutory reconsideration process.\n\nVoluntary sector organisations were particularly vocal on this point. Several noted that the current process varies significantly between local authorities, with some providing detailed written reasons for refusal and offering oral hearings while others issue only brief notification letters with no opportunity for review.\n\nRespondents proposed a two-stage appeals model:\nFirst, an internal reconsideration by a senior officer not involved in the original decision, to be completed within 14 days.\nSecond, an independent review by a panel including at least one external member, to be completed within 28 days.\n\nThe Department is considering these proposals and will consult further with local authorities on the resource implications before bringing forward regulations.\n\n\nTHEME 4: MONITORING AND REPORTING\n\nRespondents broadly supported (67%) the proposal to introduce standardised quarterly reporting of DHP expenditure and outcomes by local authorities. However, there was concern about the administrative cost of enhanced reporting requirements, particularly among smaller district authorities.\n\nAs one respondent noted: \"We fully support the principle of transparency, but any new reporting framework must be proportionate. Our DHP budget is less than 200,000 pounds per annum and we have fewer than two full-time equivalent staff administering the scheme.\"\n\nRespondents recommended that the Department provide a standardised data template and, where possible, integrate DHP reporting into existing data collection mechanisms such as the Single Housing Benefit Extract rather than creating a parallel reporting stream.\n\n\nNEXT STEPS\n\nThe Department will publish a formal response setting out its conclusions and any legislative proposals in early 2026. The Department is grateful to all respondents for their contributions to this consultation.\n\n## Raw Metadata\n\n| Field | Value |\n| --- | --- |\n| exif_ExifToolVersion | 13.55 |\n| exif_FileModifyDate | 2026:04:16 16:01:34+01:00 |\n| exif_FileName | DOC-HB-008-dhp-consultation-responses.txt |\n| exif_FilePermissions | -rw-r--r-- |\n| exif_FileSize | 5.6 kB |\n| exif_FileType | TXT |\n| exif_FileTypeExtension | txt |\n| exif_LineCount | 58 |\n| exif_MIMEEncoding | us-ascii |\n| exif_MIMEType | text/plain |\n| exif_Newlines | Unix LF |\n| exif_WordCount | 785 |\n| published | 15/11/2025 |\n\n## Related Notes\n\n- [Knowledge base index](../index.md)\n- [Lint report](../lint-report.md)"},"sources/doc-hb-009-council-tax-reduction-schemes-prescribed-requirements-e.md":{"id":"sources/doc-hb-009-council-tax-reduction-schemes-prescribed-requirements-e.md","type":"Source","title":"COUNCIL TAX REDUCTION SCHEMES (PRESCRIBED REQUIREMENTS) (ENGLAND) (AMENDMENT) REGULATIONS 2025 — SUMMARY AND GUIDANCE","description":"Source note for DOC-HB-009: COUNCIL TAX REDUCTION SCHEMES (PRESCRIBED REQUIREMENTS) (ENGLAND) (AMEN data is synthetic hackathon fixture data. |\n| Contains real personal data | false |\n| Contains synthetic identifiers | false |\n| SHA-256 | 616f6fc606876403831222ab35e91dd3f1f390b4ea407e423b5f800c80bd4581 |\n\n## Related Sources\n\n- [DOC-HB-001](doc-hb-001-housing-benefit-check-if-you-re-eligible-gov-uk.md) - Housing Benefit: Check if you're eligible - GOV.UK\n\n## Navigation\n\n- Topic: [Housing Benefit](../topics/housing-benefit.md)\n- Topic: [Council Tax Reduction](../topics/council-tax-reduction.md)\n- Entity: [Local Authorities](../entities/local-authorities.md)\n\n## Extracted Content\n\nCOUNCIL TAX REDUCTION SCHEMES (PRESCRIBED REQUIREMENTS) (ENGLAND) (AMENDMENT) REGULATIONS 2025 — SUMMARY AND GUIDANCE\n\n[Government Department A]\nPublished: September 2025\nStatus: Current\n\nThis document provides a summary of the key provisions of the Council Tax Reduction Schemes (Prescribed Requirements) (England) (Amendment) Regulations 2025 and guidance for local authorities on their implementation. It replaces the version published in March 2024, which reflected the previous regulatory position prior to the enactment of the Finance Act 2025.\n\nFor the overarching regulatory framework governing Housing Benefit and related local authority welfare schemes, see the Housing Benefit Regulations Overview ([DOC-HB-001](doc-hb-001-housing-benefit-check-if-you-re-eligible-gov-uk.md)).\n\n\n1. Application and Commencement\n\n1.1 These regulations apply in England only. Council Tax Reduction schemes in Wales and Scotland are governed by separate legislation and are not covered by this guidance.\n\n1.2 The amendments come into force on 1 October 2025 and apply to Council Tax Reduction schemes for the financial year 2025/26 and subsequent years.\n\n1.3 Local authorities must revise their local schemes by 31 January 2026 to incorporate the mandatory prescribed requirements set out in these regulations. Authorities that fail to revise their schemes by this date will have the default scheme imposed.\n\n\n2. Changes to Income Thresholds\n\n2.1 The Finance Act 2025 provides for an uplift in the income thresholds used to determine eligibility for Council Tax Reduction. The revised thresholds are as follows:\n\n2.1.1 For a single claimant aged 18 to 24: the applicable amount increases from 71.70 pounds to 77.25 pounds per week.\n\n2.1.2 For a single claimant aged 25 or over: the applicable amount increases from 90.50 pounds to 97.60 pounds per week.\n\n2.1.3 For a couple where both members are aged 18 or over: the applicable amount increases from 142.25 pounds to 153.30 pounds per week.\n\n2.1.4 For a lone parent: the applicable amount increases from 90.50 pounds to 97.60 pounds per week, with additional amounts for dependent children as set out in Schedule 2.\n\n2.2 The capital limit below which a claimant is eligible for Council Tax Reduction remains at 16,000 pounds. However, the lower capital limit (below which capital is disregarded) increases from 6,000 pounds to 6,500 pounds.\n\n\n3. Expanded Eligibility Criteria\n\n3.1 The regulations introduce an expanded eligibility category for claimants in receipt of Carer's Allowance or the carer element of Universal Credit.\n\n3.1.1 A claimant who receives Carer's Allowance and whose income does not exceed 150% of the applicable amount is entitled to a minimum Council Tax Reduction of 25% regardless of the local authority's scheme design.\n\n3.1.2 This provision is a prescribed requirement and cannot be reduced or disapplied by local authority schemes.\n\n3.2 The regulations also introduce a new provision for claimants who are care leavers aged 18 to 25. Local authorities must provide a Council Tax Reduction of not less than 100% to qualifying care leavers, subject to a means test based on the applicable amount at paragraph 2.1.1 above.\n\n3.3 The definition of qualifying care leaver adopts the meaning given in section 2 of the Children (Leaving Care) Act 2000, as amended by the Children and Social Work Act 2017.\n\n\n4. Non-Dependant Deductions\n\n4.1 Non-dependant deductions are revised upwards in line with the Consumer Prices Index as at September 2024.\n\n4.1.1 Where a non-dependant is in remunerative work with gross weekly income of 236.00 pounds or more, the deduction is 15.80 pounds per week (previously 14.95 pounds).\n\n4.1.2 Where a non-dependant is in remunerative work with gross weekly income of less than 236.00 pounds, the deduction is 5.25 pounds per week (previously 4.95 pounds).\n\n4.1.3 Where a non-dependant is not in remunerative work, the deduction is 5.25 pounds per week.\n\n4.2 No non-dependant deduction shall be made where the non-dependant is in receipt of Carer's Allowance, in recognition of the caring responsibilities undertaken.\n\n\n5. Transitional Protection\n\n5.1 Where the revision of a local authority's scheme results in a reduction in the Council Tax Reduction awarded to an existing claimant, the local authority must provide transitional protection for a period of not less than 12 months from the date on which the revised scheme takes effect.\n\n5.2 During the transitional protection period, the claimant's reduction must not fall below 75% of the amount that would have been awarded under the authority's previous scheme.\n\n5.3 Local authorities may fund transitional protection from their general fund or from any ring-fenced grant provided by the Department for this purpose.\n\n\n6. Reporting Requirements\n\n6.1 Local authorities must submit an annual return to the Department by 30 June following the end of each financial year, setting out the number of Council Tax Reduction awards made, total expenditure, and the number of claimants affected by the revisions set out in these regulations.\n\n6.2 The Department will publish aggregate statistics on the operation of Council Tax Reduction schemes in England on an annual basis.\n\n## Raw Metadata\n\n| Field | Value |\n| --- | --- |\n| exif_ByteOrderMark | No |\n| exif_ExifToolVersion
