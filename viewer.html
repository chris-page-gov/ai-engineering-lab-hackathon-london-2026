ic: [Employment Rights And Flexible Working](../topics/employment-rights-and-flexible-working.md)\n- Topic: [FOI And Transparency](../topics/foi-and-transparency.md)\n- Topic: [People Policies](../topics/people-policies.md)\n- Entity: [Employment Rights Act 1996](../entities/employment-rights-act-1996.md)\n\n## Extracted Content\n\n# Employment Rights Act 1996: Plain-English Summary\n\nThis document provides a plain-English summary of the key provisions of the Employment Rights Act 1996 (ERA 1996). It is intended to help employers, employees, and advisers understand the main employment rights established by the Act without needing to read the full legislative text. This summary does not constitute legal advice. Where specific questions arise, you should consult the Act itself or seek qualified legal counsel.\n\n## 1. Right not to be unfairly dismissed\n\n### 1.1 The basic right\n\nUnder Section 94(1) of the Employment Rights Act 1996, an employee who has been continuously employed for at least two years has the right not to be unfairly dismissed by their employer. This is one of the most important protections in UK employment law and applies to employees (but not to workers or self-employed contractors who do not have employee status).\n\n### 1.2 Fair reasons for dismissal\n\nUnder Section 98(2), a dismissal is potentially fair only if it is for one of the following reasons: capability or qualifications, conduct, redundancy, contravention of a statutory duty or restriction, or some other substantial reason justifying the dismissal. The employer bears the burden of showing the reason for dismissal. Once the reason is established, an employment tribunal will assess whether the employer acted reasonably in treating that reason as sufficient for dismissal, having regard to the size and administrative resources of the employer and to equity and the substantial merits of the case.\n\n### 1.3 Automatically unfair reasons\n\nCertain reasons for dismissal are automatically unfair regardless of the length of the employee's service. Under various sections of the Act and related legislation, these include dismissal for asserting a statutory right under Section 104, dismissal connected with pregnancy or maternity under Section 99, dismissal for making a protected disclosure (whistleblowing) under Section 103A, and dismissal for a reason connected with trade union membership or activities.\n\n## 2. Redundancy\n\n### 2.1 Right to a redundancy payment\n\nUnder Section 135 of the Act, an employee who has been continuously employed for two years or more and who is dismissed by reason of redundancy is entitled to a statutory redundancy payment. The amount is calculated based on the employee's age, length of service (up to 20 years), and weekly pay (subject to a statutory cap, which is reviewed annually).\n\n### 2.2 Consultation obligations\n\nAlthough the detailed requirements for collective redundancy consultation are set out in the Trade Union and Labour Relations (Consolidation) Act 1992 rather than the ERA 1996, employers should be aware that where 20 or more redundancies are proposed at a single establishment within a period of 90 days, formal consultation with employee representatives must take place. Failure to consult can result in a protective award of up to 90 days' pay per affected employee.\n\n## 3. Flexible working\n\n### 3.1 Right to request flexible working\n\nUnder Section 80F of the Act (as amended), all employees have the right to request a change to their terms and conditions relating to hours, times, or place of work from the first day of their employment. The employer must deal with the request in a reasonable manner and must notify the employee of the decision within two months of the request (unless an extension is agreed). An employer may only refuse a request on one of the business grounds specified in Section 80G, which include the burden of additional costs, a detrimental effect on the ability to meet customer demand, an inability to reorganise work among existing staff, and a detrimental impact on quality or performance.\n\n### 3.2 Remedies\n\nIf an employer fails to deal with a request properly, the employee may bring a complaint to an employment tribunal. The tribunal may order the employer to reconsider the request and may award compensation of up to eight weeks' pay.\n\n## 4. Notice periods\n\n### 4.1 Minimum statutory notice\n\nUnder Section 86 of the Act, both employers and employees are required to give minimum periods of notice to terminate employment. An employer must give at least one week's notice for each year of continuous employment, up to a maximum of 12 weeks. An employee who has been employed for one month or more must give at least one week's notice. Contractual notice periods may exceed these minimums but cannot fall below them.\n\n### 4.2 Payment in lieu of notice\n\nAn employer may make a payment in lieu of notice (PILON) instead of requiring the employee to work their notice period, but only where the contract expressly permits this or where both parties agree. A PILON is subject to Income Tax and National Insurance contributions in the normal way.\n\n## 5. Written statement of employment particulars\n\nUnder Section 1 of the Act, an employer must provide every employee and worker with a written statement of employment particulars on or before the first day of employment. The statement must include the names of the parties, the date employment began, the rate and intervals of pay, hours of work, holiday entitlement, the job title or a description of the work, and the place of work. Failure to provide the statement may result in a tribunal awarding two or four weeks' pay in any subsequent tribunal claim.\n\n## Related documents\n\n- [National Minimum Wage and National Living Wage: Employer Guidance (DOC-SB-003)](doc-sb-003-national-minimum-wage-and-national-living-wage-employer.md)\n- [Health and Safety Obligations for Small Businesses (DOC-SB-007)](doc-sb-007-statutory-sick-pay-ssp-employer-guide.md)\n- [Maternity and Parental Leave Entitlements (DOC-SB-009)](doc-sb-009-right-to-request-flexible-working-frequently-asked-ques.md)\n\n## Raw Metadata\n\n| Field | Value |\n| --- | --- |\n| department | [Government Department B] |\n| document_id | DOC-SB-005 |\n| exif_ExifToolVersion | 13.55 |\n| exif_FileModifyDate | 2026:04:16 16:01:34+01:00 |\n| exif_FileName | DOC-SB-005-employment-rights-era-1996.md |\n| exif_FilePermissions | -rw-r--r-- |\n| exif_FileSize | 6.0 kB |\n| exif_FileType | TXT |\n| exif_FileTypeExtension | txt |\n| exif_LineCount | 72 |\n| exif_MIMEEncoding | us-ascii |\n| exif_MIMEType | text/plain |\n| exif_Newlines | Unix LF |\n| exif_WordCount | 935 |\n| publication_date | 2025-08-01 |\n| status | current |\n| title | Employment Rights Act 1996: Plain-English Summary |\n| topics | [\"employment law\", \"employee rights\", \"unfair dismissal\", \"redundancy\"] |\n| type | legislation-summary |\n| version | 1.2 |\n\n## Related Notes\n\n- [Knowledge base index](../index.md)\n- [Lint report](../lint-report.md)"},"sources/doc-sb-006-self-employment-and-housing-benefit-how-income-is-asses.md":{"id":"sources/doc-sb-006-self-employment-and-housing-benefit-how-income-is-asses.md","type":"Source","title":"Self-employment and Housing Benefit: how income is assessed","description":"Source note for DOC-SB-006: Self-employment and Housing Benefit: how income is assessed.","timestamp":"2025-12-01","aliases":"DOC-SB-006;Self-employment and Housing Benefit: how income is assessed;DOC-SB-006-self-employment-housing-benefit","section":"sources","source":"challenge-2/wiki/sources/doc-sb-006-self-employment-and-housing-benefit-how-income-is-asses.md","body":"# Self-employment and Housing Benefit: how income is assessed\n## Summary\n\n- Source: [DOC-SB-006-self-employment-housing-benefit.md](../../structured_files/DOC-SB-006-self-employment-housing-benefit.md)\n- Extraction: `markdown-frontmatter` with `high` quality.\n- Extract: Self-employment and Housing Benefit: how income is assessed Overview If you are self-employed and claiming Housing Benefit, your local authority must assess your income to determine the level of benefit you are entitled to receive. The assessment process for self-employed claimants differs significantly from that applied to employed earners, because self-employed individuals may have irregular income patterns and a wider range of permitted business expenses. This guidance sets out how local authorities should calculate self-employment income for Housing Benefit purposes, including the application of the minimum income floor and the evidence...\n\n## Metadata\n\n| Field | Value |\n| --- | --- |\n| Source ID | DOC-SB-006 |\n| Title | Self-employment and Housing Benefit: how income is assessed |\n| Raw source | [DOC-SB-006-self-employment-housing-benefit.md](../../structured_files/DOC-SB-006-self-employment-housing-benefit.md) |\n| Format | md |\n| Document type | guidance |\n| Department | [Government Department A] |\n| Owner |  |\n| Status | current |\n| Version |  |\n| Publication date | 2025-05-15 |\n| Last updated | 2025-12-01 |\n| Audience | Self-employed Housing Benefit claimants and local authority assessors |\n| Topics | housing-benefit, small-business-and-self-employment, employment-rights-and-flexible-working |\n| Data origin | Challenge 2 corpus data is synthetic hackathon fixture data. |\n| Contains real personal data | false |\n| Contains synthetic identifiers | false |\n| SHA-256 | fbf0a0392e0675d7ee88e11cde3f24e26d2289f3c2cf8128b12bd20cbbe3d0d9 |\n\n## Related Sources\n\n- [DOC-HB-001](doc-hb-001-housing-benefit-check-if-you-re-eligible-gov-uk.md) - Housing Benefit: Check if you're eligible - GOV.UK\n- [DOC-SB-001](doc-sb-001-starting-a-business-in-the-uk-step-by-step.md) - Starting a Business in the UK: Step by Step\n- [DOC-SB-002](doc-sb-002-registering-as-self-employed-with-dept-d.md) - Registering as Self-Employed with [DEPT-D]\n\n## Navigation\n\n- Topic: [Housing Benefit](../topics/housing-benefit.md)\n- Topic: [Small Business And Self-employment](../topics/small-business-and-self-employment.md)\n- Topic: [Employment Rights And Flexible Working](../topics/employment-rights-and-flexible-working.md)\n- Entity: [Local Authorities](../entities/local-authorities.md)\n\n## Extracted Content\n\n# Self-employment and Housing Benefit: how income is assessed\n\n## Overview\n\nIf you are self-employed and claiming Housing Benefit, your local authority must assess your income to determine the level of benefit you are entitled to receive. The assessment process for self-employed claimants differs significantly from that applied to employed earners, because self-employed individuals may have irregular income patterns and a wider range of permitted business expenses.\n\nThis guidance sets out how local authorities should calculate self-employment income for Housing Benefit purposes, including the application of the minimum income floor and the evidence that claimants are expected to provide.\n\n## How self-employment income is calculated\n\nLocal authorities assess self-employment income on the basis of **net profit** rather than gross turnover. Net profit is calculated by deducting permitted business expenses from gross income over the relevant assessment period.\n\nThe assessment period is normally the most recent full trading year. Where the claimant has been self-employed for less than one year, the local authority should use the period from the start of trading to the date of the claim and annualise the result.\n\n### Permitted expenses\n\nOnly expenses that are wholly and exclusively incurred for the purposes of the business may be deducted. These include:\n\n- Rent for business premises (but not the domestic portion of a home used partly for business)\n- Stock and materials\n- Business insurance premiums\n- Accountancy and professional fees\n- Vehicle costs where the vehicle is used exclusively for business purposes\n- Telephone and broadband costs attributable to business use\n\nCapital expenditure, depreciation, and business entertaining are not permitted deductions.\n\n## Worked example\n\nThe following example illustrates how Housing Benefit is calculated for a self-employed claimant:\n\n| Step | Description | Amount |\n|------|-------------|--------|\n| 1 | Gross annual income | £24,000.00 |\n| 2 | Less permitted expenses | £8,500.00 |\n| 3 | Net profit (Step 1 minus Step 2) | £15,500.00 |\n| 4 | Weekly equivalent (Step 3 / 52) | £298.08 |\n| 5 | Applicable personal allowance | £77.00 |\n| 6 | Excess income (Step 4 minus Step 5) | £221.08 |\n| 7 | Taper rate applied | 65% |\n| 8 | Weekly Housing Benefit reduction (Step 6 x 65%) | £143.70 |\n\nIn this example, the claimant's weekly Housing Benefit entitlement would be reduced by £143.70 from the maximum applicable rate. If the maximum weekly Housing Benefit for the claimant's circumstances were £270.00, they would receive £126.30 per week.\n\n## Minimum income floor\n\nWhere a claimant has been self-employed for more than 12 months and is in gainful self-employment, the local authority must apply a **minimum income floor** (MIF). The MIF assumes that the claimant is earning at least the equivalent of the National Minimum Wage for the number of hours they would be expected to work (typically 35 hours per week for a single claimant without caring responsibilities).\n\nIf the claimant's actual self-employment income falls below the MIF, the higher figure is used for the purposes of calculating Housing Benefit. The MIF does not apply during the first 12 months of a new business (the \"start-up period\").\n\n## Evidence requirements\n\nClaimants must provide evidence of their self-employment income and expenses. Acceptable evidence includes:\n\n- Self-assessment tax returns for the most recent complete tax year\n- Business accounts prepared by a qualified accountant\n- Business bank statements covering the assessment period\n- Invoices, receipts, and records of expenses\n\nLocal authorities may request additional evidence where the information provided is incomplete or inconsistent. Where a claimant fails to provide adequate evidence, the authority may make a determination based on available information, including the application of the minimum income floor.\n\n## Related guidance\n\n- [DOC-HB-001: Housing Benefit eligibility and rates](doc-hb-001-housing-benefit-check-if-you-re-eligible-gov-uk.md) -- for general eligibility criteria and current benefit rates\n- [DOC-SB-001: Starting a small business in the UK](doc-sb-001-starting-a-business-in-the-uk-step-by-step.md) -- for guidance on business registration and record-keeping obligations\n- [DOC-SB-002: Tax obligations for the self-employed](doc-sb-002-registering-as-self-employed-with-dept-d.md) -- for information on self-assessment, National Insurance, and VAT thresholds\n\n## Raw Metadata\n\n| Field | Value |\n| --- | --- |\n| audience | Self-employed Housing Benefit claimants and local authority assessors |\n| department | [Government Department A] |\n| document_id | DOC-SB-006 |\n| exif_ByteOrderMark | No |\n| exif_ExifToolVersion | 13.55 |\n| exif_FileModifyDate | 2026:04:16 16:01:34+01:00 |\n| exif_FileName | DOC-SB-006-self-employment-housing-benefit.md |\n| exif_FilePermissions | -rw-r--r-- |\n| exif_FileSize | 4.7 kB |\n| exif_FileType | TXT |\n| exif_FileTypeExtension | txt |\n| exif_LineCount | 77 |\n| exif_MIMEEncoding | utf-8 |\n| exif_MIMEType | text/plain |\n| exif_Newlines | Unix LF |\n| exif_WordCount | 700 |\n| last_updated | 2025-12-01 |\n| publication_date | 2025-05-15 |\n| status | current |\n| title | Self-employment and Housing Benefit: how income is assessed |\n| type | guidance |\n\n## Related Notes\n\n- [Knowledge base index](../index.md)\n- [Lint report](../lint-report.md)"},"sources/doc-sb-007-statutory-sick-pay-ssp-employer-guide.md":{"id":"sources/doc-sb-007-statutory-sick-pay-ssp-employer-guide.md","type":"Source","title":"Statutory Sick Pay (SSP): employer guide","description":"Source note for DOC-SB-007: Statutory Sick Pay (SSP): employer guide.","timestamp":"2025-09-01","aliases":"DOC-SB-007;Statutory Sick Pay (SSP): employer guide;DOC-SB-007-statutory-sick-pay","section":"sources","source":"challenge-2/wiki/sources/doc-sb-007-statutory-sick-pay-ssp-employer-guide.md","body":"# Statutory Sick Pay (SSP): employer guide\n## Summary\n\n- Source: [DOC-SB-007-statutory-sick-pay.html](../../structured_files/DOC-SB-007-statutory-sick-pay.html)\n- Extraction: `pandoc-html` with `high` quality.\n- Extract: <div id=\"ssp-rates\" class=\"section\"> Current SSP rates and qualifying days SSP is paid for qualifying days only. Qualifying days are the days on which the employee would normally be required to work under their contract of employment. Tax year Weekly rate Daily rate (5 qualifying days) Daily rate (6 qualifying days) ---- ---- ---- ---- 2025-26 £116.75 £23.35 £19.46 2024-25 £109.40 £21.88 £18.23 SSP rates from April 2025 {.govuk-table} SSP is payable for up to 28 weeks in a single period of incapacity for work. The first 3 qualifying days in any period of incapacity are \"waiting days\" during which SSP is not payable. </div> <div...\n\n## Metadata\n\n| Field | Value |\n| --- | --- |\n| Source ID | DOC-SB-007 |\n| Title | Statutory Sick Pay (SSP): employer guide |\n| Raw source | [DOC-SB-007-statutory-sick-pay.html](../../structured_files/DOC-SB-007-statutory-sick-pay.html) |\n| Format | html |\n| Document type | guidance |\n| Department | [Government Department D] |\n| Owner |  |\n| Status | current |\n| Version |  |\n| Publication date | 2025-09-01 |\n| Last updated | 2025-09-01 |\n| Audience | Employers |\n| Topics | housing-benefit, council-tax-reduction, employment-rights-and-flexible-working |\n| Data origin | Challenge 2 corpus data is synthetic hackathon fixture data. |\n| Contains real personal data | false |\n| Contains synthetic identifiers | false |\n| SHA-256 | 0ba8d55e8bfd65b9e1418ebfb0877102d752696f0cff5afcd2f3206a76edfbe1 |\n\n## Related Sources\n\n- [DOC-HB-001](doc-hb-001-housing-benefit-check-if-you-re-eligible-gov-uk.md) - Housing Benefit: Check if you're eligible - GOV.UK\n- [DOC-SB-005](doc-sb-005-employment-rights-act-1996-plain-english-summary.md) - Employment Rights Act 1996: Plain-English Summary\n\n## Navigation\n\n- Topic: [Housing Benefit](../topics/housing-benefit.md)\n- Topic: [Council Tax Reduction](../topics/council-tax-reduction.md)\n- Topic: [Employment Rights And Flexible Working](../topics/employment-rights-and-flexible-working.md)\n- Entity: [Local Authorities](../entities/local-authorities.md)\n\n## Extracted Content\n\n<div id=\"ssp-rates\" class=\"section\">\n\n## Current SSP rates and qualifying days\n\nSSP is paid for qualifying days only. Qualifying days are the days on which the employee would normally be required to work under their contract of employment.\n\n| Tax year | Weekly rate | Daily rate (5 qualifying days) | Daily rate (6 qualifying days) |\n|----|----|----|----|\n| 2025-26 | £116.75 | £23.35 | £19.46 |\n| 2024-25 | £109.40 | £21.88 | £18.23 |\n\nSSP rates from April 2025 {.govuk-table}\n\nSSP is payable for up to 28 weeks in a single period of incapacity for work. The first 3 qualifying days in any period of incapacity are \"waiting days\" during which SSP is not payable.\n\n</div>\n\n<div id=\"qualifying-conditions\" class=\"section\">\n\n## Qualifying conditions\n\nAn employee qualifies for SSP if all of the following conditions are met:\n\n- They are classed as an employee and have done some work for you\n- They have been off work sick for 4 or more consecutive days (including non-working days)\n- They earn an average of at least £123 per week (the Lower Earnings Limit for 2025-26)\n- They have notified you of their sickness within the required deadline\n\n</div>\n\n<div id=\"employee-duties\" class=\"section\">\n\n## Employee duties\n\nEmployees are responsible for notifying their employer of their incapacity in a timely manner. **Employees must notify their employer within 7 days of the first day of incapacity.** If the employer has an agreed notification procedure (for example, telephoning a specific number by a particular time), the employee should follow that procedure where reasonably practicable.\n\nFor absences lasting more than 7 days, the employee should provide a \"fit note\" (Statement of Fitness for Work) from a doctor, registered nurse, pharmacist, physiotherapist, or occupational therapist. For absences of 7 days or fewer, the employer may accept self-certification.\n\nWhere the employee is also claiming other state benefits, they should inform both their employer and the relevant benefit office of the period of sickness. This is particularly important for employees receiving Housing Benefit, as periods of sickness absence may affect their income-based benefit calculations (see [DOC-HB-001: Housing Benefit eligibility and rates](doc-hb-001-housing-benefit-check-if-you-re-eligible-gov-uk.md)).\n\n</div>\n\n<div id=\"employer-obligations\" class=\"section\">\n\n## Employer obligations\n\nEmployers must pay SSP to qualifying employees from the fourth qualifying day of sickness absence. Payment should be made on the employee's normal payday and is subject to tax and National Insurance deductions in the usual way.\n\nEmployers should note that employees have **up to 28 days to provide notification of incapacity**, after which SSP may be withheld. Employers must not withhold SSP on the grounds of late notification if the employee has provided notice within this period, unless the employer has a contractual notification procedure and the employee has unreasonably failed to follow it.\n\nIf an employer decides to withhold SSP, they must issue the employee with form SSP1 explaining the reasons. The employee can then apply to \\[DEPT-D\\] for a formal decision.\n\n</div>\n\n<div id=\"record-keeping\" class=\"section\">\n\n## Record-keeping\n\nEmployers are no longer required to keep specific SSP records (the previous requirement to maintain form SSP2 was abolished in 2014). However, \\[DEPT-D\\] strongly recommends that employers maintain records of:\n\n- Dates of each employee's period of incapacity for work\n- The amount of SSP paid and the dates of payment\n- Any dates within a period of incapacity that SSP was not paid and the reasons\n- Fit notes and self-certification documents received\n\nThese records should be retained for at least 3 years after the end of the tax year to which they relate.\n\n</div>\n\n<div id=\"occupational-sick-pay\" class=\"section\">\n\n## Interaction with occupational sick pay\n\nMany employers operate their own occupational sick pay (OSP) schemes that provide more generous payments than SSP. Where an employer pays OSP that equals or exceeds the SSP rate, the employer is treated as having paid SSP and has no further SSP liability for that period.\n\nIf the OSP scheme pays less than the SSP rate, the employer must \"top up\" the payment to at least the SSP rate for the duration of the SSP entitlement period. The OSP and SSP amounts should be clearly identified on the employee's payslip.\n\n</div>\n\n<div id=\"benefits-interaction\" class=\"section\">\n\n## What if your employee is also claiming benefits?\n\nEmployees who are receiving Statutory Sick Pay may also be entitled to means-tested benefits such as Housing Benefit or Council Tax Reduction. SSP counts as earned income for the purposes of calculating these benefits. The local authority will take the employee's SSP into account when assessing their Housing Benefit entitlement under the standard means test. For further details on how income from employment affects Housing Benefit, see [DOC-HB-001: Housing Benefit eligibility and rates](doc-hb-001-housing-benefit-check-if-you-re-eligible-gov-uk.md).\n\nEmployers are not required to notify the local authority that an employee is receiving SSP, but should be prepared to provide confirmation of SSP payments if requested by the employee or the local authority for benefit assessment purposes.\n\n</div>\n\n<div id=\"related-guidance\" class=\"section\">\n\n## Related guidance\n\n- [DOC-SB-005: Employer obligations overview](doc-sb-005-employment-rights-act-1996-plain-english-summary.md)\n\n</div>\n\n## Raw Metadata\n\n| Field | Value |\n| --- | --- |\n| audience | Employers |\n| department | [Government Department D] |\n| document-id | DOC-SB-007 |\n| exif_Audience | Employers |\n| exif_Department | [Government Department D] |\n| exif_DocumentId | DOC-SB-007 |\n| exif_ExifToolVersion | 13.55 |\n| exif_FileModifyDate | 2026:04:16 16:01:34+01:00 |\n| exif_FileName | DOC-SB-007-statutory-sick-pay.html |\n| exif_FilePermissions | -rw-r--r-- |\n| exif_FileSize | 8.2 kB |\n| exif_FileType | HTML |\n| exif_FileTypeExtension | html |\n| exif_LastUpdated | 2025-09-01 |\n| exif_MIMEType | text/html |\n| exif_PublicationDate | 2025-09-01 |\n| exif_Status | current |\n| exif_Title | Statutory Sick Pay (SSP): employer guide |\n| exif_Type | guidance |\n| last-updated | 2025-09-01 |\n| publication-date | 2025-09-01 |\n| status | current |\n| title | Statutory Sick Pay (SSP): employer guide |\n| type | guidance |\n\n## Related Notes\n\n- [Knowledge base index](../index.md)\n- [Lint report](../lint-report.md)"},"sources/doc-sb-008-employer-duties-under-the-homelessness-reduction-act-20.md":{"id":"sources/doc-sb-008-employer-duties-under-the-homelessness-reduction-act-20.md","type":"Source","title":"Employer duties under the Homelessness Reduction Act 2017","description":"Source note for DOC-SB-008: Employer duties under the Homelessness Reduction Act 2017.","timestamp":"15/11/2025","aliases":"DOC-SB-008;Employer duties under the Homelessness Reduction Act 2017;DOC-SB-008-employer-duties-homelessness","section":"sources","source":"challenge-2/wiki/sources/doc-sb-008-employer-duties-under-the-homelessness-reduction-act-20.md","body":"# Employer duties under the Homelessness Reduction Act 2017\n## Summary\n\n- Source: [DOC-SB-008-employer-duties-homelessness.html](../../structured_files/DOC-SB-008-employer-duties-homelessness.html)\n- Extraction: `pandoc-html` with `high` quality.\n- Extract: <div id=\"overview\" class=\"section\"> Overview The Homelessness Reduction Act 2017 introduced a \"duty to refer\" for specified public authorities. While private-sector employers are not subject to the statutory duty to refer, the government strongly encourages all employers to play an active role in identifying and supporting employees who may be experiencing or at risk of homelessness. This guidance explains when and how employers should make referrals, what support is available, and what rights employees have when facing housing difficulties. It is jointly published by the \\[Government Department A\\] and the \\[Government Department B\\] to...\n\n## Metadata\n\n| Field | Value |\n| --- | --- |\n| Source ID | DOC-SB-008 |\n| Title | Employer duties under the Homelessness Reduction Act 2017 |\n| Raw source | [DOC-SB-008-employer-duties-homelessness.html](../../structured_files/DOC-SB-008-employer-duties-homelessness.html) |\n| Format | html |\n| Document type | guidance |\n| Department | [DEPT-A] / [DEPT-B] |\n| Owner |  |\n| Status | current |\n| Version |  |\n| Publication date | 15/11/2025 |\n| Last updated |  |\n| Audience | Employers and employees |\n| Topics | homelessness-and-social-housing, employment-rights-and-flexible-working, foi-and-transparency, people-policies, incident-risk-and-assurance |\n| Data origin | Challenge 2 corpus data is synthetic hackathon fixture data. |\n| Contains real personal data | false |\n| Contains synthetic identifiers | false |\n| SHA-256 | bf90eee8b8467509229342bf018c4786ff143607f2e1fd4759f561062a4e01c1 |\n\n## Related Sources\n\n- [DOC-HB-005](doc-hb-005-homelessness-prevention-and-relief-local-authority-duti.md) - Homelessness Prevention and Relief: Local Authority Duties and Assessment Procedures\n- [DOC-SB-005](doc-sb-005-employment-rights-act-1996-plain-english-summary.md) - Employment Rights Act 1996: Plain-English Summary\n\n## Navigation\n\n- Topic: [Homelessness And Social Housing](../topics/homelessness-and-social-housing.md)\n- Topic: [Employment Rights And Flexible Working](../topics/employment-rights-and-flexible-working.md)\n- Topic: [FOI And Transparency](../topics/foi-and-transparency.md)\n- Topic: [People Policies](../topics/people-policies.md)\n- Topic: [Incident Risk And Assurance](../topics/incident-risk-and-assurance.md)\n- Entity: [Local Authorities](../entities/local-authorities.md)\n- Entity: [Homelessness Reduction Act 2017](../entities/homelessness-reduction-act-2017.md)\n\n## Extracted Content\n\n<div id=\"overview\" class=\"section\">\n\n## Overview\n\nThe Homelessness Reduction Act 2017 introduced a \"duty to refer\" for specified public authorities. While private-sector employers are not subject to the statutory duty to refer, the government strongly encourages all employers to play an active role in identifying and supporting employees who may be experiencing or at risk of homelessness.\n\nThis guidance explains when and how employers should make referrals, what support is available, and what rights employees have when facing housing difficulties. It is jointly published by the \\[Government Department A\\] and the \\[Government Department B\\] to ensure that both housing and employment perspectives are covered.\n\n</div>\n\n<div id=\"identifying-risk\" class=\"section\">\n\n## Identifying employees at risk\n\n**For employers:** You should be alert to signs that an employee may be at risk of homelessness. These may include requests for salary advances, frequent changes of address, arriving at work unusually early or leaving unusually late, or disclosures during welfare conversations. Employers should foster a workplace culture where employees feel safe to disclose housing difficulties without fear of adverse consequences.\n\n**For employees:** If you are worried about losing your home or have already lost your accommodation, your employer may be able to help. You do not have to tell your employer about your housing situation, but doing so may allow them to make adjustments to support you or to refer you to your local authority's housing team for assistance. Your employer cannot dismiss you or treat you unfairly because you are homeless or at risk of homelessness.\n\n</div>\n\n<div id=\"making-referrals\" class=\"section\">\n\n## Making a referral\n\n**For employers:** If an employee consents to a referral, you should contact the housing options team at the local authority where the employee has a local connection (usually where they are currently living or were last settled). The referral should include the employee's name, contact details, and a brief description of their housing circumstances, but only information that the employee has agreed to share. Most local authorities accept referrals by email or through an online referral form on their website.\n\n**For employees:** Your employer can only make a referral to the local housing authority with your consent. You have the right to refuse a referral at any time. If you prefer, you can contact the local authority's housing options team directly. You can find the housing team for your area by visiting your local council's website or by calling the national housing advice line.\n\nWhen a referral is received, the local authority has a duty to assess the individual's housing needs within a reasonable period and to work with them to develop a personalised housing plan. For further information on the assessment process and available support, see [DOC-HB-005: Homelessness prevention and relief](doc-hb-005-homelessness-prevention-and-relief-local-authority-duti.md).\n\n</div>\n\n<div id=\"employer-support\" class=\"section\">\n\n## Supporting employees in the workplace\n\n**For employers:** Beyond making referrals, employers can take practical steps to support employees facing housing instability. These include offering flexible working arrangements to accommodate temporary accommodation locations, providing access to employee assistance programmes, allowing use of workplace addresses for correspondence, and considering discretionary advances on pay where appropriate. You should review your existing employment policies to ensure they do not inadvertently disadvantage employees who are homeless or in temporary accommodation.\n\n**For employees:** You may be entitled to request flexible working arrangements under the statutory right to request flexible working (see [DOC-SB-005: Employer obligations overview](doc-sb-005-employment-rights-act-1996-plain-english-summary.md)). If you are placed in temporary accommodation that is far from your usual workplace, speak to your manager or HR department about whether adjustments can be made to your working pattern or location. Your employer should treat any request sympathetically and in confidence.\n\n</div>\n\n<div id=\"legal-protections\" class=\"section\">\n\n## Legal protections\n\nWhile homelessness is not a protected characteristic under the Equality Act 2010, employees who are homeless or at risk of homelessness may also have protected characteristics (such as disability or pregnancy) that are relevant to their housing situation. Employers must ensure that their treatment of employees facing housing difficulties does not amount to direct or indirect discrimination on any protected ground.\n\nDismissing an employee or subjecting them to a detriment because they are homeless may, depending on the circumstances, give rise to claims of unfair dismissal or whistleblowing detriment. Employers should seek legal advice before taking any adverse employment action against an employee who has disclosed housing difficulties.\n\n</div>\n\n<div id=\"related-guidance\" class=\"section\">\n\n## Related guidance\n\n- [DOC-HB-005: Homelessness prevention and relief](doc-hb-005-homelessness-prevention-and-relief-local-authority-duti.md)\n- [DOC-SB-005: Employer obligations overview](doc-sb-005-employment-rights-act-1996-plain-english-summary.md)\n\n</div>\n\n## Raw Metadata\n\n| Field | Value |\n| --- | --- |\n| audience | Employers and employees |\n| department | [DEPT-A] / [DEPT-B] |\n| document-id | DOC-SB-008 |\n| exif_Audience | Employers and employees |\n| exif_Department | [DEPT-A] / [DEPT-B] |\n| exif_DocumentId | DOC-SB-008 |\n| exif_ExifToolVersion | 13.55 |\n| exif_FileModifyDate | 2026:04:16 16:01:34+01:00 |\n| exif_FileName | DOC-SB-008-employer-duties-homelessness.html |\n| exif_FilePermissions | -rw-r--r-- |\n| exif_FileSize | 6.9 kB |\n| exif_FileType | HTML |\n| exif_FileTypeExtension | html |\n| exif_MIMEType | text/html |\n| exif_PublicationDate | 15/11/2025 |\n| exif_Status | current |\n| exif_Title | Employer duties under the Homelessness Reduction Act 2017 |\n| exif_Type | guidance |\n| publication-date | 15/11/2025 |\n| status | current |\n| title | Employer duties under the Homelessness Reduction Act 2017 |\n| type | guidance |\n\n## Related Notes\n\n- [Knowledge base index](../index.md)\n- [Lint report](../lint-report.md)"},"sources/doc-sb-009-right-to-request-flexible-working-frequently-asked-ques.md":{"id":"sources/doc-sb-009-right-to-request-flexible-working-frequently-asked-ques.md","type":"Source","title":"Right to request flexible working: frequently asked questions","description":"Source note for DOC-SB-009: Right to request flexible working: frequently asked questions.","timestamp":"2025-10-01","aliases":"DOC-SB-009;Right to request flexible working: frequently asked questions;DOC-SB-009-flexible-working","section":"sources","source":"challenge-2/wiki/sources/doc-sb-009-right-to-request-flexible-working-frequently-asked-ques.md","body":"# Right to request flexible working: frequently asked questions\n## Summary\n\n- Source: [DOC-SB-009-flexible-working.md](../../structured_files/DOC-SB-009-flexible-working.md)\n- Extraction: `markdown-frontmatter` with `high` quality.\n- Extract: Right to request flexible working: frequently asked questions This document answers common questions about the statutory right to request flexible working. The right was significantly expanded by the Employment Relations (Flexible Working) Act 2023, which came into force on 6 April 2024. --- Q1. Who has the right to request flexible working? All employees have the right to request flexible working from the first day of their employment. The previous requirement to have 26 weeks of continuous service was removed on 6 April 2024. Agency workers, contractors, and other non-employees do not have the statutory right, but may be able to make...\n\n## Metadata\n\n| Field | Value |\n| --- | --- |\n| Source ID | DOC-SB-009 |\n| Title | Right to request flexible working: frequently asked questions |\n| Raw source | [DOC-SB-009-flexible-working.md](../../structured_files/DOC-SB-009-flexible-working.md) |\n| Format | md |\n| Document type | faq |\n| Department | [Government Department B] |\n| Owner |  |\n| Status | current |\n| Version |  |\n| Publication date | 2025-10-01 |\n| Last updated |  |\n| Audience | Employees and employers |\n| Topics | employment-rights-and-flexible-working, people-policies |\n| Data origin | Challenge 2 corpus data is synthetic hackathon fixture data. |\n| Contains real personal data | false |\n| Contains synthetic identifiers | false |\n| SHA-256 | 73ecad42b16c3226698541ee97fa48f06fe095e42c98d4313cbf66b76eac3ca0 |\n\n## Related Sources\n\n- [DOC-SB-005](doc-sb-005-employment-rights-act-1996-plain-english-summary.md) - Employment Rights Act 1996: Plain-English Summary\n\n## Navigation\n\n- Topic: [Employment Rights And Flexible Working](../topics/employment-rights-and-flexible-working.md)\n- Topic: [People Policies](../topics/people-policies.md)\n- Entity: [Employment Rights Act 1996](../entities/employment-rights-act-1996.md)\n\n## Extracted Content\n\n# Right to request flexible working: frequently asked questions\n\nThis document answers common questions about the statutory right to request flexible working. The right was significantly expanded by the Employment Relations (Flexible Working) Act 2023, which came into force on 6 April 2024.\n\n---\n\n**Q1. Who has the right to request flexible working?**\n\nAll employees have the right to request flexible working from the first day of their employment. The previous requirement to have 26 weeks of continuous service was removed on 6 April 2024. Agency workers, contractors, and other non-employees do not have the statutory right, but may be able to make informal requests.\n\n---\n\n**Q2. What types of flexible working can I request?**\n\nYou can request any change to the terms and conditions of your employment that relates to:\n\n- The hours you are required to work\n- The times when you are required to work\n- The place where you are required to work (including working from home)\n- Any combination of the above\n\nCommon types of flexible working include part-time working, compressed hours, flexitime, annualised hours, staggered hours, job sharing, and remote or hybrid working.\n\n---\n\n**Q3. How many requests can I make?**\n\nEmployees may make up to 2 statutory requests in any 12-month period. Each request must be made in writing, must be dated, and must state that it is a statutory request made under section 80F of the Employment Rights Act 1996.\n\n---\n\n**Q4. Does my employer have to agree to my request?**\n\nNo. The right is a right to request, not a right to have. However, your employer must deal with your request in a reasonable manner and must make a decision within 2 months of receiving the request (unless you agree to a longer period). An employer may only refuse a request on one or more of the 8 statutory grounds set out in the legislation.\n\n---\n\n**Q5. What are the statutory grounds for refusal?**\n\nAn employer may refuse a flexible working request only on one or more of the following grounds:\n\n- The burden of additional costs\n- A detrimental effect on ability to meet customer demand\n- An inability to reorganise work among existing staff\n- An inability to recruit additional staff\n- A detrimental impact on quality\n- A detrimental impact on performance\n- Insufficiency of work during the periods the employee proposes to work\n- Planned structural changes\n\nThe employer must consult with the employee before refusing a request. This consultation requirement was introduced by The Flexible Working Regulations 2014 (SI 2014/1398) and strengthened by the 2023 Act.\n\n---\n\n**Q6. What happens if my employer does not follow the correct process?**\n\nIf your employer fails to deal with your request in a reasonable manner, fails to notify you of their decision within the statutory time limit, or rejects your request on grounds other than the 8 permitted statutory reasons, you may bring a complaint to an employment tribunal. The tribunal may order the employer to reconsider the request and may award compensation of up to 8 weeks' pay.\n\n---\n\n**Q7. Can my employer dismiss me for making a flexible working request?**\n\nDismissing an employee because they made a flexible working request would normally be treated as automatic unfair dismissal. Similarly, subjecting an employee to any detriment (such as denial of promotion, reduction in hours, or exclusion from projects) because they made a request is unlawful. You are protected from the point at which you submit the request.\n\n---\n\n**Q8. I am a carer. Do I have any additional rights?**\n\nThe Carer's Leave Act 2023 gives employees who are carers the right to take up to one week of unpaid leave per year for caring purposes. While this is separate from flexible working, employees who have caring responsibilities may find it helpful to combine a flexible working request with their entitlement to carer's leave. Employers should consider caring responsibilities sympathetically when assessing flexible working requests.\n\n---\n\n**Q9. Can I withdraw my request?**\n\nYes. You may withdraw a statutory flexible working request at any time before the employer has made a decision. If you withdraw your request, it still counts as one of your 2 permitted requests in the 12-month period. You should withdraw the request in writing and keep a copy for your records.\n\n---\n\n**Q10. My employer has agreed to my request. Can they change their mind later?**\n\nOnce an employer has agreed to a flexible working request, the change becomes a permanent variation to the employee's contract of employment, unless both parties have agreed that the change will be for a trial period or a fixed duration. The employer cannot unilaterally reverse the change without the employee's agreement. Any attempt to do so may amount to a breach of contract or constructive dismissal. For wider information on employer duties, see [DOC-SB-005: Employer obligations overview](doc-sb-005-employment-rights-act-1996-plain-english-summary.md).\n\n## Raw Metadata\n\n| Field | Value |\n| --- | --- |\n| audience | Employees and employers |\n| department | [Government Department B] |\n| document_id | DOC-SB-009 |\n| exif_ExifToolVersion | 13.55 |\n| exif_FileModifyDate | 2026:04:16 16:01:34+01:00 |\n| exif_FileName | DOC-SB-009-flexible-working.md |\n| exif_FilePermissions | -rw-r--r-- |\n| exif_FileSize | 5.2 kB |\n| exif_FileType | TXT |\n| exif_FileTypeExtension | txt |\n| exif_LineCount | 91 |\n| exif_MIMEEncoding | us-ascii |\n| exif_MIMEType | text/plain |\n| exif_Newlines | Unix LF |\n| exif_WordCount | 834 |\n| publication_date | 2025-10-01 |\n| status | current |\n| title | Right to request flexible working: frequently asked questions |\n| type | faq |\n\n## Related Notes\n\n- [Knowledge base index](../index.md)\n- [Lint report](../lint-report.md)"},"sources/doc-sb-010-small-business-survey-2025-annual-findings.md":{"id":"sources/doc-sb-010-small-business-survey-2025-annual-findings.md","type":"Source","title":"Small Business Survey 2025: annual findings","description":"Source note for DOC-SB-010: Small Business Survey 2025: annual findings.","timestamp":"2026-02-15","aliases":"DOC-SB-010;Small Business Survey 2025: annual findings;DOC-SB-010-small-business-survey-2025","section":"sources","source":"challenge-2/wiki/sources/doc-sb-010-small-business-survey-2025-annual-findings.md","body":"# Small Business Survey 2025: annual findings\n## Summary\n\n- Source: [DOC-SB-010-small-business-survey-2025.html](../../structured_files/DOC-SB-010-small-business-survey-2025.html)\n- Extraction: `pandoc-html` with `high` quality.\n- Extract: <div id=\"key-findings\" class=\"section\"> Key findings The 2025 Small Business Survey was conducted between September and November 2025, with responses from 8,472 SMEs across England. The survey covers businesses with 0 to 249 employees and provides evidence to support the design of business policy, access to finance initiatives, and employment support programmes. Key findings include a continued increase in the proportion of micro businesses (0-9 employees), modest employment growth in the technology and professional services sectors, and a notable decline in business confidence in the North East and Yorkshire and Humber regions compared to...\n\n## Metadata\n\n| Field | Value |\n| --- | --- |\n| Source ID | DOC-SB-010 |\n| Title | Small Business Survey 2025: annual findings |\n| Raw source | [DOC-SB-010-small-business-survey-2025.html](../../structured_files/DOC-SB-010-small-business-survey-2025.html) |\n| Format | html |\n| Document type | statistical-bulletin |\n| Department | [Government Department B] |\n| Owner |  |\n| Status | current |\n| Version |  |\n| Publication date | 2026-02-15 |\n| Last updated | 2026-02-15 |\n| Audience | Policy officials, business support organisations, researchers |\n| Topics | small-business-and-self-employment |\n| Data origin | Challenge 2 corpus data is synthetic hackathon fixture data. |\n| Contains real personal data | false |\n| Contains synthetic identifiers | false |\n| SHA-256 | bd0113111b9a62c3410bf47e8eb1bee266ae960814b59ce1bfcbba676518f2b8 |\n\n## Related Sources\n\n- [DOC-SB-001](doc-sb-001-starting-a-business-in-the-uk-step-by-step.md) - Starting a Business in the UK: Step by Step\n- [DOC-SB-003](doc-sb-003-national-minimum-wage-and-national-living-wage-employer.md) - National Minimum Wage and National Living Wage: Employer Guidance\n\n## Navigation\n\n- Topic: [Small Business And Self-employment](../topics/small-business-and-self-employment.md)\n\n## Extracted Content\n\n<div id=\"key-findings\" class=\"section\">\n\n## Key findings\n\nThe 2025 Small Business Survey was conducted between September and November 2025, with responses from 8,472 SMEs across England. The survey covers businesses with 0 to 249 employees and provides evidence to support the design of business policy, access to finance initiatives, and employment support programmes.\n\nKey findings include a continued increase in the proportion of micro businesses (0-9 employees), modest employment growth in the technology and professional services sectors, and a notable decline in business confidence in the North East and Yorkshire and Humber regions compared to the previous year.\n\n</div>\n\n<div id=\"business-demographics\" class=\"section\">\n\n## Table 1: Business demographics by size band\n\n| Size band | Number of businesses | Percentage of all SMEs | Total employment | Average employees per business |\n|----|----|----|----|----|\n| Micro (0-9 employees) | 5,284,000 | 95.4% | 8,912,000 | 1.7 |\n| Small (10-49 employees) | 211,000 | 3.8% | 4,187,000 | 19.8 |\n| Medium (50-249 employees) | 42,000 | 0.8% | 4,261,000 | 101.5 |\n| **All SMEs** | **5,537,000** | **100.0%** | **17,360,000** | **3.1** |\n\nEstimated number of SMEs in England by size band, 2025 {.govuk-table}\n\n</div>\n\n<div id=\"employment-growth\" class=\"section\">\n\n## Table 2: Employment growth by sector (year-on-year change)\n\n| Sector | SMEs reporting growth (%) | SMEs reporting decline (%) | Net balance (%) | Estimated net jobs created |\n|----|----|----|----|----|\n| Construction | 22% | 18% | +4% | 31,000 |\n| Retail | 15% | 24% | -9% | -47,000 |\n| Professional services | 28% | 12% | +16% | 89,000 |\n| Technology | 35% | 10% | +25% | 62,000 |\n| Manufacturing | 19% | 21% | -2% | -12,000 |\n\nNet employment growth in SMEs by sector, 2024-2025 {.govuk-table}\n\n</div>\n\n<div id=\"business-confidence\" class=\"section\">\n\n## Table 3: Business confidence index by region\n\nThe confidence index is calculated from responses to questions on expected turnover, employment, and investment over the next 12 months. A score above 100 indicates net optimism; below 100 indicates net pessimism.\n\n| Region | Confidence index (2025) | Confidence index (2024) | Year-on-year change |\n|----|----|----|----|\n| London | 112 | 108 | +4 |\n| South East | 109 | 107 | +2 |\n| South West | 104 | 102 | +2 |\n| East of England | 106 | 104 | +2 |\n| East Midlands | 101 | 100 | +1 |\n| West Midlands | 99 | 101 | -2 |\n| North West | 97 | 99 | -2 |\n| Yorkshire and the Humber | 93 | 100 | -7 |\n| North East | 88 | 96 | -8 |\n\nSME Business Confidence Index by English region, 2025 {.govuk-table}\n\n</div>\n\n<div id=\"methodology\" class=\"section\">\n\n## Methodology\n\nThe Small Business Survey is conducted annually by the \\[Government Department B\\]. The 2025 survey was administered online and by telephone between 4 September and 28 November 2025. The sample was drawn from the Inter-Departmental Business Register (IDBR) and stratified by size band, sector, and region to ensure representativeness.\n\nA total of 8,472 valid responses were received, representing an overall response rate of 28.3%. Results have been weighted to reflect the known population of SMEs in England based on the latest Business Population Estimates. Confidence intervals for headline figures are within +/- 1.5 percentage points at the 95% confidence level.\n\n</div>\n\n<div id=\"data-quality\" class=\"section\">\n\n## Data quality and caveats\n\nUsers of these statistics should note the following caveats:\n\n- The survey covers registered SMEs in England only. Unregistered businesses (those below the VAT and PAYE thresholds with no employees) are not included in the IDBR sampling frame and are therefore excluded.\n- Sector-level estimates have wider confidence intervals than headline figures and should be treated with caution, particularly for sectors with fewer than 500 respondents.\n- The regional confidence index is based on subjective assessments by respondents and may not correspond directly to objective economic indicators such as GVA or employment data from the ONS.\n- Year-on-year comparisons should take account of changes to the survey methodology introduced in 2024, including the addition of an online response option and revisions to the sampling strategy.\n- Some respondents may have been affected by seasonal factors at the time of completing the survey (September to November), particularly in sectors such as retail and construction.\n\nFor further information on the methodology and data quality, contact the \\[DEPT-B\\] Small Business Statistics team at <%5Bstatistics-team%5D@%5Bdepartment%5D.gov.uk>.\n\n</div>\n\n<div id=\"related-guidance\" class=\"section\">\n\n## Related publications\n\n- [DOC-SB-001: Starting a small business in the UK](doc-sb-001-starting-a-business-in-the-uk-step-by-step.md)\n- [DOC-SB-003: Access to finance for small businesses](doc-sb-003-national-minimum-wage-and-national-living-wage-employer.md)\n\n</div>\n\n## Raw Metadata\n\n| Field | Value |\n| --- | --- |\n| audience | Policy officials, business support organisations, researchers |\n| department | [Government Department B] |\n| document-id | DOC-SB-010 |\n| exif_Audience | Policy officials, business support organisations, researchers of\n[DEPT-C]\n         IT — including employees, contractors, agency staff, and secondees.\n\nFailure to comply with this policy may result in disciplinary action, termination of contract, or criminal\nprosecution.\n\n\n\n2. Acceptable Use\n[DEPT-C]\n           IT systems are provided for business purposes. Limited personal use is permitted provided it does\nnot:\n\n           • Interfere with work duties\n\n           • Incur cost to the department\n\n           • Bring the department into disrepute\n                                [DEPT-C]\n           • Breach any other              policy\n\n\n\n3. Email\n\n3.1 Official email\n                                                               [DEPT-C\nAll official correspondence must use your @]      .gov.uk email address. The Department’s email system is\n                                 [DEPT-C]\nMicrosoft Outlook, hosted on the          Exchange server.\n\n           [NOTE TO SELF: Check if we've fully migrated to M365 yet. Some teams still on on-prem Exchange as\n           of March 2022. Update before publication if migration complete.]\n\n\n3.2 Email classification\n\nAll emails must carry the appropriate classification marking in the subject line.\n\nOFFICIAL — no marking required (default)\n\nOFFICIAL–SENSITIVE — mark in subject line\n\nSECRET and above — must not be sent via email; use the secure network\n\f3.3 Personal email\n                                                                             [DEPT-C]              [DEPT-C]\nPersonal webmail (Gmail, Hotmail, Yahoo, etc.) must not be accessed on                  devices.              data must\nnever be sent to personal email addresses.\n\n\n\n4. Internet\n\nInternet access is provided through a filtered connection. The following categories of website are blocked:\n\n      • Adult content\n\n      • Gambling\n\n      • Social media (see section 6)\n\n      • Streaming media (except approved platforms)\n\n      • File sharing and cloud storage (except approved services)\n\nAttempts to bypass web filtering (using VPNs, proxy sites, Tor, etc.) are a serious breach of this policy and\nwill be treated as a security incident.\n\n\n\n5. Software\n                                         [DEPT-C]\nUsers must not install software on     devices without approval from the IT Service Desk. This includes:\ndesktop applications, browser extensions, mobile apps on department-issued phones.\n\nApproved software is listed in the Software Catalogue on the IT intranet page.\n\n      [The Software Catalogue was decommissioned in 2023 and replaced by the Digital Marketplace. This\n      reference is outdated.]\n\n\n\n6. Social Media\n                                                                                                      [DEPT-C]\nAccess to social media platforms (Facebook, Twitter, Instagram, LinkedIn) is blocked on the       network\nfor most users. Exceptions may be granted for staff in Communications or Digital roles who require access\nfor official purposes.\n\nSee the separate Social Media Guidance for Staff for detailed guidance.\n\n\n\n7. Remote Working\n\nWhen working remotely, users must:\n                          [DEPT-C]\n      • Connect via the              VPN (Cisco AnyConnect)\n\n      • Not use public Wi-Fi without the VPN active\n\n      • Ensure household members cannot see their screen\n\n      • Lock devices when stepping away\n\f           [NOTE: The VPN client is being replaced by Zscaler Internet Access (ZIA) — rollout began Q1 2023.\n           Both are currently in use depending on the user’s device build. This section needs updating to reflect\n           dual running.]\n\n\n\n8. Monitoring\n[DEPT-C]\n      reserves the right to monitor all use of its IT systems. This includes: email content and metadata,\ninternet browsing history, file access and transfers, login times and locations.\n\nMonitoring is carried out in accordance with the Regulation of Investigatory Powers Act 2000 (RIPA) and\nthe Investigatory Powers Act 2016. Monitoring data is retained for 12 months.\n\n\n\n9. Reporting\n\nAny suspected breach of this policy or IT security incident must be reported immediately to:\n\nIT Service Desk: 0800 XXX XXXX\n                                          [DEPT-C\nSecurity Operations Centre: soc@]                   .gov.uk\n\n\n\n10. Review\n\nThis policy is reviewed every two years.\n\nLast review: June 2022 | Next review: June 2024\n\n           [This review has not taken place. The policy is overdue for update.]\n\n## Raw Metadata\n\n| Field | Value |\n| --- | --- |\n| Author | (anonymous) |\n| CreationDate | Tue Apr 14 09:58:50 2026 BST |\n| Creator | (unspecified) |\n| Custom Metadata | no |\n| Encrypted | no |\n| File size | 6767 bytes |\n| Form | none |\n| JavaScript | no |\n| Keywords |  |\n| Metadata Stream | no |\n| ModDate | Tue Apr 14 09:58:50 2026 BST |\n| Optimized | no |\n| PDF version | 1.4 |\n| Page rot | 0 |\n| Page size | 595.276 x 841.89 pts (A4) |\n| Pages | 3 |\n| Producer | ReportLab PDF Library - (opensource) |\n| Subject | (unspecified) |\n| Suspects | no |\n| Tagged | no |\n| Title | (anonymous) |\n| UserProperties | no |\n| exif_Author | (anonymous) |\n| exif_CreateDate | 2026:04:14 08:58:50+00:00 |\n| exif_Creator | (unspecified) |\n| exif_ExifToolVersion | 13.55 |\n| exif_FileModifyDate | 2026:04:16 16:01:34+01:00 |\n| exif_FileName | Acceptable_Use_Policy_IT_Systems.pdf |\n| exif_FilePermissions | -rw-r--r-- |\n| exif_FileSize | 6.8 kB |\n| exif_FileType | PDF |\n| exif_FileTypeExtension | pdf |\n| exif_Linearized | No |\n| exif_MIMEType | application/pdf |\n| exif_ModifyDate | 2026:04:14 08:58:50+00:00 |\n| exif_PDFVersion | 1.4 |\n| exif_PageCount | 3 |\n| exif_PageMode | UseNone |\n| exif_Producer | ReportLab PDF Library - (opensource) |\n| exif_Subject | (unspecified) |\n| exif_Title | (anonymous) |\n| exif_Trapped | False |\n\n## Related Notes\n\n- [Knowledge base index](../index.md)\n- [Lint report](../lint-report. opic: [People Policies](../topics/people-policies.md)\n\n## Extracted Content\n\n**Annual Leave Policy**\n\n\\[Government Department C\\] \\| April 2024\n\n1\\. Entitlement\n\nAnnual leave entitlement depends on length of service and grade:\n\n|  |  |  |  |  |  |\n|----|----|----|----|----|----|\n| **Grade** | **Under 1 year** | **1-2 years** | **2-5 years** | **5-10 years** | **10+ years** |\n| AA/AO | 23 days | 23 days | 24 days | 25 days | 30 days |\n| EO | 23 days | 23 days | 24 days | 25 days | 30 days |\n| HEO/SEO | 25 days | 25 days | 25 days | 27 days | 30 days |\n| Grade 7/6 | 25 days | 25 days | 27 days | 27 days | 30 days |\n| SCS | 30 days | 30 days | 30 days | 30 days | 30 days |\n\nIn addition, all staff receive 8 public holidays and 1 privilege day (the King’s Birthday).\n\n2\\. Carry over\n\nUp to 5 days of unused annual leave may be carried over to the following leave year. Leave carried over must be taken by 30 June.\n\nIn exceptional circumstances, additional carry over may be approved by a Grade 6.\n\n3\\. Booking leave\n\nLeave must be requested through the department’s HR system. Line managers should respond to leave requests within 3 working days.\n\nLeave should not normally be refused unless there is a genuine business need. Where leave is refused, the manager must explain the reason in writing.\n\n4\\. Half days\n\nLeave may be taken in half-day increments. A half day is defined as half the employee’s contracted daily hours.\n\n5\\. Unpaid leave\n\nEmployees may request unpaid leave for reasons not covered by other leave policies. Unpaid leave of up to 5 days may be approved by a line manager. Longer periods require Grade 6 approval.\n\n6\\. Leave year\n\nThe leave year runs from 1 April to 31 March.\n\n7\\. Leaving the department\n\nWhen an employee leaves \\[DEPT-C\\], their leave entitlement is calculated pro rata. Any excess leave taken will be deducted from final salary. Any leave owed will be paid.\n\nContact: hr.leave@\\[department\\].gov.uk\n\n## Raw Metadata\n\n| Field | Value |\n| --- | --- |\n| created | 2026-04-14T09:02:53.793Z |\n| creator | Un-named |\n| exif_CreateDate | 2026:04:14 09:02:53.793Z |\n| exif_Creator | Un-named |\n| exif_ExifToolVersion | 13.55 |\n| exif_FileModifyDate | 2026:04:16 16:01:34+01:00 |\n| exif_FileName | Annual_Leave_Policy.docx |\n| exif_FilePermissions | -rw-r--r-- |\n| exif_FileSize | 10 kB |\n| exif_FileType | DOCX |\n| exif_FileTypeExtension | docx |\n| exif_LastModifiedBy | Un-named |\n| exif_MIMEType | application/vnd.openxmlformats-officedocument.wordprocessingml.document |\n| exif_ModifyDate | 2026:04:14 09:02:53.793Z |\n| exif_RevisionNumber | 1 |\n| exif_ZipBitFlag | 0 |\n| exif_ZipCRC | 0x00000000 |\n| exif_ZipCompressedSize | 0 |\n| exif_ZipCompression | None |\n| exif_ZipFileName | word/ |\n| exif_ZipModifyDate | 2026:04:14 09:02:52 |\n| exif_ZipRequiredVersion | 10 |\n| exif_ZipUncompressedSize | 0 |\n| lastModifiedBy | Un-named |\n| modified | 2026-04-14T09:02:53.793Z |\n| revision | 1 |\n\n## Related Notes\n\n- [Knowledge base index](../index.md)\n- [Lint report](../lint-report.md)"},"sources/uf-data-protection-guidance-for-sta-data-protection-guidance-for-staff.md":{"id":"sources/uf-data-protection-guidance-for-sta-data-protection-guidance-for-staff.md","type":"Source","title":"Data Protection Guidance for Staff","description":"Source note for UF-DATA-PROTECTION-GUIDANCE-FOR-STAFF-MARCH-2024: Data Protection Guidance for Staff.","timestamp":"March 2024 | Owner: Information Governance Directorate","aliases":"UF-DATA-PROTECTION-GUIDANCE-FOR-STAFF-MARCH-2024;Data Protection Guidance for Staff;Data Protection Guidance for Staff - March 2024","section":"sources","source":"challenge-2/wiki/sources/uf-data-protection-guidance-for-sta-data-protection-guidance-for-staff.md","body":"# Data Protection Guidance for Staff\n## Summary\n\n- Source: [Data Protection Guidance for Staff - March 2024.pdf](../../unstructured_files/Data%20Protection%20Guidance%20for%20Staff%20-%20March%202024.pdf)\n- Extraction: `pdftotext-layout` with `medium` quality.\n- Extract: OFFICIAL—SENSITIVE Data Protection Guidance for Staff Published: March 2024 Owner: Information Governance Directorate Contents 1. What is data protection? 2. Your responsibilities 3. Handling personal data 4. Data breaches 5. Subject access requests Annex A — Key contacts Annex B — Decision flowchart 1. What is data protection? Data protection law governs how personal data is collected, stored, used, and shared. The UK General Data Protection Regulation (UK GDPR) and the Data Protection Act 2018 set out the legal framework. All staff who handle personal data must understand and comply with these requirements. Personal data means any...\n\n## Metadata\n\n| Field | Value |\n| --- | --- |\n| Source ID | UF-DATA-PROTECTION-GUIDANCE-FOR-STAFF-MARCH-2024 |\n| Title | Data Protection Guidance for Staff |\n| Raw source | [Data Protection Guidance for Staff - March 2024.pdf](../../unstructured_files/Data%20Protection%20Guidance%20for%20Staff%20-%20March%202024.pdf) |\n| Format | pdf |\n| Document type | guidance |\n| Department |  |\n| Owner |  |\n| Status | unknown |\n| Version |  |\n| Publication date | March 2024 \\| Owner: Information Governance Directorate |\n| Last updated |  |\n| Audience |  |\n| Topics | council-tax-reduction, data-protection-and-information-security, foi-and-transparency |\n| Data origin | Challenge 2 corpus data is synthetic hackathon fixture data. |\n| Contains real personal data | false |\n| Contains synthetic identifiers | false |\n| SHA-256 | 1fd0b0e819b9c2fe85b820a39620b87fd662171634a473fcfd893b3870809be4 |\n\n## Navigation\n\n- Topic: [Council Tax Reduction](../topics/council-tax-reduction.md)\n- Topic: [Data Protection And Information Security](../topics/data-protection-and-information-security.md)\n- Topic: [FOI And Transparency](../topics/foi-and-transparency.md)\n\n## Extracted Tables\n\n### Table 1\n\n| IG Helpdesk: ig.helpdesk@] | .gov.uk, ext. 74231 |\n| --- | --- |\n| [REG-A] | [regulatory-body].org. |\n\n## Extracted Content\n\nOFFICIAL—SENSITIVE\n\n\n                    Data Protection Guidance for Staff\nPublished: March 2024 | Owner: Information Governance Directorate\n\n\nContents\n\n1. What is data protection?\n\n2. Your responsibilities\n\n3. Handling personal data\n\n4. Data breaches\n\n5. Subject access requests\n\nAnnex A — Key contacts\n\nAnnex B — Decision flowchart\n\n\n\n1. What is data protection?\n\nData protection law governs how personal data is collected, stored, used, and shared. The UK General\nData Protection Regulation (UK GDPR) and the Data Protection Act 2018 set out the legal framework. All\nstaff who handle personal data must understand and comply with these requirements.\n\nPersonal data means any information relating to an identified or identifiable living individual. This includes\nobvious identifiers like names and National Insurance numbers, but also less obvious ones like IP\naddresses, location data, and online identifiers.\n\nSpecial category data — including information about health, ethnicity, political opinions, trade union\nmembership, and biometric data — has additional protections and must only be processed where a\nspecific legal basis applies.\n\n\n\n2. Your responsibilities\n\nEvery member of staff is responsible for:\n\n      • Only accessing personal data you need for your work\n\n      • Not sharing personal data with anyone who does not need it\n\n      • Keeping personal data secure (locked screens, encrypted devices, secure email)\n\n      • Reporting any suspected data breach immediately\n\n      • Completing mandatory data protection training annually\n\nFailure to comply with data protection requirements is a disciplinary matter and may also be a criminal\noffence under the Data Protection Act 2018.\n\f3. Handling personal data\n\n3.1 Collection\n\nOnly collect personal data that is necessary for the specific purpose. Do not collect data \"just in case\" it\nmight be useful.\n\n\n3.2 Storage\n\nPersonal data must be stored on approved departmental systems only. It must not be stored on personal\ndevices, personal email accounts, or unapproved cloud services.\n\nRetention periods vary by data type. See the departmental retention schedule (available on the intranet)\nfor specific guidance.\n\n\n3.3 Sharing\n\nBefore sharing personal data outside the department, you must:\n\n      (a) Confirm there is a lawful basis for sharing\n\n      (b) Check whether a data sharing agreement is in place\n\n      (c) Use secure transfer methods\n\n      (d) Record what was shared and with whom\n\n\n3.4 Disposal\n\nPersonal data must be disposed of securely when no longer needed. Paper records should be placed in\nconfidential waste bins. Electronic records should be deleted in accordance with the retention schedule.\n\n\n\n4. Data breaches\n\nA personal data breach is any event that leads to the accidental or unlawful destruction, loss, alteration,\nunauthorised disclosure of, or access to, personal data.\n\nExamples:\n\n      • Sending an email containing personal data to the wrong recipient\n\n      • Losing an unencrypted laptop or USB stick\n\n      • Leaving paper records in an unsecured location\n\n      • A cyber attack that exposes personal data\n\nAll breaches must be reported to the Data Protection Officer within 24 hours using the breach reporting\nform on the intranet. Serious breaches must be reported to the [Regulatory Body A]               within\n72 hours — the DPO will handle this.\n\f5. Subject access requests\n\nIndividuals have the right to request a copy of the personal data we hold about them. These requests are\nknown as Subject Access Requests (SARs).\n                                                                                                        [DEPT-C\nIf you receive a SAR, forward it immediately to the SAR team at sar@]                                             .gov.uk. Do not attempt to\nrespond directly.\n\nThe department has 30 calendar days to respond to a SAR from receipt.\n\n\n\nAnnex A — Key contacts\n                                                                                    [DEPT-C\nData Protection Officer: Sarah Mitchell, sarah.mitchell@]                                     .gov.uk\n                                     [DEPT-C\nSAR Team: sar@]                                .gov.uk\n                                                    [DEPT-C\nIG Helpdesk: ig.helpdesk@]                                    .gov.uk, ext. 74231\n[REG-A]     [regulatory-body].org.\n          : uk\n\n\n\nAnnex B — Decision flowchart\n\n                 [This annex contains a flowchart image that cannot be extracted as text. Teams should note this as an\n                 example of content loss during extraction.]\n\n## Raw Metadata\n\n| Field | Value |\n| --- | --- |\n| Author | (anonymous) |\n| CreationDate | Tue Apr 14 09:58:50 2026 BST |\n| Creator | (unspecified) |\n| Custom Metadata | no |\n| Encrypted | no |\n| File size | 6488 bytes |\n| Form | none |\n| JavaScript | no |\n| Keywords |  |\n| Metadata Stream | no |\n| ModDate | Tue Apr 14 09:58:50 2026 BST |\n| Optimized | no |\n| PDF version | 1.4 |\n| Page rot | 0 |\n| Page size | 595.276 x 841.89 pts (A4) |\n| Pages | 3 |\n| Producer | ReportLab PDF Library - (opensource) |\n| Subject | (unspecified) |\n| Suspects | no |\n| Tagged | no |\n| Title | (anonymous) |\n| UserProperties | no |\n| exif_Author | (anonymous) |\n| exif_CreateDate | 2026:04:14 08:58:50+00:00 |\n| exif_Creator | (unspecified) |\n| exif_ExifToolVersion | 13.55 |\n| exif_FileModifyDate | 2026:04:16 16:01:34+01:00 |\n| exif_FileName | Data Protection Guidance for Staff - March 2024.pdf |\n| exif_FilePermissions | -rw-r--r-- |\n| exif_FileSize | 6.5 kB |\n| exif_FileType | PDF |\n| exif_FileTypeExtension | pdf |\n| exif_Linearized | No |\n| exif_MIMEType | application/pdf |\n| exif_ModifyDate | 2026:04:14 08:58:50+00:00 |\
