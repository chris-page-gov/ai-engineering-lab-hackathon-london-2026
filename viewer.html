| Field | Value |\n| --- | --- |\n| Source ID | UF-ELIGIBILITY-CRITERIA-HOUSING-BENEFIT |\n| Title | Housing Benefit: Eligibility Criteria |\n| Raw source | [Eligibility_Criteria_Housing_Benefit.docx](../../unstructured_files/Eligibility_Criteria_Housing_Benefit.docx) |\n| Format | docx |\n| Document type | policy |\n| Department |  |\n| Owner |  |\n| Status | unknown |\n| Version |  |\n| Publication date |  |\n| Last updated | June 2019 \\\\| Owner: Benefits Policy Division |\n| Audience |  |\n| Topics | housing-benefit |\n| Data origin | Challenge 2 corpus data is synthetic hackathon fixture data. |\n| Contains real personal data | false |\n| Contains synthetic identifiers | false |\n| SHA-256 | 9c20daad1cc0c588c247340d0903a1c3eca1437be2383fa9cd3b36447b3e3b1b |\n\n## Navigation\n\n- Topic: [Housing Benefit](../topics/housing-benefit.md)\n- Entity: [Local Authorities](../entities/local-authorities.md)\n\n## Extracted Content\n\n**Housing Benefit: Eligibility Criteria**\n\nLast updated: June 2019 \\| Owner: Benefits Policy Division\n\n> *IMPORTANT: Housing Benefit is being replaced by Universal Credit. New claims for Housing Benefit can only be made by claimants who have reached State Pension age or who live in specified accommodation. All other claimants should claim Universal Credit.*\n\nHowever, existing Housing Benefit claims continue to be paid and managed by local authorities until the claimant is migrated to Universal Credit.\n\n1\\. Basic eligibility\n\nTo qualify for Housing Benefit, a claimant must:\n\n\\(a\\) Be liable to pay rent\n\n\\(b\\) Have a low income (below the applicable amount)\n\n\\(c\\) Have capital below £16,000 (unless in receipt of guarantee Pension Credit)\n\n\\(d\\) Not be a person from abroad who is subject to immigration control\n\n\\(e\\) Be occupying the property as their home\n\n2\\. Income assessment\n\nIncome includes: earnings from employment (net of tax and NI), self-employment income, other benefits (JSA, ESA, State Pension), occupational pensions, some income from capital (tariff income).\n\nDisregards:\n\n- First £5 of earnings for single claimants\n\n- First £10 for couples\n\n- First £20 for lone parents, disabled claimants, and carers\n\n- Disability Living Allowance / PIP is fully disregarded\n\n- Child Benefit is fully disregarded\n\n3\\. Applicable amount\n\nThe applicable amount is the amount the government says a claimant needs to live on. It comprises:\n\n|                                            |                             |\n|--------------------------------------------|-----------------------------|\n| **Component**                              | **Weekly amount (2019-20)** |\n| Personal allowance — single, under 25      | £57.90                      |\n| Personal allowance — single, 25 or over    | £73.10                      |\n| Personal allowance — couple, both under 18 | £57.90                      |\n| Personal allowance — couple, otherwise     | £114.85                     |\n| Family premium                             | £17.45                      |\n| Disability premium — single                | £34.95                      |\n| Disability premium — couple                | £49.80                      |\n| Enhanced disability premium — single       | £17.10                      |\n| Severe disability premium                  | £66.95                      |\n| Carer premium                              | £37.50                      |\n\n4\\. Calculation\n\nHousing Benefit = Eligible rent minus any non-dependant deductions, minus 65% of excess income.\n\nExcess income = Income minus applicable amount.\n\nIf income is at or below the applicable amount, full eligible rent is paid (subject to non-dependant deductions and any restrictions on eligible rent).\n\n5\\. Eligible rent\n\nFor private tenants, eligible rent is capped at the Local Housing Allowance (LHA) rate for the area and property size the claimant is entitled to.\n\nFor social tenants, eligible rent is normally the actual rent charged, but may be subject to the removal of the spare room subsidy (commonly referred to as the \"bedroom tax\").\n\n> *\\[Note: This document has not been updated since 2019. The applicable amounts shown are for 2019-20 and are no longer current. Current rates should be obtained from the annual uprating circular.\\]*\n\n## Raw Metadata\n\n| Field | Value |\n| --- | --- |\n| created | 2026-04-14T09:02:53.695Z |\n| creator | Un-named |\n| exif_CreateDate | 2026:04:14 09:02:53.695Z |\n| exif_Creator | Un-named |\n| exif_ExifToolVersion | 13.55 |\n| exif_FileModifyDate | 2026:04:16 03:32:22+01:00 |\n| exif_FileName | Eligibility_Criteria_Housing_Benefit.docx |\n| exif_FilePermissions | -rw-r--r-- |\n| exif_FileSize | 11 kB |\n| exif_FileType | DOCX |\n| exif_FileTypeExtension | docx |\n| exif_LastModifiedBy | Un-named |\n| exif_MIMEType | application/vnd.openxmlformats-officedocument.wordprocessingml.document |\n| exif_ModifyDate | 2026:04:14 09:02:53.695Z |\n| exif_RevisionNumber | 1 |\n| exif_ZipBitFlag | 0 |\n| exif_ZipCRC | 0x00000000 |\n| exif_ZipCompressedSize | 0 |\n| exif_ZipCompression | None |\n| exif_ZipFileName | word/ |\n| exif_ZipModifyDate | 2026:04:14 09:02:52 |\n| exif_ZipRequiredVersion | 10 |\n| exif_ZipUncompressedSize | 0 |\n| lastModifiedBy | Un-named |\n| last_updated | June 2019 \\\\| Owner: Benefits Policy Division |\n| modified | 2026-04-14T09:02:53.695Z |\n| revision | 1 |\n\n## Related Notes\n\n- [Knowledge base index](../index.md)\n- [Lint report](../lint-report.md)"},"sources/uf-equality-impact-assessment-uc-mi-equality-impact-assessment-universal-credit.md":{"id":"sources/uf-equality-impact-assessment-uc-mi-equality-impact-assessment-universal-credit.md","type":"Source","title":"Equality Impact Assessment Universal Credit","description":"Source note for UF-EQUALITY-IMPACT-ASSESSMENT-UC-MIGRATION: Equality Impact Assessment Universal Credit.","timestamp":"September 2023 | SRO: [REDACTED] | Lead analyst: [REDACTED]","aliases":"UF-EQUALITY-IMPACT-ASSESSMENT-UC-MIGRATION;Equality Impact Assessment Universal Credit;Equality_Impact_Assessment_UC_Migration","section":"sources","source":"challenge-2/wiki/sources/uf-equality-impact-assessment-uc-mi-equality-impact-assessment-universal-credit.md","body":"# Equality Impact Assessment Universal Credit\n## Summary\n\n- Source: [Equality_Impact_Assessment_UC_Migration.pdf](../../unstructured_files/Equality_Impact_Assessment_UC_Migration.pdf)\n- Extraction: `pdftotext-layout` with `medium` quality.\n- Extract: OFFICIAL Equality Impact Assessment Universal Credit Migration Programme Date: September 2023 SRO: [REDACTED] Lead analyst: [REDACTED] Executive summary This assessment considers the potential equality impacts of the managed migration of legacy benefit claimants to Universal Credit. It covers all protected characteristics under the Equality Act 2010. The assessment finds that migration will have differential impacts on certain groups, particularly: • Disabled claimants (who may experience disruption to existing support arrangements) • Claimants over State Pension age (who will not migrate but may be affected indirectly) • Women (who are more...\n\n## Metadata\n\n| Field | Value |\n| --- | --- |\n| Source ID | UF-EQUALITY-IMPACT-ASSESSMENT-UC-MIGRATION |\n| Title | Equality Impact Assessment Universal Credit |\n| Raw source | [Equality_Impact_Assessment_UC_Migration.pdf](../../unstructured_files/Equality_Impact_Assessment_UC_Migration.pdf) |\n| Format | pdf |\n| Document type | assessment |\n| Department |  |\n| Owner |  |\n| Status | unknown |\n| Version |  |\n| Publication date | September 2023 \\| SRO: [REDACTED] \\| Lead analyst: [REDACTED] |\n| Last updated |  |\n| Audience |  |\n| Topics | housing-benefit, incident-risk-and-assurance |\n| Data origin | Challenge 2 corpus data is synthetic hackathon fixture data. |\n| Contains real personal data | false |\n| Contains synthetic identifiers | false |\n| SHA-256 | fb86210f2a14bf493c02bb7dd3efc39b7cd50fd409930abdc7b2b546d17aa09f |\n\n## Navigation\n\n- Topic: [Housing Benefit](../topics/housing-benefit.md)\n- Topic: [Incident Risk And Assurance](../topics/incident-risk-and-assurance.md)\n\n## Extracted Content\n\nOFFICIAL\n\n\n         Equality Impact Assessment Universal Credit\n                    Migration Programme\nDate: September 2023 | SRO: [REDACTED] | Lead analyst: [REDACTED]\n\n\nExecutive summary\n\nThis assessment considers the potential equality impacts of the managed migration of legacy benefit\nclaimants to Universal Credit. It covers all protected characteristics under the Equality Act 2010.\n\nThe assessment finds that migration will have differential impacts on certain groups, particularly:\n\n      • Disabled claimants (who may experience disruption to existing support arrangements)\n\n      • Claimants over State Pension age (who will not migrate but may be affected indirectly)\n\n      • Women (who are more likely to be affected by changes to childcare element calculations)\n\n      • Ethnic minority claimants (who may face additional barriers to digital engagement)\n\n\n\n1. Background\n\nThe Department is migrating claimants from legacy benefits (Income Support, income-based Jobseeker’s\nAllowance, income-related Employment and Support Allowance, Housing Benefit, Child Tax Credit, and\nWorking Tax Credit) to Universal Credit. This programme is known as \"Move to UC\" and is expected to be\ncompleted by March 2025.\n\n      [NOTE: The March 2025 completion date was the target at the time of writing. The programme has\n      since been extended. Check the latest published timeline.]\n\n\n\n2. Protected characteristics analysis\n\n2.1 Age\n\nClaimants of State Pension age claiming Housing Benefit only will not be migrated. This means they retain\ntheir existing benefit arrangements.\n\nYounger claimants (under 25) receive a lower personal allowance under UC than under legacy benefits in\nsome circumstances.\n\nImpact: Mixed. Younger claimants may receive less; older claimants are protected from disruption.\n\n\n2.2 Disability\n\nDisabled claimants on ESA who are in the Support Group will transition to the UC equivalent (LCWRA —\nLimited Capability for Work and Work-Related Activity). Transitional protection ensures they will not\nreceive less in cash terms at the point of migration.\n\fHowever:\n\n      • The LCWRA element in UC (£390.06/month) is lower than the ESA Support Group component\n         plus the disability premium available in legacy benefits\n\n      • Transitional protection is eroded over time as UC rates are uprated but the transitional element is\n         not\n\n      • The work capability assessment process for UC differs from ESA, which may cause anxiety\n\n\n2.3 Sex\n\nWomen are disproportionately affected by:\n\n      • Changes to childcare support calculation methodology\n\n      • The two-child limit (applicable to UC but not to legacy Child Tax Credit claims made before April\n         2017)\n\n      • The move to monthly assessment periods, which can create budgeting difficulties for those\n         managing household finances\n\n\n2.4 Race and ethnicity\n\nResearch indicates that claimants from some ethnic minority backgrounds may face additional barriers:\n\n      • Digital literacy and access to online services\n\n      • Language barriers in engaging with UC’s online journal\n\n      • Cultural factors affecting engagement with work coaches\n\nThe Department provides translation services and face-to-face support, but take-up of these services is\nuneven.\n\n\n\n3. Mitigations\n\n      [This section is incomplete. It references an annex that was not included in the document.]\n\nSee Annex C for the full mitigation plan and monitoring framework.\n\n\n\n4. Review\n\nThis assessment will be reviewed quarterly during the migration programme.\n\nLast reviewed: September 2023 | Next review: December 2023\n\nDistribution: Programme Board, Equality and Diversity Committee, Public\n\n## Raw Metadata\n\n| Field | Value |\n| --- | --- |\n| Author | (anonymous) |\n| CreationDate | Tue Apr 14 09:58:50 2026 BST |\n| Creator | (unspecified) |\n| Custom Metadata | no |\n| Encrypted | no |\n| File size | 5471 bytes |\n| Form | none |\n| JavaScript | no |\n| Keywords |  |\n| Metadata Stream | no |\n| ModDate | Tue Apr 14 09:58:50 2026 BST |\n| Optimized | no |\n| PDF version | 1.4 |\n| Page rot | 0 |\n| Page size | 595.276 x 841.89 pts (A4) |\n| Pages | 2 |\n| Producer | ReportLab PDF Library - (opensource) |\n| Subject | (unspecified) |\n| Suspects | no |\n| Tagged | no |\n| Title | (anonymous) |\n| UserProperties | no |\n| exif_Author | (anonymous) |\n| exif_CreateDate | 2026:04:14 08:58:50+00:00 |\n| exif_Creator | (unspecified) |\n| exif_ExifToolVersion | 13.55 |\n| exif_FileModifyDate | 2026:04:16 03:32:22+01:00 |\n| exif_FileName | Equality_Impact_Assessment_UC_Migration.pdf |\n| exif_FilePermissions | -rw-r--r-- |\n| exif_FileSize | 5.5 kB |\n| exif_FileType | PDF |\n| exif_FileTypeExtension | pdf |\n| exif_Linearized | No |\n| exif_MIMEType | application/pdf |\n| exif_ModifyDate | 2026:04:14 08:58:50+00:00 |\n| exif_PDFVersion | 1.4 |\n| exif_PageCount | 2 |\n| exif_PageMode | UseNone |\n| exif_Producer | ReportLab PDF Library - (opensource) |\n| exif_Subject | (unspecified) |\n| exif_Title | (anonymous) |\n| exif_Trapped | False |\n| published | September 2023 \\| SRO: [REDACTED] \\| Lead analyst: [REDACTED] |\n\n## Related Notes\n\n- [Knowledge base index](../index.md)\n- [Lint report](../lint-report.md)"},"sources/uf-flexible-working-policy-flexible-working-policy.md":{"id":"sources/uf-flexible-working-policy-flexible-working-policy.md","type":"Source","title":"Flexible Working Policy","description":"Source note for UF-FLEXIBLE-WORKING-POLICY: Flexible Working Policy.","timestamp":"2026-06-27","aliases":"UF-FLEXIBLE-WORKING-POLICY;Flexible Working Policy;flexible-working-policy","section":"sources","source":"challenge-2/wiki/sources/uf-flexible-working-policy-flexible-working-policy.md","body":"# Flexible Working Policy\n## Summary\n\n- Source: [flexible-working-policy.pdf](../../unstructured_files/flexible-working-policy.pdf)\n- Extraction: `pdftotext-layout` with `medium` quality.\n- Extract: OFFICIAL Flexible Working Policy [GOVERNMENT DEPARTMENT C] Effective: November 2023 1. Policy statement [DEPT-C] is committed to enabling flexible working arrangements that support both business needs and employee wellbeing. All employees have the right to request flexible working from their first day of employment. 2. Types of flexible working The department supports the following arrangements: a) Part-time working b) Job sharing c) Compressed hours d) Flexitime e) Hybrid working (combination of office and home) f) Term-time working g) Annualised hours 3. Hybrid working The department’s standard expectation is a minimum of 60% office...\n\n## Metadata\n\n| Field | Value |\n| --- | --- |\n| Source ID | UF-FLEXIBLE-WORKING-POLICY |\n| Title | Flexible Working Policy |\n| Raw source | [flexible-working-policy.pdf](../../unstructured_files/flexible-working-policy.pdf) |\n| Format | pdf |\n| Document type | policy |\n| Department |  |\n| Owner |  |\n| Status | unknown |\n| Version |  |\n| Publication date |  |\n| Last updated |  |\n| Audience |  |\n| Topics | employment-rights-and-flexible-working |\n| Data origin | Challenge 2 corpus data is synthetic hackathon fixture data. |\n| Contains real personal data | false |\n| Contains synthetic identifiers | false |\n| SHA-256 | ac4833307c46684f67a92b1d1bcc2de3dbc13c18e58d164fa5d8c46ce03c02eb |\n\n## Navigation\n\n- Topic: [Employment Rights And Flexible Working](../topics/employment-rights-and-flexible-working.md)\n- Entity: [Employment Rights Act 1996](../entities/employment-rights-act-1996.md)\n\n## Extracted Content\n\nOFFICIAL\n\n\n                                  Flexible Working Policy\n[GOVERNMENT DEPARTMENT C]                   | Effective: November 2023\n\n\n1. Policy statement\n[DEPT-C]\n     is committed to enabling flexible working arrangements that support both business needs and\nemployee wellbeing. All employees have the right to request flexible working from their first day of\nemployment.\n\n\n\n2. Types of flexible working\n\nThe department supports the following arrangements:\n\n           a) Part-time working\n\n           b) Job sharing\n\n           c) Compressed hours\n\n           d) Flexitime\n\n           e) Hybrid working (combination of office and home)\n\n           f) Term-time working\n\n           g) Annualised hours\n\n\n\n3. Hybrid working\n\nThe department’s standard expectation is a minimum of 60% office attendance. This means for a full-time\nemployee working 5 days per week, at least 3 days should be spent in the office.\n\nSome roles require higher office attendance due to the nature of the work (e.g., customer-facing roles,\nroles requiring access to classified systems above OFFICIAL).\n\nManagers may agree local arrangements that differ from the 60% standard where business needs allow,\nbut this must be documented and approved by the relevant Grade 6.\n\n\n\n4. Requesting flexible working\n\nTo request a flexible working arrangement:\n\n           1. Discuss informally with your line manager\n\n           2. Submit a formal request through HR Online\n\n           3. Your manager will respond within 28 days\n\f      4. If approved, the arrangement will be confirmed in writing\n\n      5. A trial period of 3 months applies to all new arrangements\n\nRequests can only be refused on specific business grounds as set out in the Employment Rights Act 1996.\n\n\n\n5. Core hours\n\nRegardless of flexible working arrangements, all staff must be available during core hours: 10:00 to 12:00\nand 14:00 to 16:00, Monday to Friday.\n\n\n\n6. Equipment\n\nEmployees working from home are entitled to:\n\n      • A department-issued laptop\n\n      • A monitor (on request)\n\n      • A keyboard and mouse (on request)\n\n      • A desk assessment\n\nThe department will not provide office furniture for home use except where recommended by an\noccupational health assessment.\n\n\n\n7. Review\n\nThis policy was last reviewed in November 2023. Next review: November 2024.\n                          [DEPT-C\nContact: flexible.working@]         .gov.uk\n\n## Raw Metadata\n\n| Field | Value |\n| --- | --- |\n| Author | (anonymous) |\n| CreationDate | Tue Apr 14 09:58:50 2026 BST |\n| Creator | (unspecified) |\n| Custom Metadata | no |\n| Encrypted | no |\n| File size | 4087 bytes |\n| Form | none |\n| JavaScript | no |\n| Keywords |  |\n| Metadata Stream | no |\n| ModDate | Tue Apr 14 09:58:50 2026 BST |\n| Optimized | no |\n| PDF version | 1.4 |\n| Page rot | 0 |\n| Page size | 595.276 x 841.89 pts (A4) |\n| Pages | 2 |\n| Producer | ReportLab PDF Library - (opensource) |\n| Subject | (unspecified) |\n| Suspects | no |\n| Tagged | no |\n| Title | (anonymous) |\n| UserProperties | no |\n| exif_Author | (anonymous) |\n| exif_CreateDate | 2026:04:14 08:58:50+00:00 |\n| exif_Creator | (unspecified) |\n| exif_ExifToolVersion | 13.55 |\n| exif_FileModifyDate | 2026:04:16 16:01:34+01:00 |\n| exif_FileName | flexible-working-policy.pdf |\n| exif_FilePermissions | -rw-r--r-- |\n| exif_FileSize | 4.1 kB |\n| exif_FileType | PDF |\n| exif_FileTypeExtension | pdf |\n| exif_Linearized | No |\n| exif_MIMEType | application/pdf |\n| exif_ModifyDate | 2026:04:14 08:58:50+00:00 |\n| exif_PDFVersion | 1.4 |\n| exif_PageCount | 2 |\n| exif_PageMode | UseNone |\n| exif_Producer | ReportLab PDF Library - (opensource) |\n| exif_Subject | (unspecified) |\n| exif_Title | (anonymous) |\n| exif_Trapped | False |\n\n## Related Notes\n\n- [Knowledge base index](../index.md)\n- [Lint report](../lint-report.md)"},"sources/uf-foi-response-template-template-freedom-of-information-act-2000-response.md":{"id":"sources/uf-foi-response-template-template-freedom-of-information-act-2000-response.m | Contains synthetic identifiers | false |\n| SHA-256 | dda2c117151309a17abc2ad5de006de8a4d1fa59ab59aef5532d1326acd3bcfe |\n\n## Navigation\n\n- Topic: [Data Protection And Information Security](../topics/data-protection-and-information-security.md)\n- Topic: [FOI And Transparency](../topics/foi-and-transparency.md)\n\n## Extracted Content\n\n**TEMPLATE — FREEDOM OF INFORMATION ACT 2000 RESPONSE**\n\n\\[INSERT DATE\\]\n\nDear \\[INSERT NAME\\],\n\nThank you for your request for information received on \\[INSERT DATE RECEIVED\\]. Your request has been handled under the Freedom of Information Act 2000.\n\nYou asked:\n\n\\[INSERT QUESTION\\]\n\n\\[OPTION A: Full disclosure\\]\n\nI can confirm that the Department holds the information you have requested. Please find our response below.\n\n\\[INSERT RESPONSE\\]\n\n\\[OPTION B: Section 21 — information accessible by other means\\]\n\nThe information you have requested is already publicly available. It can be accessed at:\n\n\\[INSERT URL\\]\n\n\\[OPTION C: Section 40(2) — personal data\\]\n\nSome information has been withheld under section 40(2) of the Freedom of Information Act 2000. This exemption applies to personal data where disclosure would breach data protection principles.\n\n\\[OPTION D: Section 35 — formulation of government policy\\]\n\nSome information has been withheld under section 35(1)(a) of the Freedom of Information Act 2000. This exemption applies to information relating to the formulation or development of government policy.\n\nThe public interest in maintaining this exemption outweighs the public interest in disclosure because:\n\n\\[INSERT PUBLIC INTEREST ARGUMENTS\\]\n\n\\[OPTION E: Section 43 — commercial interests\\]\n\nSome information has been withheld under section 43(2) of the Freedom of Information Act 2000. This exemption applies to information whose disclosure would be likely to prejudice the commercial interests of any person.\n\n\\[STANDARD FOOTER\\]\n\nIf you are not satisfied with this Grievance Policy;Grievance_Policy_2024","section":"sources","source":"challenge-2/wiki/sources/uf-grievance-policy-2024-grievance-policy.md","body":"# Grievance Policy\n## Summary\n\n- Source: [Grievance_Policy_2024.docx](../../unstructured_files/Grievance_Policy_2024.docx)\n- Extraction: `pandoc-docx` with `high` quality.\n- Extract: Grievance Policy \\[Government Department C\\] \\ January 2024 Document control: Version 5.0 \\ Owner: Employee Relations Team Approval: \\[DEPT-C\\] People Committee, 8 January 2024 \\ Review date: January 2026 1\\. Introduction This policy provides a framework for employees to raise and resolve workplace grievances. It applies to all \\[DEPT-C\\] employees. 2\\. Informal resolution Employees are encouraged to resolve concerns informally where possible. This may involve: - Discussing the issue with their line manager - Seeking support from a trade union representative - Using the mediation service 3\\. Formal process If informal resolution is not...\n\n## Metadata\n\n| Field | Value |\n| --- | --- |\n| Source ID | UF-GRIEVANCE-POLICY-2024 |\n| Title | Grievance Policy |\n| Raw source | [Grievance_Policy_2024.docx](../../unstructured_files/Grievance_Policy_2024.docx) |\n| Format | docx |\n| Document type | policy |\n| Department |  |\n| Owner |  |\n| Status | unknown |\n| Version |  |\n| Publication date |  |\n| Last updated |  |\n| Audience |  |\n| Topics | people-policies |\n| Data origin | Challenge 2 corpus data is synthetic hackathon fixture data. |\n| Contains real personal data | false |\n| Contains synthetic identifiers | false |\n| SHA-256 | ca7650be9f49abd4bb480be1acaef73c27dacd49b02231b25c7895f9267ddf53 |\n\n## Navigation\n\n- Topic: [People Policies](../topics/people-policies.md)\n\n## Extracted Content\n\n**Grievance Policy**\n\n\\[Government Department C\\] \\| January 2024\n\nDocument control: Version 5.0 \\| Owner: Employee Relations Team\n\nApproval: \\[DEPT-C\\] People Committee, 8 January 2024 \\| Review date: January 2026\n\n1\\. Introduction\n\nThis policy provides a framework for employees to raise and resolve workplace grievances. It applies to all \\[DEPT-C\\] employees.\n\n2\\. Informal resolution\n\nEmployees are encouraged to resolve concerns informally where possible. This may involve:\n\n- Discussing the issue with their line manager\n\n- Seeking support from a trade union representative\n\n- Using the mediation service\n\n3\\. Formal process\n\nIf informal resolution is not possible or appropriate, employees may submit a formal grievance.\n\n**Step 1: Written submission** — The employee submits a written grievance to their line manager (or their manager’s manager if the grievance is about the line manager).\n\n**Step 2: Investigation** — A grievance hearing will be arranged within 15 working days. The employee may be accompanied by a trade union representative or a work colleague.\n\n**Step 3: Decision** — A written decision will be provided within 10 working days of the hearing.\n\n**Step 4: Appeal** — If the employee is not satisfied with the outcome, they may appeal in writing within 10 working days. The appeal will be heard by a manager at least one grade higher than the original decision maker.\n\n4\\. Timescales\n\n|                              |                                            |\n|------------------------------|--------------------------------------------|\n| **Stage**                    | **Timeframe**                              |\n| Informal discussion          | No formal time limit, but should be prompt |\n| Formal submission to hearing | 15 working days                            |\n| Hearing to written decision  | 10 working days                            |\n| Appeal submission            | 10 working days from decision              |\n| Appeal hearing               | 15 working days from appeal submission     |\n| Appeal decision              | 10 working days from appeal hearing        |\n\n5\\. Overlapping processes\n\nWhere a grievance overlaps with a disciplinary process, the disciplinary process will normally take precedence. The grievance will be paused and resumed after the disciplinary outcome. Exceptions may be made where the grievance is directly related to the disciplinary action.\n\n6\\. Support\n\nEmployees involved in a grievance process can access:\n\n- Employee Assistance Programme (EAP): 0800 XXX XXXX (24/7)\n\n- Trade union representation\n\n- HR casework advice: hrcase@\\[department\\].gov.uk\n\n7\\. Monitoring\n\nThe Employee Relations team produces quarterly reports on grievance volumes, outcomes, and timescales. These are reported to the People Committee.\n\n## Raw Metadata\n\n| Field | Value |\n| --- | --- |\n| created | 2026-04-14T09:02:53.725Z |\n| creator | Un-named |\n| exif_CreateDate | 2026:04:14 09:02:53.725Z |\n| exif_Creator | Un-named |\n| exif_ExifToolVersion | 13.55 |\n| exif_FileModifyDate | 2026:04:16 16:01:34+01:00 |\n| exif_FileName | Grievance_Policy_2024.docx |\n| exif_FilePermissions | -rw-r--r-- |\n| exif_FileSize | 10 kB |\n| exif_FileType | DOCX |\n| exif_FileTypeExtension | docx |\n| exif_LastModifiedBy | Un-named |\n| exif_MIMEType | application/vnd.openxmlformats-officedocument.wordprocessingml.document |\n| exif_ModifyDate | 2026:04:14 09:02:53.725Z |\n| exif_RevisionNumber | 1 |\n| exif_ZipBitFlag | 0 |\n| exif_ZipCRC | 0x00000000 |\n| exif_ZipCompressedSize | 0 |\n| exif_ZipCompression | None |\n| exif_ZipFileName | word/ |\n| exif_ZipModifyDate | 2026:04:14 09:02:52 |\n| exif_ZipRequiredVersion | 10 |\n| exif_ZipUncompressedSize | 0 |\n| lastModifiedBy | Un-named |\n| modified | 2026-04-14T09:02:53.725Z |\n| revision | 1 |\n\n## Related Notes\n\n- [Knowledge base index](../index.md)\n- [Lint report](../lint-report.md)"},"sources/uf-incident-reporting-v1-incident-reporting-procedure.md":{"id":"sources/uf-incident-reporting-v1-incident-reporting-procedure.md","type":"Source","title":"INCIDENT REPORTING PROCEDURE","description":"Source note for UF-INC IDENT REPORTING PROCEDURE**\n\nVersion 1.0 \\| January 2023\n\n\\[Government Department C\\] — Health and Safety Team\n\nPurpose\n\nThis procedure describes how to report workplace incidents, near misses, and hazards. It applies to all \\[DEPT-C\\] premises including Jobcentres, service centres, and corporate offices.\n\nDefinitions\n\n**Incident:** An event that results in injury, ill health, or damage to property.\n\n**Near miss:** An event that could have resulted in an incident but did not.\n\n**Hazard:** A condition or situation with the potential to cause harm.\n\n**RIDDOR:** Reporting of Injuries, Diseases and Dangerous Occurrences Regulations 2013.\n\nReporting process\n\nAll incidents must be reported on the same day they occur using the online reporting form (accessible from the H&S intranet page).\n\n|  |  |  |\n|----|----|----|\n| **Severity** | **Action** | **Timeframe** |\n| Minor (first aid only) | Complete online form | Same day |\n| Moderate (medical treatment) | Complete online form + notify line manager | Within 2 hours |\n| Major (hospital admission) | Complete online form + notify H&S team by phone | Immediately |\n| Fatal or specified injury | As above + RIDDOR report | Immediately |\n\nInvestigation\n\nAll moderate, major, and RIDDOR-reportable incidents will be investigated by the Health and Safety team. Minor incidents are investigated locally by the line manager.\n\nInvestigation reports must be completed within:\n\n- Minor: 5 working days\n\n- Moderate: 10 working days\n\n- Major/RIDDOR: 15 working days\n\nRecord keeping\n\nAll incident records must be retained for a minimum of 3 years. RIDDOR records must be retained for a minimum of 3 years from the date of the incident (note: this aligns with the statutory requirement but some legal advisors recommend 6 years).\n\nContact\n\nH&S Team: health.safety@\\[department\\].gov.uk\n\nEmergency: 999\n\n\\[DEPT-C\\] Security Control Room: 0800 XXX XXXX (24/7)\n\n## Raw Metadata\n\n| Field | Value RIBUTION Information Security Policy Version 0.8 — DRAFT \\ February 2024 This document is a draft and has not been approved for publication. Do not distribute outside the Information Security team. 1\\. Introduction This policy establishes the information security requirements for all \\[DEPT-C\\] systems, data, and personnel. It replaces the Information Security Policy v4.1 (June 2022). > \\[REVIEWERS NOTE: Section 2 needs legal review before publication. The DPIA requirements may conflict with the updated UK GDPR guidance from \\[REG-A\\] published in January 2024.\\] 2\\. Classification All information must be classified...\n\n## Metadata\n\n| Field | Value |\n| --- | --- |\n| Source ID | UF-INFORMATION-SECURITY-POLICY-DRAFT-V0-8 |\n| Title | DRAFT — NOT FOR DISTRIBUTION |\n| Raw source | [Information Security Policy - DRAFT v0.8.docx](../../unstructured_files/Information%20Security%20Policy%20-%20DRAFT%20v0.8.docx) |\n| Format | docx |\n| Document type | policy |\n| Department |  |\n| Owner |  |\n| Status | draft |\n| Version | 0.8 — DRAFT \\\\| February 2024 |\n| Publication date |  |\n| Last updated |  |\n| Audience |  |\n| Topics | data-protection-and-information-security, incident-risk-and-assurance |\n| Data origin | Challenge 2 corpus data is synthetic hackathon fixture data. |\n| Contains real personal data | false |\n| Contains synthetic identifiers | false |\n| SHA-256 | af5299c5250931b54a6c06487e918a4d10aa68546cbcba068323d672c4425e6b |\n\n## Navigation\n\n- Topic: [Data Protection And Information Security](../topics/data-protection-and-information-security.md)\n- Topic: [Incident Risk And Assurance](../topics/incident-risk-and-assurance.md)\n\n## Extracted Content\n\n> *DRAFT — NOT FOR DISTRIBUTION*\n\n**Information Security Policy**\n\nVersion 0.8 — DRAFT \\| February 2024\n\nThis document is a draft and has not been approved for publication. Do not distribute outside the Information Security team.\n\n1\\. Introduction\n\nThis policy establishes the information security requirements for all \\[DEPT-C\\] systems, data, and personnel. It replaces the Information Security Policy v4.1 (June 2022).\n\n> *\\[REVIEWERS NOTE: Section 2 needs legal review before publication. The DPIA requirements may conflict with the updated UK GDPR guidance from \\[REG-A\\] published in January 2024.\\]*\n\n2\\. Classification\n\nAll information must be classified according to the Government Security Classifications policy:\n\n- OFFICIAL: The majority of government information\n\n- SECRET: Very sensitive information requiring enhanced protection\n\n- TOP SECRET: The most sensitive information\n\nWithin OFFICIAL, the marking OFFICIAL-SENSITIVE may be applied where there is a need to enforce need-to-know.\n\n3\\. Access Control\n\nAccess to departmental systems must follow the principle of least privilege. Users should only have access to the systems and data they need for their current role.\n\n3.1 Passwords\n\nMinimum length: 12 characters\n\nComplexity: Must include uppercase, lowercase, numbers, and special characters\n\nExpiry: Every 90 days\n\n> *\\[TODO: Update password section to reflect NCSC guidance. NCSC now recommends against forced password expiry. Need to align with NCSC Cyber Essentials requirements.\\]*\n\n3.2 Multi-factor authentication\n\nMFA is required for all remote access and for access to systems handling OFFICIAL-SENSITIVE or above.\n\n4\\. Device Security\n\n4.1 Department-issued devices\n\nAll laptops and mobile devices must be encrypted using BitLocker (Windows) or FileVault (Mac).\n\nAutomatic updates must be enabled. Devices must not be used if updates are more than 14 days overdue.\n\n4.2 Personal devices\n\nPersonal devices must not be used to access departmental systems or data unless through an approved BYOD solution. Currently, no BYOD solution is approved.\n\n> *\\[PLACEHOLDER: Section 5 — Cloud Security — to be drafted by Cloud Architecture team. Target: March 2024.\\]*\n\n6\\. Incident Response\n\nAll security incidents must be reported to the Security Operations Centre (SOC) immediately.\n\nSOC contact: soc@\\[department\\].gov.uk / 0800 XXX XXXX (24/7)\n\nSeverity classification:\n\nP1 — Active compromise or data breach affecting live services\n\nP2 — Suspected compromise or vulnerability being actively exploited\n\nP3 — Security policy violation or minor vulnerability\n\nP4 — Advisory or informational\n\n7\\. Training\n\nAll staff must complete Responsible for Information (RfI) training annually. Staff in roles with elevated access must complete additional security training as specified by their role requirements.\n\n> *\\[END OF DRAFT — Sections 5, 8, 9, 10 still to be written\\]*\n\n## Raw Metadata\n\n| Field | Value |\n| --- | --- |\n| created | 2026-04-14T09:02:53.618Z |\n| creator | Un-named |\n| exif_CreateDate | 2026:04:14 09:02:53.618Z |\n| exif_Creator | Un-named |\n| exif_ExifToolVersion | 13.55 |\n| exif_FileModifyDate | 2026:04:16 16:01:34+01:00 |\n| exif_FileName | Information Security Policy - DRAFT v0.8.docx |\n| exif_FilePermissions | -rw-r--r-- |\n| exif_FileSize | 10 kB |\n| exif_FileType | DOCX |\n| exif_FileTypeExtension | docx |\n| exif_LastModifiedBy | Un-named |\n| exif_MIMEType | application/vnd.openxmlformats-officedocument.wordprocessingml.document |\n| exif_ModifyDate | 2026:04:14 09:02:53.618Z |\n| exif_RevisionNumber | 1 |\n| exif_ZipBitFlag | 0 |\n| exif_ZipCRC | 0x00000000 |\n| exif_ZipCompressedSize | 0 |\n| exif_ZipCompression | None |\n| exif_ZipFileName | word/ |\n| exif_ZipModifyDate | 2026:04:14 09:02:52 |\n| exif_ZipRequiredVersion | 10 |\n| exif_ZipUncompressedSize | 0 |\n| lastModifiedBy | Un-named |\n| modified | 2026-04-14T09:02:53.618Z |\n| revision | 1 |\n| version | 0.8 — DRAFT \\\\| February 2024 |\n\n## Related Notes\n\n- [Knowledge base index](../index.md)\n- [Lint report](../lint-report.md)"},"sources/uf-ministers-questions-briefing-pac-ministerial-questions-briefing.md":{"id":"sources/uf-ministers-questions-b   Jan 2024                                31\n\n             Feb 2O24                                29\n\n\n\n\nBackground notes:\n\n      • The target is 95% of new claims paid within 5 weeks (35 calendar days)\n\n      • December figure reflects seasonal pressures including reduced staffing over holiday period\n\n      • The data above covers new claims only; changes of circumstances are processed separately\n\f     • Comparator: pre-pandemic average was 25 days\n\n\nSensitivities:\n\n     • [REG-B] report on UC published January 2024 flagged regional variations\n\n     • Staff unions have raised concerns about caseload per processor\n\n     • FOI request pending on disaggregated data by region and clairnant demographic\n\n\n\nQUESTION 2: PIP Assessment Wait Times\n\n     [Remainder of document — 14 further questions — not extracted due to OCR quality issues. Manual\n     review recommended.]\n\n## Raw Metadata\n\n| Field | Value |\n| --- | --- |\n| Author | (anonymous) |\n| CreationDate | Tue Apr 14 09:58:50 2026 BST |\n| Creator | (unspecified) |\n| Custom Metadata | no |\n| Encrypted | no |\n| File size | 4182 bytes |\n| Form | none |\n| JavaScript | no |\n| Keywords |  |\n| Metadata Stream | no |\n| ModDate | Tue Apr 14 09:58:50 2026 BST |\n| Optimized | no |\n| PDF version | 1.4 |\n| Page rot | 0 |\n| Page size | 595.276 x 841.89 pts (A4) |\n| Pages | 2 |\n| Producer | ReportLab PDF Library - (opensource) |\n| Subject | (unspecified) |\n| Suspects | no |\n| Tagged | no |\n| Title | (anonymous) |\n| UserProperties | no |\n| exif_Author | (anonymous) |\n| exif_CreateDate | 2026:04:14 08:58:50+00:00 |\n| exif_Creator | (unspecified) |\n| exif_ExifToolVersion | 13.55 |\n| exif_FileModifyDate | 2026:04:16 16:01:34+01:00 |\n| exif_FileName | Ministers_Questions_Briefing_Pack_12March.pdf |\n| exif_FilePermissions | -rw-r--r-- |\n| exif_FileSize | 4.2 kB |\n| exif_FileType | PDF |\n| exif_FileTypeExtension | pdf |\n| exif_Linearized | No |\n| exif_MIMEType | applica \n| Child Benefit | Cannot be recovered from CB directly |  |  | Recovery via [DEPT-D] |\n| Tax Credits |  |  |  | [DEPT-D] responsibility — not [DEPT-C] |\n\n## Worksheet: Escalation Thresholds\n\n| Debt value | Action | Authority level | Timescale |\n| --- | --- | --- | --- |\n| £0 – £65 | Write off (below cost of recovery) | Team Leader | Immediate |\n| £65.01 – £500 | Standard recovery from benefits | Decision Maker | Within 28 days of overpayment decision |\n| £501 – £5,000 | Standard recovery + direct earnings attachment if no benefit in payment | HEO | Within 28 days |\n| £5,001 – £10,000 | Above + consider civil court action | SEO | Review at 90 days if not recovered |\n| £10,001 – £50,000 | Above + mandatory referral to Debt Enforcement | Grade 7 | Review at 60 days |\n| £50,001 – £100,000 | Senior management review + potential fraud referral | G6 | Immediate review |\n| Over £100,000 | Director approval required for recovery strategy | SCS1 | Immediate |\n| Over £1m |  | Director General + referral to HMT | Immediate |\n| [NOTE: The threshold at £65 was set in 2009 and has never been uprated. In real terms this is approximately £45 in 2009 prices. A review was recommended by the [REG-B] in 2019 but has not been actioned.] |  |  |  |\n| [KNOWN ERROR: The £1m threshold row is missing the 'Action' column text. It should read: 'Full recovery strategy and ministerial briefing'. This has been reported but not yet fixed in the published version.] |  |  |  |\n\n## Worksheet: Fraud vs Non-Fraud\n\n| Type | Definition | Recovery approach | Limitation period |\n| --- | --- | --- | --- |\n| Fraud (civil) | Claimant knowingly provided false information | Maximum recovery rate + civil penalty (50% of overpayment, min £350, max £5,000) | 6 years from date of overpayment decision |\n| Fraud (criminal) | As above but referred for prosecution | Compensation order via courts + ongoing recovery | 6 years from date of conviction |\n| Claimant error | Claimant failed to report a change of circumstances but without fraudulent intent | Standard recovery rate | 6 years from overpayment decision |\n| Official error | [DEPT-C] made a mistake in calculating the benefit | Recovery only where claimant could reasonably have been expected to know they were being overpaid | 6 years — but see note below |\n| Technical | System error resulting in overpayment | Case-by-case assessment | No fixed policy — legal advice required |\n| [IMPORTANT: The limitation period for recovery of official error overpayments is contentious. [DEPT-C]'s legal position is that the 6-year limit applies, but Upper Tribunal decisions in 2022 and 2023 have cast doubt on this. Await outcome of Court of Appeal case expected Q2 2024 before relying on this table.] |  |  |  |\n\n## Worksheet: Payment Methods\n\n| Method | Minimum amount | Notes |\n| --- | --- | --- |\n| Deduction from ongoing benefit | N/A | Preferred method — automatic |\n| Direct Debit | £1 per month | Set up via Debt Management helpline |\n| Standing Order | £1 per month |  |\n| Online payment (GOV.UK Pay) | £5 | go.to/repay-benefit-overpayment |\n| Telephone payment (card) | £5 | Via Debt Management helpline: 0800 XXX XXXX |\n| Cheque | £5 | Payable to '[DEPT-C] Debt Management' — note: cheques being phased out, target removal date December 2024 |\n| Direct Earnings Attachment | N/A | Employer deduction — no court order needed for benefit debts |\n| Court order (County Court Judgment) | N/A | Last resort — requires legal authorisation |\n\n## Worksheet: Contact\n\n| Debt Management Helpline: 0800 XXX XXXX |\n| --- |\n| Monday to Friday, 08:00 – 18:00 |\n| Email: debt.management@[department].gov.uk |\n| This document was last updated in November 2023. Recovery rates for UC are updated each April in line with the standard allowance. JSA/ESA/PC fixed rates are updated annually — the rates shown here are 2023-24 rates. |\n\n## Raw Metadata\n\n| Field | Value |\n| --- | --- |\n| created | 2026-04-14T08:54:51 |\n| cr rtment C\\] \\ Version 2.1 \\ Effective from 1 April 2024 Owner: Talent & Performance Team 1\\. Overview This framework sets out how individual performance is managed across \\[DEPT-C\\]. It applies to all employees at AA to Grade 6. SCS performance is managed under a separate \\[Central Government Body\\] framework. 2\\. Performance Year The performance year runs from 1 April to 31 March. All staff must have a performance agreement in place by 30 April each year. 3\\. Objectives Each employee must have between 3 and 5 objectives agreed with their line manager. Objectives must be SMART...\n\n## Metadata\n\n| Field | Value |\n| --- | --- |\n| Source ID | UF-PERFORMANCE-MANAGEMENT-FRAMEWORK-2024-25 |\n| Title | Performance Management Framework 2024–25 |\n| Raw source | [Performance_Management_Framework_2024-25.docx](../../unstructured_files/Performance_Management_Framework_2024-25.docx) |\n| Format | docx |\n| Document type | framework |\n| Department |  |\n| Owner | Talent & Performance Team |\n| Status | unknown |\n| Version |  |\n| Publication date |  |\n| Last updated |  |\n| Audience |  |\n| Topics | people-policies, welsh-language-standards |\n| Data origin | Challenge 2 corpus data is synthetic hackathon fixture data. |\n| Contains real personal data | false |\n| Contains synthetic identifiers | false |\n| SHA-256 | 6d65f8a6b0e95119bfdc617972bd8254f38e93913087953217dabf27fd41ddef |\n\n## Navigation\n\n- Topic: [People Policies](../topics/people-policies.md)\n- Topic: [Welsh Language Standards](../topics/welsh-language-standards.md)\n\n## Extracted Content\n\n**Performance Management Framework 2024–25**\n\n\\[Government Department C\\] \\| Version 2.1 \\| Effective from 1 April 2024\n\nOwner: Talent & Performance Team\n\n1\\. Overview\n\nThis framework sets out how individual performance is managed across \\[DEPT-C\\]. It applies to all employees at AA to Grade 6. SCS performance is managed under a separate \\[Central Government Body\\] framework.\n\n2\\. Performance Year\n\nThe performance year runs from 1 April to 31 March. All staff must have a performance agreement in place by 30 April each year.\n\n3\\. Objectives\n\nEach employee must have between 3 and 5 objectives agreed with their line manager. Objectives must be SMART (Specific, Measurable, Achievable, Relevant, Time-bound).\n\nAt least one objective must relate to the employee’s development and at least one must align to their directorate’s business plan.\n\n4\\. In-Year Conversations\n\nLine managers must hold a minimum of 4 formal performance conversations per year:\n\n|                          |            |                                    |\n|--------------------------|------------|------------------------------------|\n| **Conversation**         | **Timing** | **Purpose**                        |\n| Objective setting        | April      | Agree objectives for the year      |\n| Mid-year review          | October    | Review progress, adjust objectives |\n| End-of-year review       | March      | Assess overall performance         |\n| Development conversation | Any time   | Focus on learning and career       |\n\nIn addition, regular informal check-ins are expected — ideally fortnightly or monthly.\n\n5\\. Performance Ratings\n\nAt the end of the performance year, each employee receives one of the following ratings:\n\n|  |  |\n|----|----|\n| **Rating** | **Description** |\n| Exceeded | Consistently exceeded all objectives and demonstrated exceptional behaviours |\n| Met | Met all or most objectives and consistently demonstrated expected behaviours |\n| Not Met | Did not meet one or more objectives or did not consistently demonstrate expected behaviours |\n\nNote: The ‘Must Improve’ rating was removed in 2023-24. Employees who are not meeting expectations should be supported through the Improving Performance procedure (see section 7).\n\n6\\. Moderation\n\nAll ratings are subject to moderation at directorate level. The purpose of moderation is to ensure consistency of standards across teams. Moderation panels are chaired by an SCS1 or above.\n\nExpected distribution:\n\n- Exceeded: approximately 25% of staff\n\n- Met: approximately 65–70%\n\n- Not Met: approximately 5–10%\n\nThese are guidelines, not quotas. Panels should not force ratings to match the distribution if the evidence does not support it.\n\n7\\. Improving Performance\n\nWhere an employee’s performance is below the expected standard, the line manager should first address this through informal support. If performance does not improve, a formal Improving Performance process may be initiated.\n\n|  |  |  |\n|----|----|----|\n| **Stage** | **Duration** | **Outcome if no improvement** |\n| Stage 1 — Support Plan | 8 weeks | Progress to Stage 2 |\n| Stage 2 — Formal Review | 8 weeks | Progress to Stage 3 |\n| Stage 3 — Final Review | 4 weeks | Dismissal or redeployment may be considered |\n\nAt each stage, the employee has the right to be accompanied by a trade union representative or colleague. A written record must be kept.\n\nNote: The Improving Performance procedure is separate from the Disciplinary Policy and the Grievance Policy, although an employee may raise a grievance about the performance process. Where this happens, the performance process will normally continue — see the Grievance Policy, section 5 (Overlapping processes) for guidance.\n\n8\\. Performance-Related Pay\n\nPerformance ratings directly affect pay progression:\n\n|  |  |\n|----|----|\n| **Rating** | **Pay outcome** |\n| Exceeded | Non-consolidated performance payment of £1,000 (if applicable — see pay circular) |\n| Met | Standard pay progression (if not at top of pay band) |\n| Not Met | No pay progression; no performance payment |\n\n9\\. Appeals\n\nEmployees who disagree with their performance rating may appeal within 10 working days of receiving their rating. Appeals are heard by a manager at least one grade above the employee’s line manager.\n\nThe appeal process must be completed within 20 working days of submission. This timeline conflicts with the Grievance Policy timeline of 15 working days for initial hearing — where both processes run concurrently, the longer performance appeal timeline takes precedence.\n\n10\\. Record Keeping\n\nAll performance records (objectives, conversation notes, ratings) must be recorded on the Performance Management module in the HR system.\n\nRecords are retained for 5 years after the end of the relevant performance year.\n\n11\\. Equality\n\nThe performance management framework must be applied fairly and without discrimination. Moderation panels must consider whether ratings show any adverse patterns related to protected characteristics. The Equality and Diversity team produces an annual analysis of ratings by protected characteristic.\n\n12\\. Review\n\nThis framework is reviewed annually before the start of each performance year.\n\nLast reviewed: March 2024 \\| Next review: March 2025\n\nContact: performance.management@\\[department\\].gov.uk\n\n## Raw Metadata\n\n| Field | Value |\n| --- | --- |\n| created | 2026-04-14T09:02:53.821Z |\n| creator | Un-named |\n| exif_CreateDate | 2026:04:14 09:02:53.821Z |\n| exif_Creator | Un-named |\n| exif_ExifToolVersion | 13.55 |\n| exif_FileModifyDate | 2026:04:16 16:01:34+01:00 |\n| exif_FileName | Performance_Management_Framework_2024-25.docx |\n| exif_FilePermissions | -rw-r--r-- |\n| exif_FileSize | 12 kB |\n| exif_FileType | DOCX |\n| exif_FileTypeExtension | docx |\n| exif_LastModifiedBy | Un-named |\n| exif_MIMEType | application/vnd.openxmlformats-officedocument.wordprocessingml.document |\n| exif_ModifyDate | 2026:04:14 09:02:53.821Z |\n| exif_RevisionNumber | 1 |\n| exif_ZipBitFlag | 0 |\n| exif_ZipCRC | 0x00000000 |\n| exif_ZipCompressedSize | 0 |\n| exif_ZipCompression | None |\n| exif_ZipFileName | word/ |\n| exif_ZipModifyDate | 2026:04:14 09:02:52 |\n| exif_ZipRequiredVersion | 10 |\n| exif_ZipUncompressedSize | 0 |\n| lastModifiedBy | Un-named |\n :"# UC Managed Migration Programme Board\n## Summary\n\n- Source: [Programme Board Minutes 14 Feb 2024.docx](../../unstructured_files/Programme%20Board%20Minutes%2014%20Feb%202024.docx)\n- Extraction: `pandoc-docx` with `high` quality.\n- Extract: UC Managed Migration Programme Board Minutes — 14 February 2024 Attendees: \\[REDACTED — SCS attendee list removed for data minimisation\\] Apologies: \\[REDACTED\\] Chair opened the meeting at 10:05 (5 minutes late due to room booking issue). 1\\. Minutes of previous meeting (17 January) Minutes agreed as accurate. Outstanding actions reviewed: ACTION 23/47 (from October 2023): Complete data quality audit for migration cohort 3. Owner: Head of Data. Status: STILL OPEN. Chair expressed frustration that this has been outstanding for 4 months. Owner committed to completing by end February. > \\[Note from minute taker: this same commitment was made...\n\n## Metadata\n\n| Field | Value |\n| --- | --- |\n| Source ID | UF-PROGRAMME-BOARD-MINUTES-14-FEB-2024 |\n| Title | UC Managed Migration Programme Board |\n| Raw source | [Programme Board Minutes 14 Feb 2024.docx](../../unstructured_files/Programme%20Board%20Minutes%2014%20Feb%202024.docx) |\n| Format | docx |\n| Document type | minutes |\n| Department |  |\n| Owner |  |\n| Status | unknown |\n| Version |  |\n| Publication date |  |\n| Last updated |  |\n| Audience |  |\n| Topics | discretionary-housing-payments, incident-risk-and-assurance, overpayment-recovery |\n| Data origin | Challenge 2 corpus data is synthetic hackathon fixture data. |\n| Contains real personal data | false |\n| Contains synthetic identifiers | false |\n| SHA-256 | d9333d5deb31b69e38fb9ad1b827f56ad1d91ee44ded732adbb661040e7a48ef |\n\n## Navigation\n\n- Topic: [Discretionary Housing Payments](../topics/discretionary-housing-payments.md)\n- Topic: [Incident Risk And Assurance](../topics/incident-risk-and-assurance.md)\n- Topic: [Overpayment Recovery](../topics/overpayment-recovery.md)\n- Entity: [Universal Credit Migration](../entities/universal-credit-migration.md)\n\n## Extracted Content\n\n**UC Managed Migration Programme Board**\n\n**Minutes — 14 February 2024**\n\nAttendees: \\[REDACTED — SCS attendee list removed for data minimisation\\]\n\nApologies: \\[REDACTED\\]\n\nChair opened the meeting at 10:05 (5 minutes late due to room booking issue).\n\n1\\. Minutes of previous meeting (17 January)\n\nMinutes agreed as accurate. Outstanding actions reviewed:\n\n**ACTION 23/47** (from October 2023): Complete data quality audit for migration cohort 3. Owner: Head of Data. Status: STILL OPEN. Chair expressed frustration that this has been outstanding for 4 months. Owner committed to completing by end February.\n\n> *\\[Note from minute taker: this same commitment was made in both the November and January meetings.\\]*\n\n**ACTION 24/01:** Provide updated cost forecast for Q4. Owner: Finance BP. Status: CLOSED. Paper circulated — see agenda item 3.\n\n**ACTION 24/02:** Confirm IT release schedule for March. Owner: Digital Delivery. Status: OPEN. Digital Delivery noted a dependency on \\[REDACTED\\] third party. Expected confirmation by 21 Feb.\n\n2\\. Programme Status Update\n\nSRO presented the programme dashboard. Key points:\n\n- Overall RAG status: AMBER (unchanged from January)\n\n- Migration volumes: 12,400 notices issued in January against a target of 15,000. Cumulative total since programme start: 247,000.\n\n- Completion rate: 78% of noticed claimants have completed migration within 3 months. Target is 85%.\n\n- Call volumes: 34% increase in Migration Helpline calls compared to December. Average wait time now 22 minutes (target: 10 minutes).\n\nDiscussion: Board member A asked whether the shortfall in notices was a capacity issue or a policy choice. SRO clarified that \\[DEPT-C\\] had deliberately slowed the notice rate in late January due to the \\[REG-B\\] report and associated media coverage. Board member B questioned whether this was an appropriate reason to deviate from the plan. SRO noted the Permanent Secretary had been briefed and was comfortable with the approach.\n\nChair noted that the programme is now 4 months behind the published completion date of March 2025 and asked for a revised timeline. SRO committed to presenting a rebaselined plan at the March board.\n\n**ACTION 24/03:** SRO to present rebaselined programme plan with revised completion date. Due: March board (13 March 2024).\n\n3\\. Finance Update\n\nFinance BP presented the Q3 outturn and Q4 forecast.\n\n- Q3 spend: £47.2m against budget of £52.1m (underspend of £4.9m, mainly due to delayed IT releases)\n\n- Q4 forecast: £58.3m against budget of £54.0m (pressure of £4.3m, driven by helpline demand)\n\n- Full year forecast: £193.5m against budget of £198.0m (underspend of £4.5m)\n\nFinance BP noted that the Q4 pressure could be managed within the overall programme underspend and did not require a formal budget transfer at this stage.\n\n**ACTION 24/04:** Finance BP to confirm whether helpline cost pressure is a one-off or a recurring trend. Due: March board.\n\n4\\. Risks and Issues\n\nRisk owner presented the top 5 risks. Chair noted that risk R-0023 (IT system capacity during peak migration) had been on the register for 18 months without mitigation progressing. Digital Delivery explained that the planned infrastructure upgrade had been descoped from the Q3 release due to conflicting priorities with the Fraud Detection project.\n\nBoard member C raised a new risk: potential judicial review challenge from a disability rights organisation regarding the adequacy of support for disabled claimants during migration. Legal team had been consulted; advice expected by end February.\n\n**ACTION 24/05:** Legal to provide assessment of judicial review risk. Due: 28 February 2024.\n\n\\[Item 5 discussed under AOB due to time pressure\\]\n\n5\\. AOB\n\n- Chair reminded members that the March meeting has been moved to 13 March (originally 14 March) to avoid a clash with the PAC hearing.\n\n- Head of Comms flagged that a BBC Panorama programme on UC migration is scheduled for March. A media handling plan is being prepared.\n\n- SRO asked whether the board had appetite to commission an independent assurance review. No objection raised. SRO to identify suitable reviewers.\n\n**ACTION 24/06:** SRO to scope independent assurance review and report back at March board.\n\nMeeting closed at 11:42.\n\nNext meeting: 13 March 2024, 10:00–12:00, Room \\[REDACTED\\]\n\nMinutes prepared by: PMO Support\n\nApproved by: Chair, 19 February 2024\n\n## Raw Metadata\n\n| Field | Value |\n| --- | --- |\n| created | 2026-04-14T09:02:53.917Z |\n| creator | Un-named |\n| exif_CreateDate | 2026:04:14 09:02:53.917Z |\n| exif_Creator | Un-named |\n| exif_ExifToolVersion | 13.55 |\n| exif_FileModifyDate | 2026:04:16 16:01:34+01:00 |\n| exif_FileName | Programme Board Minutes 14 Feb 2024.docx |\n| exif_FilePermissions | -rw-r--r-- |\n| exif_FileSize | 11 kB |\n| exif_FileType | DOCX |\n| exif_FileTypeExtension | docx |\n| exif_LastModifiedBy | Un-named |\n| exif_MIMEType | application/vnd.openxmlformats-officedocument.wordprocessingml.document |\n| exif_ModifyDate | 2026:04:14 09:02:53.917Z |\n| exif_RevisionNumber | 1 |\n| exif_ZipBitFlag | 0 |\n| exif_ZipCRC | 0x00000000 |\n| exif_ZipCompressedSize | 0 |\n| exif_ZipCompression | None |\n| exif_ZipFileName | word/ |\n| exif_ZipModifyDate | 2026:04:14 09:02:52 |\n| exif_ZipRequiredVersion | 10 |\n| exif_ZipUncompressedSize | 0 |\n| lastModifiedBy | Un-named |\n| modified | 2026-04-14T09:02:53.917Z |\n| revision | 1 |\n\n## Related Notes\n\n- [Knowledge base index](../index.md)\n- [Lint report](../lint-report.md)"},"sources/uf-raising-concerns-whistleblowing-raising-concerns-at-work.md":{"id":"sources/uf-raising-concerns-whistleblowing-raising-concerns-at-work.md","type":"Source","title":"Raising Concerns at Work","description":"Source note for UF-RAISING-CONCERNS-WHISTLEBLOWING-GUIDANCE: Raising Concerns at Work.","timestamp":"2026-06-27","aliases":"UF-RAISING-CONCERNS-WHISTLEBLOWING-GUIDANCE;Raising Concerns at Work;Raising Concerns (Whistleblowing) Guidance","section":"sources","source":"challenge-2/wiki/sources/uf-raising-concerns-whistleblowing-raising-concerns-at-work.md","body":"# Raising Concerns at Work\n## Summary\n\n- Source: [Raising Concerns (Whistleblowing) Guidance.docx](../../unstructured_files/Raising%20Concerns%20%28Whistleblowing%29%20Guidance.docx)\n- Extraction: `pandoc-docx` with `high` quality.\n- Extract: Raising Concerns at Work (Whistleblowing Guidance) \\[Government Department C\\] \\ July 2023 Owner: Corporate Governance Directorate \\ Version: 3.0 1\\. Introduction \\[DEPT-C\\] is committed to the highest standards of conduct, openness, and accountability. This guidance sets out how employees and others working for or with the department can raise concerns about wrongdoing. This guidance applies to: - All \\[DEPT-C\\] employees - Agency workers, contractors, and consultants - Secondees from other departments or organisations - Former employees (in respect of concerns arising during their employment) 2\\. What counts as a qualifying disclosure? The...\n\n## Metadata\n\n| Field | Value |\n| --- | --- |\n| Source ID | UF-RAISING-CONCERNS-WHISTLEBLOWING-GUIDANCE |\n| Title | Raising Concerns at Work |\n| Raw source | [Raising Concerns (Whistleblowing) Guidance.docx](../../unstructured_files/Raising%20Concerns%20%28Whistleblowing%29%20Guidance.docx) |\n| Format | docx |\n| Document type | guidance |\n| Department |  |\n| Owner | Corporate Governance Directorate \\\\| Version: 3.0 |\n| Status | unknown |\n| Version |  |\n| Publication date |  |\n| Last updated |  |\n| Audience |  |\n| Topics | data-protection-and-information-security, foi-and-transparency, people-policies, overpayment-recovery, welsh-language-standards |\n| Data origin | Challenge 2 corpus data is synthetic hackathon fixture data. |\n| Contains real personal data | false |\n| Contains synthetic identifiers | false |\n| SHA-256 | 0b163a0d5d0e9363de2e04ae64583f3171a5d03893c60f073c2800e15b78c5b3 |\n\n## Navigation\n\n- Topic: [Data Protection And Information Security](../topics/data-protection-and-information-security.md)\n- Topic: [FOI And Transparency](../topics/foi-and-transparency.md)\n- Topic: [People Policies](../topics/people-policies.md)\n- Topic: [Overpayment Recovery](../topics/overpayment-recovery.md)\n- Topic: [Welsh Language Standards](../topics/welsh-language-standards.md)\n\n## Extracted Content\n\n**Raising Concerns at Work**\n\n**(Whistleblowing Guidance)**\n\n\\[Government Department C\\] \\| July 2023\n\nOwner: Corporate Governance Directorate \\| Version: 3.0\n\n1\\. Introduction\n\n\\[DEPT-C\\] is committed to the highest standards of conduct, openness, and accountability. This guidance sets out how employees and others working for or with the department can raise concerns about wrongdoing.\n\nThis guidance applies to:\n\n- All \\[DEPT-C\\] employees\n\n- Agency workers, contractors, and consultants\n\n- Secondees from other departments or organisations\n\n- Former employees (in respect of concerns arising during their employment)\n\n2\\. What counts as a qualifying disclosure?\n\nThe Public Interest Disclosure Act 1998 (PIDA) protects workers who disclose information that they reasonably believe shows one or more of the following:\n\n\\(a\\) A criminal offence has been committed, is being committed, or is likely to be committed\n\n\\(b\\) A person has failed, is failing, or is likely to fail to comply with a legal obligation\n\n\\(c\\) A miscarriage of justice has occurred, is occurring, or is likely to occur\n\n\\(d\\) The health or safety of any individual has been, is being, or is likely to be endangered\n\n\\(e\\) The environment has been, is being, or is likely to be damaged\n\n\\(f\\) Information tending to show any of the above has been, is being, or is likely to be deliberately concealed\n\nConcerns about personal employment matters (such as pay, grading, or workload) are not qualifying disclosures and should be raised through the Grievance Policy.\n\n3\\. How to raise a concern\n\n3.1 Internal channels (preferred)\n\nEmployees should normally raise concerns with their line manager in the first instance. If this is not appropriate (for example, if the concern involves the line manager), the following alternative channels are available:\n\n- Nominated Officer for the directorate\n\n- HR Casework Team: hrcase@\\[department\\].gov.uk\n\n- Counter Fraud Team: counter.fraud@\\[department\\].gov.uk\n\n- Departmental Raising Concerns helpline: 0800 XXX XXXX (confidential)\n\n3.2 External channels\n\nIf an employee has raised a concern internally and believes it has not been addressed, or if they believe internal reporting is inappropriate, they may report to:\n\n- The \\[Regulatory Body B\\] (\\[REG-B\\])\n\n- The relevant regulatory body (e.g., the \\[Regulatory Body A\\] for data protection concerns)\n\n- A Member of Parliament\n\nEmployees considering external disclosure should seek advice from the nominated officer or a trade union representative first.\n\n3.3 Anonymous reporting\n\nAnonymous concerns will be considered, but it is more difficult to investigate and provide feedback when the identity of the reporter is unknown. Employees are encouraged to identify themselves wherever possible. All disclosures are treated in confidence.\n\n4\\. Protections\n\nEmployees who raise concerns in good faith are protected from detrimental treatment under PIDA. This means:\n\n- They will not be disciplined or dismissed for raising a concern\n\n- They will not be subjected to bullying, harassment, or victimisation\n\n- Their career progression will not be adversely affected\n\nAny manager who retaliates against an employee for raising a concern will themselves be subject to disciplinary action.\n\nIf an employee believes they have suffered detriment as a result of raising a concern, they should contact the Raising Concerns helpline or their trade union immediately.\n\n5\\. Investigation\n\nAll concerns will be acknowledged within 5 working days. An initial assessment will determine whether a full investigation is required.\n\nInvestigations are conducted by the Corporate Governance team or, where appropriate, by an independent investigator. The investigating officer will keep the reporter informed of progress, subject to any legal constraints.\n\nTimescale: The department aims to complete investigations within 60 working days, although complex cases may take longer.\n\n6\\. If the concern is not upheld\n\nNot every concern will result in a finding of wrongdoing. Where an investigation does not uphold the concern, the reporter will be informed of the reasons. Raising a concern in good faith that is not upheld does not constitute misconduct.\n\n7\\. Record keeping\n\nThe Corporate Governance team maintains a confidential register of all concerns raised. Data is retained for 7 years and then securely destroyed.\n\nAn anonymised annual summary is published in the department’s annual report.\n\n8\\. Related policies\n\n- Grievance Policy\n\n- Disciplinary Policy\n\n- Counter Fraud Policy\n\n- Information Security Policy\n\n- Civil Service Code\n\n9\\. Review\n\nThis guidance is reviewed every 2 years.\n\nLast reviewed: July 2023 \\| Next review: July 2025\n\nContact: raising.concerns@\\[department\\].gov.uk\n\n## Raw Metadata\n\n| Field | Value |\n| --- | --- |\n| created | 2026-04-14T09:02:53.894Z |\n| creator | Un-named |\n| exif_CreateDate | 2026:04:14 09:02:53.894Z |\n| exif_Creator | Un-named |\n| exif_ExifToolVersion | 13.55 |\n| exif_FileModifyDate | 2026:04:16 16:01:34+01:00 |\n| exif_FileName | Raising Concerns (Whistleblowing) Guidance.docx |\n| exif_FilePermissions | -rw-r--r-- |\n| exif_FileSize | 11 kB |\n| exif_FileType | DOCX |\n| exif_FileTypeExtension | docx |\n| exif_LastModifiedBy | Un-named |\n| exif_MIMEType | application/vnd.openxmlformats-officedocument.wordprocessingml.document |\n| exif_ModifyDate | 2026:04:14 09:02:53.894Z |\n| exif_RevisionNumber | 1 |\n| exif_ZipBitFlag | 0 |\n| exif_ZipCRC | 0x00000000 |\n| exif_ZipCompressedSize | 0 |\n| exif_ZipCompression | None |\n| exif_ZipFileName | word/ |\n| exif_ZipModifyDate | 2026:04:14 09:02:52 |\n| exif_ZipRequiredVersion | 10 |\n| exif_ZipUncompressedSize | 0 |\n| lastModifiedBy | Un-named |\n| modified | 2026-04-14T09:02:53.894Z |\n| owner | Corporate Governance Directorate \\\\| Version: 3.0 |\n| revision | 1 |\n\n## Related Notes\n\n- [Knowledge base index](../index.md)\n- [Lint report](../lint-report.md)"},"sources/uf-recruitment-and-selection-policy-recruitment-and-selection-policy.md":{"id":"sources/uf-recruitment-and-selection-policy-recruitment-and-selection-policy.md","type":"Source","title":"Recruitment and Selection Policy","description":"Source note for UF-RECRUITMENT-AND-SELECTION-POLICY: Recruitment and Selection Policy.","timestamp":"2026-06-27","aliases":"UF-RECRUITMENT-AND-SELECTION-POLICY;Recruitment and Selection Policy;Recruitment_and_Selection_Policy","section":"sources","source":"challenge-2/wiki/sources/uf-recruitment-and-selection-policy-recruitment-and-selection-policy.md","body":"# Recruitment and Selection Policy\n## Summary\n\n- Source: [Recruitment_and_Selection_Policy.pdf](../../unstructured_files/Recruitment_and_Selection_Policy.pdf)\n- Extraction: `pdftotext-layout` with `medium` quality.\n- Extract: OFFICIAL Recruitment and Selection Policy [GOVERNMENT DEPARTMENT C] December 2023 Document control: Version 6.0 Owner: Resourcing Team, HR Directorate Review date: December 2025 1. Principles [DEPT-C] All recruitment to must be conducted in accordance with the Civil Service Commission’s Recruitment Principles. Appointment must be on merit on the basis of fair and open competition. Exceptions to fair and open competition include: • Managed moves within the Civil Service • Loans and secondments • Redeployment (including as a reasonable adjustment) • Permitted exceptions as defined by the Civil Service Commission 2. Approval to Recruit Before...\n\n## Metadata\n\n| Field | Value |\n| --- | --- |\n| Source ID | UF-RECRUITMENT-AND-SELECTION-POLICY |\n| Title | Recruitment and Selection Policy |\n| Raw source | [Recruitment_and_Selection_Policy.pdf](../../unstructured_files/Recruitment_and_Selection_Policy.pdf) |\n| Format | pdf |\n| Document type | policy |\n| Department |  |\n| Owner |  |\n| Status | unknown |\n| Version |  |\n| Publication date |  |\n| Last updated |  |\n| Audience |  |\n| Topics | procurement-and-spending-controls, people-policies |\n| Data origin | Challenge 2 corpus data is synthetic hackathon fixture data. |\n| Contains real personal data | false |\n| Contains synthetic identifiers | false |\n| SHA-256 | 8600dd530591cc2125cb57e24d771a48f3c7680135904e5c61186eeb9b4e40fa |\n\n## Navigation\n\n- Topic: [Procurement And Spending Controls](../topics/procurement-and-spending-controls.md)\n- Topic: [People Policies](../topics/people-policies.md)\n\n## Extracted Tables\n\n### Table 1\n\n| Grade of vacancy | Approver | Additional requirements |\n| --- | --- | --- |\n| AA to EO | Grade 7 (budget holder) | Confirm budget allocation |\n| HEO to SEO | Grade 6 | Business case (1 page) |\n| Grade 7 | SCS1 (Director) | Business case + WFP approval |\n| Grade 6 | SCS2 (Director General) | Business case + ExCo notification |\n\n### Table 2\n\n| Grade of vacancy | Panel size | Requirements |\n| --- | --- | --- |\n| AA to EO | 2 | At least one trained interviewer |\n| HEO to SEO | 2 | Panel chair at least one grade above vacancy |\n| Grade 7 to Grade 6 | 3 | Panel chair at SCS level; at least one external panel member for Grade 6 |\n| SCS | 3-4 | Civil Service Commissioner oversight; independent panel member required |\n\n### Table 3\n\n| Roles accessing sensitive systems | Security Check (SC) | 6-8 weeks |\n| --- | --- | --- |\n| Roles accessing TOP SECRET materialDeveloped Vetting (DV) | 6-9 months |  |\n\n## Extracted Content\n\nOFFICIAL\n\n\n                      Recruitment and Selection Policy\n[GOVERNMENT DEPARTMENT C]                  | December 2023\n\nDocument control: Version 6.0 | Owner: Resourcing Team, HR Directorate | Review date:\nDecember 2025\n\n\n1. Principles\n                 [DEPT-C]\nAll recruitment to     must be conducted in accordance with the Civil Service Commission’s Recruitment\nPrinciples. Appointment must be on merit on the basis of fair and open competition.\n\nExceptions to fair and open competition include:\n\n      • Managed moves within the Civil Service\n\n      • Loans and secondments\n\n      • Redeployment (including as a reasonable adjustment)\n\n      • Permitted exceptions as defined by the Civil Service Commission\n\n\n\n2. Approval to Recruit\n\nBefore any vacancy can be advertised, approval must be obtained from the Workforce Planning team.\n\n      Grade of vacancy           Approver                     Additional requirements\n\n      AA to EO                   Grade 7 (budget holder)      Confirm budget allocation\n\n      HEO to SEO                 Grade 6                      Business case (1 page)\n\n      Grade 7                    SCS1 (Director)              Business case + WFP approval\n\n      Grade 6                    SCS2 (Director General)      Business case + ExCo notification\n                                                                                [Central Government Body]\n      SCS                        Permanent Secretary          Business case +                               approval\n\n      Note: These approval levels differ from the procurement approval matrix (see Spending Controls\n      Guidance). Recruitment costs should be considered separately from procurement — the Procurement\n      Thresholds do not apply to salary commitments.\n\n\n\n3. Advertising\n\nVacancies must be advertised on Civil Service Jobs (www.civilservicejobs.service.gov.uk) for a minimum\nof: 5 working days for internal competitions; 10 working days for external competitions.\n\nThe use of recruitment agencies requires Commercial Directorate approval regardless of cost, as\nrecruitment agency spend falls under the consultancy spending control.\n\f4. Selection Methods\n\nAll selection processes must include at least: a sift stage (application review) and an interview.\n\nAdditional assessment methods may include: written tests or work samples, presentations, assessment\ncentres (typically Grade 7 and above), psychometric tests (SCS only, using Civil Service approved tools).\n\n\n\n5. Interview Panels\n\n      Grade of vacancy           Panel size      Requirements\n\n      AA to EO                   2               At least one trained interviewer\n\n      HEO to SEO                 2               Panel chair at least one grade above vacancy\n\n      Grade 7 to Grade 6         3               Panel chair at SCS level; at least one external panel member for Grade 6\n\n      SCS                        3-4             Civil Service Commissioner oversight; independent panel member required\n\nAll panel members must have completed unconscious bias training within the last 2 years.\n\n\n\n6. Pre-employment Checks\n\nThe following checks are mandatory before appointment: identity verification, right to work in the UK,\ncriminal record check (DBS Basic as minimum; enhanced for specific roles), employment history\nverification, health declaration, qualification verification.\n\n      Role type                            Minimum clearance                        Processing time\n             [DEPT-C]\n      Most              roles              Baseline Personnel Security Standard 1-2\n                                                                                (BPSS)\n                                                                                    weeks\n\n      Roles accessing sensitive systems    Security Check (SC)                      6-8 weeks\n\n      Roles accessing TOP SECRET materialDeveloped Vetting (DV)                     6-9 months\n\n\n\n\n7. Offers and Onboarding\n\nConditional offers may be made subject to pre-employment checks. Unconditional offers must not be\nmade until all checks are complete.\n\nStarting salary is normally at the minimum of the pay band. Starting above the minimum requires Grade 6\napproval and must be justified by market data or the candidate’s experience.\n\n\n\n8. Record Retention\n\nRecruitment records must be retained for 12 months after the vacancy closes (for unsuccessful\ncandidates) or for the duration of employment plus 6 years (for successful candidates).\n\nPsychometric test results are retained for 2 years only.\n\f9. Monitoring\n\nThe Resourcing Team reports quarterly on: time to hire (target: 12 weeks from approval to start date),\ndiversity of applicants, shortlisted candidates, and appointees, cost per hire, hiring manager satisfaction.\n\n\n\n10. Complaints\n\nCandidates who believe the recruitment process was unfair may complain to: the Resourcing Team (for\nprocess complaints) or the Civil Service Commission (for complaints about the merit principle).\n                       [DEPT-C\nContact: recruitment@]           .gov.uk\n\nCivil Service Commission: https://civilservicecommission.independent.gov.uk\n\n## Raw Metadata\n\n| Field | Value |\n| --- | --- |\n| Author | (anonymous) |\n| CreationDate | Tue Apr 14 09:58:50 2026 BST |\n| Creator | (unspecified) |\n| Custom Metadata | no |\n| Encrypted | no |\n| File size | 6586 bytes |\n| Form | none |\n| JavaScript | no |\n| Keywords |  |\n| Metadata Stream | no |\n| ModDate | Tue Apr 14 09:58:50 2026 BST |\n| Optimized | no |\n| PDF version | 1.4 |\n| Page rot | 0 |\n| Page size | 595.276 x 841.89 pts (A4) |\n| Pages | 3 |\n| Producer | ReportLab PDF Library - (opensource) |\n| Subject | (unspecified) |\n| Suspects | no |\n| Tagged | no |\n| Title | (anonymous) |\n| UserProperties | no |\n| exif_Author |
