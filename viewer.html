 for at least 3 years. Time spent as a...\n\n## Metadata\n\n| Field | Value |\n| --- | --- |\n| Source ID | DOC-HB-010 |\n| Title | Right to Buy: Guidance for Tenants and Social Landlords |\n| Raw source | [DOC-HB-010-right-to-buy.md](../../structured_files/DOC-HB-010-right-to-buy.md) |\n| Format | md |\n| Document type | guidance |\n| Department | [DEPT-A] |\n| Owner |  |\n| Status | current |\n| Version |  |\n| Publication date | 2025-04-01 |\n| Last updated | 2025-10-15 |\n| Audience | Tenants and social landlords |\n| Topics | housing-benefit, homelessness-and-social-housing |\n| Data origin | Challenge 2 corpus data is synthetic hackathon fixture data. |\n| Contains real personal data | false |\n| Contains synthetic identifiers | false |\n| SHA-256 | f39518b132eca4689a4f33faa8ec6c3eddd5b92be72993e77e33703a8caecccc |\n\n## Related Sources\n\n- [DOC-HB-004](doc-hb-004-social-housing-frequently-asked-questions-gov-uk.md) - Social Housing: Frequently Asked Questions - GOV.UK\n\n## Navigation\n\n- Topic: [Housing Benefit](../topics/housing-benefit.md)\n- Topic: [Homelessness And Social Housing](../topics/homelessness-and-social-housing.md)\n- Entity: [Local Authorities](../entities/local-authorities.md)\n- Entity: [RTB1 Form](../entities/rtb1-form.md)\n\n## Extracted Content\n\n# Right to Buy: Guidance for Tenants and Social Landlords\n\nThis guidance sets out the Right to Buy scheme as it applies in England. It covers eligibility, discount calculations, the application process, and landlord obligations. For the overarching housing policy framework, see the Housing Benefit and Housing Policy Overview ([DOC-HB-004](doc-hb-004-social-housing-frequently-asked-questions-gov-uk.md)).\n\n## Eligibility\n\nYou may be eligible for the Right to Buy if you meet all of the following conditions:\n\n- Your home is your only or main residence.\n- You are a secure tenant of a local authority or a qualifying housing association.\n- You must have been a public sector tenant for at least 3 years. Time spent as a tenant of any public sector landlord counts, including previous tenancies with different councils or housing associations.\n- Your home is not in a designated rural area, a National Park, or an Area of Outstanding Natural Beauty where the Right to Buy has been suspended.\n- Your home is not sheltered housing or housing adapted for persons with disabilities where specific exemptions apply.\n- You are not subject to a court order for possession, bankruptcy, or anti-social behaviour.\n\nIf you are a joint tenant, only one of you needs to meet the tenancy length requirement, but all joint tenants must agree to the purchase.\n\n## Discount Calculations\n\nThe discount you receive depends on the type of property and how long you have been a public sector tenant. Discounts are subject to a regional maximum cap.\n\n### Discount Rates\n\n| Property Type | Qualifying Tenancy Period | Discount (% of Market Value) | Additional Per Year | Maximum Discount |\n|---|---|---|---|---|\n| House | 3 to 5 years | 35% | +1% per additional year | 70% or regional cap |\n| House | 5 to 10 years | 37% to 40% | +1% per additional year | 70% or regional cap |\n| House | 10 years or more | 40%+ | +1% per additional year | 70% or regional cap |\n| Flat | 3 to 5 years | 50% | +2% per additional year | 70% or regional cap |\n| Flat | 5 to 10 years | 54% to 60% | +2% per additional year | 70% or regional cap |\n| Flat | 10 years or more | 60%+ | +2% per additional year | 70% or regional cap |\n\nThe current regional maximum discount is 96,000 pounds outside London and 127,900 pounds in London. These caps are uprated annually in line with the Consumer Prices Index.\n\n### Cost Floor Rule\n\nIf your landlord has spent money on building, acquiring, repairing, or maintaining your home within the 15 years before your application, the discount may be limited so that the purchase price does not fall below the amount spent. Your landlord must provide a breakdown of qualifying costs if the cost floor applies.\n\n## Application Process\n\n### Step 1: Submit Your Application\n\nComplete the Right to Buy application form (RTB1) and submit it to your landlord. You can obtain the form from your landlord's housing office or download it from GOV.UK. Your landlord must acknowledge receipt within 4 weeks.\n\n### Step 2: Landlord's Response\n\nYour landlord must serve a notice (Section 124 notice) within 4 weeks of receiving your application if they admit the Right to Buy, or within 8 weeks if they deny it. If the Right to Buy is admitted, the notice will set out the terms of the proposed sale, including the market value, any structural defects, and service charge estimates for flats.\n\n### Step 3: Valuation\n\nThe property will be valued by your landlord or an independent valuer at current market value on the assumption of a willing seller. If you disagree with the valuation, you have the right to request a determination by the District Valuer within 3 months of receiving the Section 124 notice.\n\n### Step 4: Completion\n\nOnce terms are agreed, you have 12 months to complete the purchase. If you do not complete within this period, your landlord may serve a notice requiring completion within 56 days, after which the application lapses. You are responsible for your own legal costs and survey fees.\n\n## Landlord Obligations\n\nSocial landlords have the following obligations under the Right to Buy scheme:\n\n- Process applications promptly and within the statutory time limits set out above.\n- Provide tenants with accurate information about their rights, the discount, and any costs that may apply.\n- Not unreasonably delay or obstruct a valid Right to Buy application.\n- Maintain the property in good repair until completion of the sale.\n- Comply with the requirement to use Right to Buy receipts for replacement housing supply in accordance with Departmental directions.\n- Report all Right to Buy sales to the Department on a quarterly basis using the prescribed return.\n\nFailure to comply with these obligations may result in Departmental intervention, including the use of powers under section 164 of the Housing Act 1985 to determine the Right to Buy on the tenant's behalf.\n\n## Repayment of Discount\n\nIf you sell your home within 5 years of purchasing it under the Right to Buy, you may be required to repay some or all of the discount. The repayment is calculated on a sliding scale:\n\n- Sale within year 1: repay 100% of the discount\n- Sale within year 2: repay 80% of the discount\n- Sale within year 3: repay 60% of the discount\n- Sale within year 4: repay 40% of the discount\n- Sale within year 5: repay 20% of the discount\n\nThe repayment is based on the percentage of the discount relative to the current market value at the time of resale, not the original purchase price.\n\n## Recent Changes\n\n**October 2025 update:** The qualifying tenancy period for the Right to Buy has been increased from 3 years to 5 years for all new applications received on or after 1 April 2025. This change was introduced by the Social Housing (Regulation) Act 2025 and applies to all secure tenants in England. Applications submitted before 1 April 2025 are assessed under the previous 3-year qualifying period.\n\nThe regional maximum discount caps have also been frozen at their 2024/25 levels (96,000 pounds outside London and 127,900 pounds in London) and will not be uprated for the 2025/26 financial year.\n\nThese changes are intended to support the retention of social housing stock and ensure that the Right to Buy scheme operates sustainably alongside the Government's commitment to increase the supply of affordable housing.\n\n## Raw Metadata\n\n| Field | Value |\n| --- | --- |\n| audience | Tenants and social landlords |\n| department | [DEPT-A] |\n| document_id | DOC-HB-010 |\n| exif_ExifToolVersion | 13.55 |\n| exif_FileModifyDate | 2026:04:16 16:01:34+01:00 |\n| exif_FileName | DOC-HB-010-right-to-buy.md |\n| exif_FilePermissions | -rw-r--r-- |\n| exif_FileSize | 6.5 kB |\n| exif_FileType | TXT |\n| exif_FileTypeExtension | txt |\n| exif_LineCount | 99 |\n| exif_MIMEEncoding | us-ascii |\n| exif_MIMEType | text/plain |\n| exif_Newlines | Unix LF |\n| exif_WordCount | 1114 |\n| last_updated | 2025-10-15 |\n| publication_date | 2025-04-01 |\n| status | current |\n| title | Right to Buy: Guidance for Tenants and Social Landlords |\n| type | guidance |\n\n## Related Notes\n\n- [Knowledge base index](../index.md)\n- [Lint report](../lint-report.md)"},"sources/doc-sb-001-starting-a-business-in-the-uk-step-by-step.md":{"id":"sources/doc-sb-001-starting-a-business-in-the-uk-step-by-step.md","type":"Source","title":"Starting a Business in the UK: Step by Step","description":"Source note for DOC-SB-001: Starting a Business in the UK: Step by Step.","timestamp":"2026-01-10","aliases":"DOC-SB-001;Starting a Business in the UK: Step by Step;DOC-SB-001-starting-a-business","section":"sources","source":"challenge-2/wiki/sources/doc-sb-001-starting-a-business-in-the-uk-step-by-step.md","body":"# Starting a Business in the UK: Step by Step\n## Summary\n\n- Source: [DOC-SB-001-starting-a-business.html](../../structured_files/DOC-SB-001-starting-a-business.html)\n- Extraction: `pandoc-html` with `high` quality.\n- Extract: <div class=\"section\"> Steps to start your business Follow these steps in order. Some steps may not apply depending on the type of business you are setting up. 1. Choose your business structure Your legal structure affects how much tax you pay, the records you must keep, and your personal liability for business debts. The three most common structures are sole trader, limited company, and partnership. Review the comparison below before deciding. 2. Register your business All businesses must register with \\[Government Department D\\] (\\[DEPT-D\\]). If you are a sole trader, you must register for Self Assessment. Limited companies must be...\n\n## Metadata\n\n| Field | Value |\n| --- | --- |\n| Source ID | DOC-SB-001 |\n| Title | Starting a Business in the UK: Step by Step |\n| Raw source | [DOC-SB-001-starting-a-business.html](../../structured_files/DOC-SB-001-starting-a-business.html) |\n| Format | html |\n| Document type | guidance |\n| Department | [Government Department B] |\n| Owner |  |\n| Status | current |\n| Version |  |\n| Publication date | 2025-07-01 |\n| Last updated | 2026-01-10 |\n| Audience | Citizens starting a business |\n| Topics | business, self-employment, registration, small-business-and-self-employment, employment-rights-and-flexible-working |\n| Data origin | Challenge 2 corpus data is synthetic hackathon fixture data. |\n| Contains real personal data | false |\n| Contains synthetic identifiers | false |\n| SHA-256 | 3a63575d5a612c4496a753636be84f6db1ed19239926edc9cbb62f28158e1715 |\n\n## Related Sources\n\n- [DOC-SB-002](doc-sb-002-registering-as-self-employed-with-dept-d.md) - Registering as Self-Employed with [DEPT-D]\n- [DOC-SB-003](doc-sb-003-national-minimum-wage-and-national-living-wage-employer.md) - National Minimum Wage and National Living Wage: Employer Guidance\n- [DOC-SB-004](doc-sb-004-workplace-pensions-auto-enrolment-duties-for-employers.md) - WORKPLACE PENSIONS: AUTO-ENROLMENT DUTIES FOR EMPLOYERS\n- [DOC-SB-006](doc-sb-006-self-employment-and-housing-benefit-how-income-is-asses.md) - Self-employment and Housing Benefit: how income is assessed\n\n## Navigation\n\n- Topic: [Small Business And Self-employment](../topics/small-business-and-self-employment.md)\n- Topic: [Employment Rights And Flexible Working](../topics/employment-rights-and-flexible-working.md)\n- Entity: [Local Authorities](../entities/local-authorities.md)\n\n## Extracted Content\n\n<div class=\"section\">\n\n## Steps to start your business\n\nFollow these steps in order. Some steps may not apply depending on the type of business you are setting up.\n\n1.  ### Choose your business structure\n\n    Your legal structure affects how much tax you pay, the records you must keep, and your personal liability for business debts. The three most common structures are sole trader, limited company, and partnership. Review the comparison below before deciding.\n\n2.  ### Register your business\n\n    All businesses must register with \\[Government Department D\\] (\\[DEPT-D\\]). If you are a sole trader, you must register for Self Assessment. Limited companies must be incorporated with \\[Regulatory Body D\\]. Partnerships must also register with \\[DEPT-D\\] and nominate a partner to file the partnership tax return. You must register within three months of starting to trade, or you may face penalties.\n\n3.  ### Set up your business tax\n\n    You must register for VAT if your taxable turnover exceeds the current threshold of 90,000 pounds per year. You can also register voluntarily below this threshold. Corporation Tax registration is automatic for limited companies upon incorporation. Sole traders and partners pay Income Tax and National Insurance through Self Assessment.\n\n4.  ### Understand employer duties\n\n    If you employ staff, you must register as an employer with \\[DEPT-D\\], operate PAYE to deduct Income Tax and National Insurance from employee wages, provide a workplace pension scheme under auto-enrolment rules, and ensure you comply with National Minimum Wage legislation. You must also obtain Employers' Liability insurance with a minimum cover of 5 million pounds.\n\n5.  ### Get the licences and insurance you need\n\n    Some business activities require specific licences or permits from your local authority or a regulatory body. Check whether your business type requires any additional registration, for example food businesses must register with their local environmental health team at least 28 days before opening.\n\n</div>\n\n<div class=\"section\">\n\n## Comparing business structures\n\nThe table below summarises the key differences between the most common legal structures for small businesses in the UK.\n\n| Structure | Liability | Tax Treatment | Registration Requirement |\n|----|----|----|----|\n| Sole Trader | Unlimited personal liability for all business debts | Income Tax and Class 2/4 National Insurance via Self Assessment | Register with \\[DEPT-D\\] for Self Assessment |\n| Limited Company | Liability limited to the value of shares held | Corporation Tax on profits; directors pay Income Tax on salary and dividends | Incorporate with \\[Regulatory Body D\\] and register with \\[DEPT-D\\] for Corporation Tax |\n| Partnership | Each partner has unlimited personal liability (unless a Limited Liability Partnership) | Each partner pays Income Tax on their share of profits via Self Assessment | Register the partnership and each partner individually with \\[DEPT-D\\] |\n\n</div>\n\n<div class=\"section\">\n\n## Related guidance\n\n- [Registering as self-employed with \\[DEPT-D\\] ([DOC-SB-002](doc-sb-002-registering-as-self-employed-with-dept-d.md))]([DOC-SB-002](doc-sb-002-registering-as-self-employed-with-dept-d.md)-registering-self-employed.md)\n- [National Minimum Wage rates and employer guidance (DOC-SB-003)](doc-sb-003-national-minimum-wage-and-national-living-wage-employer.md)\n- [Workplace pensions and auto-enrolment duties (DOC-SB-004)](doc-sb-004-workplace-pensions-auto-enrolment-duties-for-employers.md)\n- [Understanding business rates (DOC-SB-006)](doc-sb-006-self-employment-and-housing-benefit-how-income-is-asses.md)\n\n</div>\n\n## Raw Metadata\n\n| Field | Value |\n| --- | --- |\n| audience | Citizens starting a business |\n| author | [Government Department B] |\n| description | A step-by-step guide to starting a business in the UK, covering registration, legal structures, tax obligations, and employer duties. |\n| document-id | DOC-SB-001 |\n| document-type | guidance |\n| exif_Audience | Citizens starting a business |\n| exif_Author | [Government Department B] |\n| exif_Description | A step-by-step guide to starting a business in the tart working for yourself, even if you are doing so alongside other employment. Registration ensures you pay the correct amount of Income Tax and National Insurance contributions on your self-employed earnings. Who needs to register You must register as self-employed if you earn more than 1,000 pounds in a tax year from self-employment, or if you need to prove you are self-employed (for example, to claim Tax-Free Childcare or apply for a mortgage). You do not need to register if your total self-employed income is below the...\n\n## Metadata\n\n| Field | Value |\n| --- | --- |\n| Source ID | DOC-SB-002 |\n| Title | Registering as Self-Employed with [DEPT-D] |\n| Raw source | [DOC-SB-002-registering-self-employed.md](../../structured_files/DOC-SB-002-registering-self-employed.md) |\n| Format | md |\n| Document type | form-instructions |\n| Department | [Government Department D] |\n| Owner |  |\n| Status | current |\n| Version |  |\n| Publication date | 12 January 2026 |\n| Last updated |  |\n| Audience | Self-employed individuals |\n| Topics | self-employment, tax-registration, dept-d, council-tax-reduction, small-business-and-self-employment |\n| Data origin | Challenge 2 corpus data is synthetic hackathon fixture data. |\n| Contains real personal data | false |\n| Contains synthetic identifiers | false |\n| SHA-256 | 274868d2e0cfccaccef77920ad67294f1cf476f03f66215b0ac6d6bb88c125f6 |\n\n## Related Sources\n\n- [DOC-SB-001](doc-sb-001-starting-a-business-in-the-uk-step-by-step.md) - Starting a Business in the UK: Step by Step\n- [DOC-SB-006](doc-sb-006-self-employment-and-housing-benefit-how-income-is-asses.md) - Self-employment and Housing Benefit: how income is assessed\n\n## Navigation\n\n- Topic: [Council Tax Reduction](../topics/council-tax-reduction.md)\n- Topic: [Small Business And Self-employment](../topics/small-business-and-self-employment.md)\n\n## Extracted Content\n\n# Registering as Self-Employed with [DEPT-D]\n\nYou must register with [Government Department D] ([DEPT-D]) as soon as you start working for yourself, even if you are doing so alongside other employment. Registration ensures you pay the correct amount of Income Tax and National Insurance contributions on your self-employed earnings.\n\n## Who needs to register\n\nYou must register as self-employed if you earn more than 1,000 pounds in a tax year from self-employment, or if you need to prove you are self-employed (for example, to claim Tax-Free Childcare or apply for a mortgage). You do not need to register if your total self-employed income is below the 1,000 pound trading allowance and you do not wish to claim expenses against it.\n\n## How to register: step by step\n\nFollow these steps to complete your registration online.\n\n1. **Go to the [DEPT-D] online services portal** at gov.uk/register-for-self-assessment. You will need a Government Gateway account. If you do not have one, you can create one during the registration process.\n\n2. **Select the reason for registration.** Choose \"You are registering because you are self-employed or a sole trader\" from the list of options. Do not select the option for registering a partnership, as that is a separate process.\n\n3. **Enter your personal details.** You will need your National Insurance number, your full legal name, date of birth, and current address. Have your National Insurance number to hand before you begin.\n\n4. **Provide your business details.** Enter the date you started trading, a description of your business activity, your business name (if different from your own name), and your business address (if different from your home address).\n\n5. **Confirm your registration.** Review your details and submit the form. [DEPT-D] will send you a letter within 10 working days containing your Unique Taxpayer Reference (UTR). You will need this UTR to file your Self Assessment tax return.\n\n6. **Set up your online Self Assessment account.** Once you have your UTR, enrol for Self Assessment online. This allows you to file your tax returns, view your tax position, and make payments electronically.\n\n7. **Register for Class 2 National Insurance.** As a self-employed person, you are liable to pay Class 2 National Insurance contributions if your profits exceed the Small Profits Threshold (currently 6,725 pounds per year). Class 4 National Insurance is calculated automatically on profits above 12,570 pounds when you file your return.\n\n## Deadline for registration\n\nYou must register by 5 October in the second tax year after you started your business. For example, if you started trading in June 2026, you must register by 5 October 2027 at the latest. However, [DEPT-D] strongly recommends registering as soon as possible.\n\n## Penalties for late registration\n\nIf you miss the registration deadline, [DEPT-D] may charge penalties in addition to any tax and National Insurance owed.\n\n| Deadline missed by | Penalty amount |\n|---|---|\n| Up to 3 months | Initial penalty of 100 pounds |\n| 3 to 6 months | 10 pounds per day, up to 900 pounds |\n| 6 to 12 months | The greater of 5% of the tax due or 300 pounds |\n| More than 12 months | The greater of 100% of the tax due or 300 pounds, depending on circumstances |\n\n[DEPT-D] may reduce or waive penalties if you have a reasonable excuse for the delay, such as a serious illness or the death of a close relative. You must notify [DEPT-D] of your reasonable excuse as soon as practicable.\n\n## After you register\n\nOnce registered, you must file a Self Assessment tax return each year by 31 January following the end of the tax year. You must also pay any tax and National Insurance owed by the same date. If your tax bill exceeds 1,000 pounds, [DEPT-D] will require you to make payments on account — advance payments towards the following year's bill.\n\nKeep records of all your income and expenses for at least five years after the 31 January submission deadline. [DEPT-D] may ask to inspect your records at any point during this period.\n\n## Related documents\n\n- [Starting a Business in the UK: Step by Step (DOC-SB-001)](doc-sb-001-starting-a-business-in-the-uk-step-by-step.md)\n- [Understanding your tax obligations as an employer (DOC-SB-006)](doc-sb-006-self-employment-and-housing-benefit-how-income-is-asses.md)\n\n## Raw Metadata\n\n| Field | Value |\n| --- | --- |\n| audience | Self-employed individuals |\n| department | [Government Department D] |\n| document_id | DOC-SB-002 |\n| exif_ByteOrderMark | No |\n| exif_ExifToolVersion | 13.55 |\n| exif_FileModifyDate | 2026:04:16 16:01:34+01:00 |\n| exif_FileName | DOC-SB-002-registering-self-employed.md |\n| exif_FilePermissions | -rw-r--r-- |\n| exif_FileSize | 4.6 kB |\n| exif_FileType | TXT |\n| exif_FileTypeExtension | txt |\n| exif_LineCount | 67 |\n| exif_MIMEEncoding | utf-8 |\n| exif_MIMEType | text/plain |\n| exif_Newlines | Unix LF |\n| exif_WordCount | 734 |\n| publication_date | 12 January 2026 |\n| status | current |\n| title | Registering as Self-Employed with [DEPT-D] |\n| topics | [\"self-employment\", \"tax registration\", \"[DEPT-D]\"] |\n| type | form-instructions |\n\n## Related Notes\n\n- [Knowledge base index](../index.md)\n- [Lint report](../lint-report.md)"},"sources/doc-sb-003-national-minimum-wage-and-national-living-wage-employer.md":{"id":"sources/doc-sb-003-national-minimum-wage-and-national-living-wage-employer.md","type":"Source","title":"National Minimum Wage and National Living Wage: Employer Guidance","description":"Source note for DOC-SB-003: National Minimum Wage and National Living Wage: Employer Guidance.","timestamp":"2025-04-01","aliases":"DOC-SB-003;National Minimum Wage and National Living Wage: Employer Guidance;DOC-SB-003-national-minimum-wage","section":"sources","source":"challenge-2/wiki/sources/doc-sb-003-national-minimum-wage-and-national-living-wage-employer.md","body":"# National Minimum Wage and National Living Wage: Employer Guidance\n## Summary\n\n- Source: [DOC-SB-003-national-minimum nglish Summary\n\n## Navigation\n\n- Topic: [Small Business And Self-employment](../topics/small-business-and-self-employment.md)\n- Topic: [Employment Rights And Flexible Working](../topics/employment-rights-and-flexible-working.md)\n- Topic: [People Policies](../topics/people-policies.md)\n- Topic: [Incident Risk And Assurance](../topics/incident-risk-and-assurance.md)\n- Entity: [Employment Rights Act 1996](../entities/employment-rights-act-1996.md)\n\n## Extracted Content\n\n<div class=\"section\">\n\n## Current rates from April 2025\n\nThe following rates apply from 1 April 2025. All employers must pay at least these rates to qualifying workers. The National Living Wage applies to workers aged 21 and over. The National Minimum Wage applies to workers below that age and to apprentices.\n\n| Age Group                          | Hourly Rate  |\n|------------------------------------|--------------|\n| 21 and over (National Living Wage) | 12.21 pounds |\n| 18 to 20                           | 10.00 pounds |\n| Under 18                           | 7.55 pounds  |\n| Apprentice                         | 7.55 pounds  |\n\nThe apprentice rate applies to apprentices aged under 19, or those aged 19 and over who are in the first year of their apprenticeship. All other apprentices are entitled to the rate for their age group.\n\n</div>\n\n<div class=\"section\">\n\n## Historical rates\n\nThe table below shows rates for previous years. These are provided for reference when checking past pay compliance.\n\n| Year       | 21 and over  | 18 to 20    | Under 18    | Apprentice  |\n|------------|--------------|-------------|-------------|-------------|\n| April 2024 | 11.44 pounds | 8.60 pounds | 6.40 pounds | 6.40 pounds |\n| April 2023 | 10.42 pounds | 7.49 pounds | 5.28 pounds | 5.28 pounds |\n| April 2022 | 9.50 pounds  | 6.83 pounds | 4.81 pounds | 4.81 pounds |\n\n</div>\n\n<div class=\"section\">\n\n## Who is entitled to the minimum wage\n\nMost workers in the UK are entitled to be paid at least the National Minimum Wage or National Living Wage. This includes part-time workers, agency workers, workers on zero-hours contracts, and foreign workers legally entitled to work in the UK. Some categories of worker are exempt, including volunteers, members of the armed forces, share fishermen, and prisoners. Self-employed individuals are not entitled to the minimum wage, but employers must ensure that individuals they treat as self-employed genuinely meet the legal definition of self-employment.\n\n</div>\n\n<div class=\"section\">\n\n## Common errors in calculating minimum wage pay\n\n\\[DEPT-D\\] regularly investigates employers who underpay their workers. The following are the most frequently identified errors.\n\n1.  **Deducting costs for uniforms or equipment.** If you require workers to purchase a uniform or specific tools, and those deductions bring their effective hourly pay below the minimum wage, you are in breach of the law. The deduction itself may be lawful, but the resulting pay must still meet the minimum rate.\n2.  **Not paying for all working time.** Time spent travelling between assignments, mandatory training, time spent opening or closing premises, and time when a worker is required to be on the employer's premises and available for work all count as working time. Failing to pay for these hours is one of the most common sources of underpayment.\n3.  **Applying the wrong age band.** A worker's rate must increase on their birthday when they move into a higher age band. Employers must have processes to ensure rate changes are applied from the correct pay reference period.\n4.  **Averaging pay incorrectly over the pay reference period.** The minimum wage is assessed per pay reference period, which is normally no longer than one month. Averaging a worker's pay over a longer period to mask short-term underpayment is not permitted.\n5.  **Misclassifying salaried workers.** Salaried workers on an annual salary can be paid the minimum wage differently from hourly-paid workers, but only if their contract meets specific conditions. If it does not, each pay reference period must be assessed individually.\n\n</div>\n\n<div class=\"section\">\n\n## Enforcement and penalties\n\n\\[DEPT-D\\] enforces minimum wage legislation. If you are found to have underpaid workers, you will be required to pay all arrears owed and may face a financial penalty of up to 200 percent of the total underpayment, up to a maximum of 20,000 pounds per worker. Employers who repeatedly or deliberately fail to pay the minimum wage may also be publicly named by the government, prosecuted, and disqualified from acting as a company director for up to 15 years.\n\n</div>\n\n<div class=\"section\">\n\n## Related guidance\n\n- [Starting a Business in the UK: Step by Step (DOC-SB-001)](doc-sb-001-starting-a-business-in-the-uk-step-by-step.md)\n- [Employment Rights Act 1996: Plain-English Summary (DOC-SB-005)](doc-sb-005-employment-rights-act-1996-plain-english-summary.md)\n\n</div>\n\n## Raw Metadata\n\n| Field | Value |\n| --- | --- |\n| audience | Employers |\n| author | [Government Department B] |\n| description | Current National Minimum Wage and National Living Wage rates, employer obligations, and common errors in calculating pay. |\n| document-id | DOC-SB-003 |\n| document-type | guidance |\n| exif_Audience | Employers |\n| exif_Author | [Government Department B] |\n| exif_Description | Current National Minimum Wage and National Living Wage rates, employer obligations, and common errors in calculating pay. |\n| exif_DocumentId | DOC-SB-003 |\n| exif_DocumentType | guidance |\n| exif_ExifToolVersion | 13.55 |\n| exif_FileModifyDate | 2026:04:16 16:01:34+01:00 |\n| exif_FileName | DOC-SB-003-national-minimum-wage.html |\n| exif_FilePermissions | -rw-r--r-- |\n| exif_FileSize | 8.1 kB |\n| exif_FileType | HTML |\n| exif_FileTypeExtension | html |\n| exif_LastUpdated | 2025-04-01 |\n| exif_MIMEType | text/html |\n| exif_PublicationDate | 2025-04-01 |\n| exif_Status | current |\n| exif_Title | National Minimum Wage and National Living Wage: Employer Guidance |\n| exif_Topics | employment, wages, national minimum wage, national living wage |\n| exif_Viewport | width=device-width, initial-scale=1.0 |\n| last-updated | 2025-04-01 |\n| publication-date | 2025-04-01 |\n| status | current |\n| title | National Minimum Wage and National Living Wage: Employer Guidance |\n| topics | employment, wages, national minimum wage, national living wage |\n| viewport | width=device-width, initial-scale=1.0 |\n\n## Related Notes\n\n- [Knowledge base index](../index.md)\n- [Lint report](../lint-report.md)"},"sources/doc-sb-004-workplace-pensions-auto-enrolment-duties-for-employers.md":{"id":"sources/doc-sb-004-workplace-pensions-auto-enrolment-duties-for-employers.md","type":"Source","title":"WORKPLACE PENSIONS: AUTO-ENROLMENT DUTIES FOR EMPLOYERS","description":"Source note for DOC-SB-004: WORKPLACE PENSIONS: AUTO-ENROLMENT DUTIES FOR EMPLOYERS.","timestamp":"2025-11-20","aliases":"DOC-SB-004;WORKPLACE PENSIONS: AUTO-ENROLMENT DUTIES FOR EMPLOYERS;DOC-SB-004-workplace-pensions","section":"sources","source":"challenge-2/wiki/sources/doc-sb-004-workplace-pensions-auto-enrolment-duties-for-employers.md","body":"# WORKPLACE PENSIONS: AUTO-ENROLMENT DUTIES FOR EMPLOYERS\n## Summary\n\n- Source: [DOC-SB-004-workplace-pensions.txt](../../structured_files/DOC-SB-004-workplace-pensions.txt)\n- Extraction: `plain-text-regex` with `medium` quality.\n- Extract: WORKPLACE PENSIONS: AUTO-ENROLMENT DUTIES FOR EMPLOYERS ======================================================== Document Reference: DOC-SB-004 Status: Current Published: 2025-06-15 Last Updated: 2025-11-20 ------------------------------------------------------------------------ 1. INTRODUCTION 1.1 Overview of auto-enrolment All employers in the United Kingdom are required by law to enrol eligible workers into a qualifying workplace pension scheme and make contributions to that scheme. This duty applies regardless of the size of the employer. The obligations were introduced under the Pensions Act 2008 and have been phased in since 2012...\n\n## Metadata\n\n| Field | Value |\n| --- | --- |\n| Source ID | DOC-SB-004 |\n| Title | WORKPLACE PENSIONS: AUTO-ENROLMENT DUTIES FOR EMPLOYERS |\n| Raw source | [DOC-SB-004-workplace-pensions.txt](../../structured_files/DOC-SB-004-workplace-pensions.txt) |\n| Format | txt |\n| Document type | guidance |\n| Department |  |\n| Owner |  |\n| Status | current |\n| Version |  |\n| Publication date | 2025-06-15 |\n| Last updated | 2025-11-20 |\n| Audience |  |\n| Topics | small-business-and-self-employment, employment-rights-and-flexible-working, incident-risk-and-assurance |\n| Data origin | Challenge 2 corpus data is synthetic hackathon fixture data. |\n| Contains real personal data | false |\n| Contains synthetic identifiers | false |\n| SHA-256 | 6e9adca52428130373b4b74747cb05af06b88e8f0ff20c77dfa03969c8111664 |\n\n## Related Sources\n\n- [DOC-SB-001](doc-sb-001-starting-a-business-in-the-uk-step-by-step.md) - Starting a Business in the UK: Step by Step\n- [DOC-SB-003](doc-sb-003-national-minimum-wage-and-national-living-wage-employer.md) - National Minimum Wage and National Living Wage: Employer Guidance\n\n## Navigation\n\n- Topic: [Small Business And Self-employment](../topics/small-business-and-self-employment.md)\n- Topic: [Employment Rights And Flexible Working](../topics/employment-rights-and-flexible-working.md)\n- Topic: [Incident Risk And Assurance](../topics/incident-risk-and-assurance.md)\n\n## Extracted Content\n\nWORKPLACE PENSIONS: AUTO-ENROLMENT DUTIES FOR EMPLOYERS\n========================================================\nDocument Reference: DOC-SB-004\nStatus: Current\nPublished: 2025-06-15\nLast Updated: 2025-11-20\n\n------------------------------------------------------------------------\n\n1. INTRODUCTION\n\n1.1 Overview of auto-enrolment\n\n    All employers in the United Kingdom are required by law to enrol\n    eligible workers into a qualifying workplace pension scheme and\n    make contributions to that scheme. This duty applies regardless of\n    the size of the employer. The obligations were introduced under the\n    Pensions Act 2008 and have been phased in since 2012 through a\n    series of staging dates allocated to employers based on the size of\n    their PAYE scheme.\n\n1.2 Who this guidance is for\n\n    This guidance is intended for employers, payroll administrators,\n    and business advisers. It explains the legal duties, the process\n    for enrolling workers, the minimum contribution rates, opt-out\n    procedures, and the consequences of non-compliance.\n\n------------------------------------------------------------------------\n\n2. EMPLOYER DUTIES\n\n2.1 Assessing your workforce\n\n    2.1.1 Categories of worker\n\n        You must assess each person who works for you on the first day\n        of their employment and on every subsequent pay reference period.\n        Workers fall into one of three categories:\n\n        2.1.1.1 Eligible jobholders\n\n            Workers aged between 22 and State Pension age who earn more\n            than 10,000 pounds per year (or the equivalent pro-rated\n            amount per pay period). You must automatically enrol these\n            workers into your pension scheme.\n\n        2.1.1.2 Non-eligible jobholders\n\n            Workers aged between 16 and 74 who earn more than the lower\n            earnings threshold of 6,240 pounds per year but do not meet\n            the full criteria for eligible jobholders (for example,\n            workers aged 16 to 21 or those earning between 6,240 and\n            10,000 pounds). These workers have the right to opt in.\n\n        2.1.1.3 Entitled workers\n\n            Workers aged between 16 and 74 who earn below 6,240 pounds\n            per year. These workers have the right to join a pension\n            scheme, but you are not required to make employer\n            contributions for them.\n\n    2.1.2 Postponement\n\n        You may choose to postpone automatic enrolment for up to three\n        months from either your staging date or the date a new employee\n        joins. You must issue a postponement notice to the worker within\n        six weeks of the start of the postponement period.\n\n2.2 Choosing a pension scheme\n\n    2.2.1 Qualifying schemes\n\n        The pension scheme you use must meet certain criteria. For a\n        defined contribution scheme, total contributions must be at\n        least the statutory minimum percentage of qualifying earnings.\n        For a defined benefit scheme, the scheme must provide benefits\n        that meet or exceed the test scheme standard.\n\n    2.2.2 NEST as a default option\n\n        If you do not have an existing pension scheme, you can use the\n        National Employment Savings Trust (NEST), which was set up by\n        the government to ensure all employers have access to a low-cost\n        qualifying scheme. There is no charge to the employer for using\n        NEST, though the scheme applies a contribution charge to members.\n\n------------------------------------------------------------------------\n\n3. CONTRIBUTION RATES\n\n3.1 Minimum contribution rates\n\n    The minimum contributions for defined contribution schemes are\n    calculated as a percentage of qualifying earnings. Qualifying\n    earnings are the portion of a worker's pay between the lower\n    earnings threshold and the upper earnings threshold (currently\n    6,240 pounds and 50,270 pounds respectively).\n\n    Date Range          | Employer Min | Employee Min | Total Min\n    --------------------|--------------|--------------|----------\n    Before Apr 2018     | 1%           | 1%           | 2%\n    Apr 2018 - Mar 2019 | 2%           | 3%           | 5%\n    Apr 2019 onwards    | 3%           | 5%           | 8%\n\n3.2 Certification\n\n    Employers who wish to use an alternative definition of pensionable\n    pay (for example, basic pay rather than qualifying earnings) may\n    do so provided they self-certify that total contributions across\n    their workforce will meet or exceed the statutory minimum. This\n    certification must be reviewed and re-issued every 18 months.\n\n------------------------------------------------------------------------\n\n4. OPT-OUT PROCEDURES\n\n4.1 Worker's right to opt out\n\n    4.1.1 Opt-out window\n\n        A worker who has been automatically enrolled may choose to opt\n        out within one calendar month of the date they were enrolled\n        (or the date they received their enrolment information, if\n        later). If a worker opts out within this window, any\n        contributions already deducted must be refunded in full.\n\n    4.1.2 Ceasing active membership after the opt-out window\n\n        After the one-month opt-out window has closed, a worker may\n        still choose to cease active membership of the scheme. However,\n        contributions already paid will not be refunded and will remain\n        in the pension pot.\n\n4.2 Re-enrolment\n\n    4.2.1 Cyclical re-enrolment\n\n        Approximately every three years from your staging date, you must\n        re-enrol any eligible jobholders who previously opted out or\n        ceased active membership. This is known as cyclical re-enrolment.\n        You have a six-month window around your re-enrolment date to\n        complete this process.\n\n    4.2.2 Inducement prohibition\n\n        You must not induce, coerce, or attempt to persuade a worker to\n        opt out of their pension. Doing so is a criminal offence. This\n        includes offering financial incentives to opt out, making opt-out\n        a condition of employment, or treating workers unfavourably\n        because they remain in the scheme.\n\n------------------------------------------------------------------------\n\n5. COMPLIANCE AND PENALTIES\n\n5.1 [Regulatory Body C]'s powers\n\n    [Regulatory Body C] ([REG-C]) is responsible for ensuring employers\n    comply with their auto-enrolment duties. [REG-C] has a range of\n    enforcement tools available, escalating in severity.\n\n5.2 Penalty structure\n\n    5.2.1 Compliance notice\n\n        [REG-C] may issue a compliance notice requiring you to take specific\n        actions (such as enrolling workers or paying contributions) by\n        a stated deadline.\n\n    5.2.2 Fixed penalty notice\n\n        If you do not comply with a compliance notice, [REG-C] may issue a\n        fixed penalty notice of 400 pounds.\n\n    5.2.3 Escalating penalty notice\n\n        If non-compliance continues after a fixed penalty notice, [REG-C]\n        may issue an escalating daily penalty. The daily rate depends\n        on the number of workers in your PAYE scheme:\n\n        Number of workers    | Daily penalty\n        ---------------------|-------------\n        1 to 4               | 50 pounds\n        5 to 49              | 500 pounds\n        50 to 249            | 2,500 pounds\n        250 to 499           | 5,000 pounds\n        500 or more          | 10,000 pounds\n\n    5.2.4 Criminal prosecution\n\n        In the most serious cases, particularly where an employer\n        wilfully fails to comply or induces workers to opt out, [REG-C]\n        may pursue criminal prosecution.\n\n------------------------------------------------------------------------\n\n6. RECORD-KEEPING\n\n    You must keep records of your auto-enrolment activities for six\n    years. This includes the names and addresses of enrolled workers,\n    the dates of enrolment and any opt-outs, contribution amounts paid,\n    and the pension scheme reference numbers. Failure to keep adequate\n    records may itself result in a compliance notice from [REG-C].\n\n------------------------------------------------------------------------\n\nCROSS-REFERENCES\n\n    - Starting a Business in the UK: Step by Step ([DOC-SB-001](doc-sb-001-starting-a-business-in-the-uk-step-by-step.md))\n    - National Minimum Wage and National Living Wage ([DOC-SB-003](doc-sb-003-national-minimum-wage-and-national-living-wage-employer.md))\n\n------------------------------------------------------------------------\n\nPublished by: [Regulatory Body C]\n\n## Raw Metadata\n\n| Field | Value |\n| --- | --- |\n| document_id | DOC-SB-004 |\n| exif_ExifToolVersion | 13.55 |\n| exif_FileModifyDate | 2026:04:16 16:01:34+01:00 |\n| exif_FileName | DOC-SB-004-workplace-pensions.txt |\n| exif_FilePermissions | -rw-r--r-- |\n| exif_FileSize | 8.4 kB |\n| exif_FileType | TXT |\n| exif_FileTypeExtension | txt |\n| exif_LineCount | 215 |\n| exif_MIMEEncoding | us-ascii |\n| exif_MIMEType | text/plain |\n| exif_Newlines | Unix LF |\n| exif_WordCount | 1065 |\n| last_updated | 2025-11-20 |\n| published | 2025-06-15 |\n| status | Current |\n\n## Related Notes\n\n- [Knowledge base index](../index.md)\n- [Lint report](../lint-report.md)"},"sources/doc-sb-005-employment-rights-act-1996-plain-english-summary.md":{"id":"sources/doc-sb-005-employment-rights-act-1996-plain-english-summary.md","type":"Source","title":"Employment Rights Act 1996: Plain-English Summary","description":"Source note for DOC-SB-005: Employment Rights Act 1996: Plain-English Summary.","timestamp":"2025-08-01","aliases":"DOC-SB-005;Employment Rights Act 1996: Plain-English Summary;DOC-SB-005-employment-rights-era-1996","section":"sources","source":"challenge-2/wiki/sources/doc-sb-005-employment-rights-act-1996-plain-english-summary.md","body":"# Employment Rights Act 1996: Plain-English Summary\n## Summary\n\n- Source: [DOC-SB-005-employment-rights-era-1996.md](../../structured_files/DOC-SB-005-employment-rights-era-1996.md)\n- Extraction: `markdown-frontmatter` with `high` quality.\n- Extract: Employment Rights Act 1996: Plain-English Summary This document provides a plain-English summary of the key provisions of the Employment Rights Act
