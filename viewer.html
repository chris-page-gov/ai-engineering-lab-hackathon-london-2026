 under Universal Credit. This guidance remains relevant for legacy Social Fund claims but should not be used for UC Budgeting Advance decisions — see the UC Decision Making Guide for that. 12.1 Introduction Budgeting Loans are interest-free loans available to people who have been receiving a qualifying benefit for at least 26 weeks. They are intended to help with intermittent expenses that are difficult to budget for. 12.2 Qualifying benefits The...\n\n## Metadata\n\n| Field | Value |\n| --- | --- |\n| Source ID | UF-SOCIAL-FUND-BUDGETING-LOANS-GUIDANCE-CHAPTER12 |\n| Title | Social Fund Guide Chapter 12: Budgeting Loans |\n| Raw source | [social_fund_budgeting_loans_guidance_chapter12.pdf](../../unstructured_files/social_fund_budgeting_loans_guidance_chapter12.pdf) |\n| Format | pdf |\n| Document type | guidance |\n| Department |  |\n| Owner |  |\n| Status | unknown |\n| Version | March 2018 |\n| Publication date |  |\n| Last updated |  |\n| Audience |  |\n| Topics | people-policies |\n| Data origin | Challenge 2 corpus data is synthetic hackathon fixture data. |\n| Contains real personal data | false |\n| Contains synthetic identifiers | false |\n| SHA-256 | de6a2d4b7a2f6d47536507d7ad90d2511610c81f11c5122fa7967af5e12dd1d1 |\n\n## Navigation\n\n- Topic: [People Policies](../topics/people-policies.md)\n\n## Extracted Tables\n\n### Table 1\n\n| Claimant type | Maximum |\n| --- | --- |\n| Single claimant | £348 |\n| Couple without children | £464 |\n| Claimant or couple with children | £812 |\n\n## Extracted Content\n\nOFFICIAL\n\n\n      Social Fund Guide Chapter 12: Budgeting Loans\nVersion: March 2018\n      NOTE: This chapter covers Budgeting Loans under the Social Fund. Budgeting Loans are being\n      replaced by Budgeting Advances under Universal Credit. This guidance remains relevant for legacy\n      Social Fund claims but should not be used for UC Budgeting Advance decisions — see the UC Decision\n      Making Guide for that.\n\n\n\n12.1 Introduction\n\nBudgeting Loans are interest-free loans available to people who have been receiving a qualifying benefit\nfor at least 26 weeks. They are intended to help with intermittent expenses that are difficult to budget for.\n\n\n\n12.2 Qualifying benefits\n\nThe applicant (or their partner) must have been in receipt of one or more of:\n\n      • Income Support\n\n      • income-based Jobseeker’s Allowance\n\n      • income-related Employment and Support Allowance\n\n      • Pension Credit\n\nfor a continuous period of at least 26 weeks at the date of application.\n\n\n\n12.3 What Budgeting Loans can be used for\n\nLoans may be awarded for:\n\n      • Furniture and household equipment\n\n      • Clothing and footwear\n\n      • Rent in advance or removal expenses\n\n      • Improvement, maintenance or security of the home\n\n      • Travelling expenses\n\n      • Expenses associated with seeking or starting work\n\n      • Maternity expenses\n\n      • Funeral expenses\n\n      • HP or other debts for any of the above items\n\f12.4 Minimum and maximum amounts\n\nMinimum loan: £100\n\nMaximum loan:\n\n                Claimant type                                     Maximum\n\n                Single claimant                                   £348\n\n                Couple without children                           £464\n\n                Claimant or couple with children                  £812\n\n      [WARNING: These are the 2018 rates. They have NOT been uprated since 2018 and remain the same.\n      However, always check the latest rates circular before making a decision.]\n\n\n\n12.5 Factors affecting the loan amount\n\nThe amount awarded depends on:\n\n      (a) The amount applied for\n\n      (b) Whether the need can be met from other sources\n\n      (c) Any outstanding Social Fund debt\n\n      (d) The applicant’s ability to repay\n\nOutstanding Social Fund debt is deducted from the maximum. For example, if a single claimant has an\noutstanding Budgeting Loan of £100, the maximum available is £348 - £100 = £248.\n\n\n\n12.6 Repayment\n\nRepayment is by deduction from the qualifying benefit. The standard deduction rate is 12% of the\napplicable amount (personal allowance plus premiums). A lower rate of 5% may be applied where\nhardship would result.\n\nRepayment period: up to 104 weeks.\n\n\n\n12.7 Refusal\n\nA Budgeting Loan application must be refused if:\n\n      • The applicant has not been on a qualifying benefit for 26 weeks\n\n      • Outstanding Social Fund debt equals or exceeds the maximum\n\n      • The amount requested is below £100\n\n      • The loan would take total Social Fund debt above the maximum\n\f12.8 Reviews\n\nDecisions on Budgeting Loans can be reviewed by a Social Fund Inspector. The applicant must request a\nreview within 28 days of the decision.\n\n      [End of Chapter 12. For Chapter 13 (Crisis Loans — now abolished), see archived guidance.]\n\n## Raw Metadata\n\n| Field | Value |\n| --- | --- |\n| Author | (anonymous) |\n| CreationDate | Tue Apr 14 09:58:50 2026 BST |\n| Creator | (unspecified) |\n| Custom Metadata | no |\n| Encrypted | no |\n| File size | 5745 bytes |\n| Form | none |\n| JavaScript | no |\n| Keywords |  |\n| Metadata Stream | no |\n| ModDate | Tue Apr 14 09:58:50 2026 BST |\n| Optimized | no |\n| PDF version | 1.4 |\n| Page rot | 0 |\n| Page size | 595.276 x 841.89 pts (A4) |\n| Pages | 3 |\n| Producer | ReportLab PDF Library - (opensource) |\n| Subject | (unspecified) |\n| Suspects | no |\n| Tagged | no |\n| Title | (anonymous) |\n| UserProperties | no |\n| exif_Author | (anonymous) |\n| exif_CreateDate | 2026:04:14 08:58:50+00:00 |\n| exif_Creator | (unspecified) |\n| exif_ExifToolVersion | 13.55 |\n| exif_FileModifyDate | 2026:04:16 03:32:22+01:00 |\n| exif_FileName | social_fund_budgeting_loans_guidance_chapter12.pdf |\n| exif_FilePermissions | -rw-r--r-- |\n| exif_FileSize | 5.7 kB |\n| exif_FileType | PDF |\n| exif_FileTypeExtension | pdf |\n| exif_Linearized | No |\n| exif_MIMEType | application/pdf |\n| exif_ModifyDate | 2026:04:14 08:58:50+00:00 |\n| exif_PDFVersion | 1.4 |\n| exif_PageCount | 3 |\n| exif_PageMode | UseNone |\n| exif_Producer | ReportLab PDF Library - (opensource) |\n| exif_Subject | (unspecified) |\n| exif_Title | (anonymous) |\n| exif_Trapped | False |\n| version | March 2018 |\n\n## Related Notes\n\n- [Knowledge base index](../index.md)\n- [Lint report](../lint-report.md)"},"sources/uf-social-media-guidance-for-staff-social-media-guidance-for-staff.md":{"id":"sources/uf-social-media-guidance-for-staff-social-media-guidance-for-staff.md","type":"Source","title":"Social Media Guidance for Staff","description":"Source note for UF-SOCIAL-MEDIA-GUIDANCE-FOR-STAFF: Social Media Guidance for Staff.","timestamp":"2026-06-27","aliases":"UF-SOCIAL-MEDIA-GUIDANCE-FOR-STAFF;Social Media Guidance for Staff","section":"sources","source":"challenge-2/wiki/sources/uf-social-media-guidance-for-staff-social-media-guidance-for-staff.md","body":"# Social Media Guidance for Staff\n## Summary\n\n- Source: [SOCIAL MEDIA GUIDANCE FOR STAFF.docx](../../unstructured_files/SOCIAL%20MEDIA%20GUIDANCE%20FOR%20STAFF.docx)\n- Extraction: `pandoc-docx` with `high` quality.\n- Extract: Social Media Guidance for Staff \\[Government Department C\\] \\ September 2021 Owner: Internal Communications Team About this guidance This guidance helps \\[DEPT-C\\] employees understand how to use social media responsibly, both in their professional and personal capacities. It supplements the Acceptable Use Policy for IT Systems. 1\\. Official \\[DEPT-C\\] social media accounts The department maintains official accounts on the following platforms: - Twitter: @\\[DeptGovUK\\] - LinkedIn: \\[Government Department C\\] - Facebook: \\[DEPT-C\\] - YouTube: \\[DEPT-C\\] Digital Only authorised staff in the Communications Directorate may post on behalf of...\n\n## Metadata\n\n| Field | Value |\n| --- | --- |\n| Source ID | UF-SOCIAL-MEDIA-GUIDANCE-FOR-STAFF |\n| Title | Social Media Guidance for Staff |\n| Raw source | [SOCIAL MEDIA GUIDANCE FOR STAFF.docx](../../unstructured_files/SOCIAL%20MEDIA%20GUIDANCE%20FOR%20STAFF.docx) |\n| Format | docx |\n| Document type | policy |\n| Department |  |\n| Owner | Internal Communications Team |\n| Status | unknown |\n| Version |  |\n| Publication date |  |\n| Last updated |  |\n| Audience |  |\n| Topics | data-protection-and-information-security |\n| Data origin | Challenge 2 corpus data is synthetic hackathon fixture data. |\n| Contains real personal data | false |\n| Contains synthetic identifiers | false |\n| SHA-256 | 408286c80155ae71ef98b652e886617b972c528cf9c227e43dcb19eabb4e1abd |\n\n## Navigation\n\n- Topic: [Data Protection And Information Security](../topics/data-protection-and-information-security.md)\n\n## Extracted Content\n\n**Social Media Guidance for Staff**\n\n\\[Government Department C\\] \\| September 2021\n\nOwner: Internal Communications Team\n\nAbout this guidance\n\nThis guidance helps \\[DEPT-C\\] employees understand how to use social media responsibly, both in their professional and personal capacities. It supplements the Acceptable Use Policy for IT Systems.\n\n1\\. Official \\[DEPT-C\\] social media accounts\n\nThe department maintains official accounts on the following platforms:\n\n- Twitter: @\\[DeptGovUK\\]\n\n- LinkedIn: \\[Government Department C\\]\n\n- Facebook: \\[DEPT-C\\]\n\n- YouTube: \\[DEPT-C\\] Digital\n\nOnly authorised staff in the Communications Directorate may post on behalf of \\[DEPT-C\\]. Requests to create new departmental social media accounts must be approved by the Head of Digital Communications.\n\n2\\. Personal use of social media\n\n2.1 General principles\n\nYou are free to use social media in your personal time. However, as a civil servant you must be mindful of the Civil Service Code and the department’s values.\n\n2.2 Do\n\n- Be respectful and professional, even in personal posts\n\n- Think before you post — could this be misinterpreted?\n\n- Use privacy settings to control who can see your content\n\n- Report any harassment or threats to your line manager\n\n2.3 Don’t\n\n- Share confidential or OFFICIAL-SENSITIVE information\n\n- Post about individual cases, claimants, or colleagues\n\n- Comment on government policy in a way that could compromise your impartiality\n\n- Use your \\[DEPT-C\\] email address to register for personal social media accounts\n\n- Engage with media enquiries on social media — refer these to the Press Office\n\n3\\. Political activity on social media\n\nCivil servants must observe restrictions on political activity. The rules depend on your grade:\n\n|  |  |  |\n|----|----|----|\n| **Category** | **Grades** | **Restrictions** |\n| Politically free | AA, AO | May engage in most political activities with permission |\n| Politically restricted | Grade 7 and above | Must not engage in national political activities; limited local political activity with permission |\n| Intermediate | EO, HEO, SEO | May engage in some political activities with permission |\n\nIf in doubt, seek advice from your HR Business Partner before posting political content.\n\n4\\. What to do if something goes wrong\n\n- If you accidentally post something you shouldn’t have: delete it immediately and report it to your line manager\n\n- If you see \\[DEPT-C\\] information shared inappropriately on social media: report it to the Security Operations Centre (soc@\\[department\\].gov.uk)\n\n- If you are approached by a journalist via social media: do not respond; forward the approach to the \\[DEPT-C\\] Press Office\n\n5\\. Social media during working hours\n\nAccess to social media platforms is restricted on the \\[DEPT-C\\] network (see Acceptable Use Policy, section 6). Staff with an approved business need may request access through the IT Service Desk.\n\nPersonal social media use on personal devices during breaks is permitted, provided it does not breach this guidance.\n\n6\\. Useful contacts\n\nDigital Communications Team: digital.comms@\\[department\\].gov.uk\n\nPress Office: press.office@\\[department\\].gov.uk\n\nSecurity Operations Centre: soc@\\[department\\].gov.uk\n\nThis guidance was last updated in September 2021. Social media platforms and their features change frequently. If you encounter a situation not covered by this guidance, contact the Digital Communications team.\n\n> *\\[NOTE: This guidance predates the rebranding of Twitter to X (October 2023). References to ‘Twitter’ throughout should be read as ‘X’. The department’s handle on X remains @\\[DeptGovUK\\].\\]*\n\n## Raw Metadata\n\n| Field | Value |\n| --- | --- |\n| created | 2026-04-14T09:02:53.842Z |\n| creator | Un-named |\n| exif_CreateDate | 2026:04:14 09:02:53.842Z |\n| exif_Creator | Un-named |\n| exif_ExifToolVersion | 13.55 |\n| exif_FileModifyDate | 2026:04:16 16:01:34+01:00 |\n| exif_FileName | SOCIAL MEDIA GUIDANCE FOR STAFF.docx |\n| exif_FilePermissions | -rw-r--r-- |\n| exif_FileSize | 11 kB |\n| exif_FileType | DOCX |\n| exif_FileTypeExtension | docx |\n| exif_LastModifiedBy | Un-named |\n| exif_MIMEType | application/vnd.openxmlformats-officedocument.wordprocessingml.document |\n| exif_ModifyDate | 2026:04:14 09:02:53.842Z |\n| exif_RevisionNumber | 1 |\n| exif_ZipBitFlag | 0 |\n| exif_ZipCRC | 0x00000000 |\n| exif_ZipCompressedSize | 0 |\n| exif_ZipCompression | None |\n| exif_ZipFileName | word/ |\n| exif_ZipModifyDate | 2026:04:14 09:02:52 |\n| exif_ZipRequiredVersion | 10 |\n| exif_ZipUncompressedSize | 0 |\n| lastModifiedBy | Un-named |\n| modified | 2026-04-14T09:02:53.842Z |\n| owner | Internal Communications Team |\n| revision | 1 |\n\n## Related Notes\n\n- [Knowledge base index](../index.md)\n- [Lint report](../lint-report.md)"},"sources/uf-spending-controls-guidance-dept-c.md":{"id":"sources/uf-spending-controls-guidance-dept-c.md","type":"Source","title":"[DEPT-C]","description":"Source note for UF-SPENDING-CONTROLS-GUIDANCE: [DEPT-C].","timestamp":"2026-06-27","aliase isk-and-assurance.md)\n- Entity: [Finance Directorate](../entities/finance-directorate.md)\n\n## Extracted Tables\n\n### Table 1\n\n| Category | Threshold | Approval required |\n| --- | --- | --- |\n| IT hardware | Over £5,000 | IT Asset Board |\n| Training | Over £500 per person | L&D Team approval |\n| External recruitment | All | Workforce Planning Team |\n| Consultancy | All | Commercial Directorate + DD approval |\n| Travel (international) | All | Director approval |\n| Conferences and events | Over £2,500 | Communications approval |\n| Gifts and hospitality | All (given or received) | Must be registered |\n\n## Extracted Links\n\n| Label | URL | Note |\n| --- | --- | --- |\n| HMT Green Book | [https://www.gov.uk/government/publications/the-green-book-appraisal-and-evaluation-in-central-government](https://www.gov.uk/government/publications/the-green-book-appraisal-and-evaluation-in-central-government) | Corrected from extracted PDF line break/typo; raw extracted text is preserved below. |\n\n## Extracted Content\n\nOFFICIAL\n\n                     [DEPT-C]\n                                Spending Controls Guidance\nFinance Directorate | November 2023\n                                                                                  [DEPT-C]\nThis guidance explains the spending controls that apply to all                               expenditure. It should be read\nalongside the departmental financial delegations framework.\n\n\n\n1. [Central Government Body] spending controls\n                                            [Central Government Body]\nCertain categories of expenditure require                               approval regardless of value. These are:\n\n      • Advertising, marketing, and communications\n\n      • Strategic supplier contracts (above £10m total value)\n\n      • Consultancy\n\n      • Redundancy and compensation (above scheme terms)\n\n      • Property (new leases or lease extensions)\n\n      • Digital and technology (above £1m or using novel technology)\n\n      • Commercial models (PFI, concessions, joint ventures)\n\n      • Grants to external bodies\n\n\n\n2. Internal spending controls\n\nThe Department applies additional internal controls:\n\n      Category                      Threshold                                  Approval required\n\n      IT hardware                   Over £5,000                                IT Asset Board\n\n      Training                      Over £500 per person                       L&D Team approval\n\n      External recruitment          All                                        Workforce Planning Team\n\n      Consultancy                   All                                        Commercial Directorate + DD approval\n\n      Travel (international)        All                                        Director approval\n\n      Conferences and events        Over £2,500                                Communications approval\n\n      Gifts and hospitality         All (given or received)                    Must be registered\n\n\n\n\n3. Business cases\n\nA business case is required for all expenditure over £25,000. The format depends on value:\n\f£25,000 - £100,000: Summary business case (1-2 pages)\n\n£100,000 - £1,000,000: Standard business case (HMT Green Book 5-case model)\n\nOver £1,000,000: Full business case with options analysis\n\n\n\n4. Exceptions\n\nIn genuinely urgent situations where obtaining approval would cause unacceptable delay, a retrospective\napproval may be sought. This must be done within 5 working days and requires Director approval.\n\nRetrospective approvals are reported to the Audit and Risk Committee quarterly.\n\n\n\n5. Further information\n\nFinance Business Partners: Contact your directorate’s Finance Business Partner.\n                                                   [DEPT-C\nSpending Controls Mailbox: spending.controls@]               .gov.uk\n\nHMT Green Book: https://www.gov.uk/government/publications/the-green-book-appraisal-and-evaluation-i\nn-central-governent\n\n      [Note: URL above contains a typo in the original document — 'governent' should be 'government']\n\n## Raw Metadata\n\n| Field | Value |\n| --- | --- |\n| Author | (anonymous) |\n| CreationDate | Tue Apr 14 09:58:50 2026 BST |\n| Creator | (unspecified) |\n| Custom Metadata | no |\n| Encrypted | no |\n| File size | 4646 bytes |\n| Form | none |\n| JavaScript | no |\n| Keywords |  |\n| Metadata Stream | no |\n| ModDate | Tue Apr 14 09:58:50 2026 BST |\n| Optimized | no |\n| PDF version | 1.4 |\n| Page rot | 0 |\n| Page size | 595.276 x 841.89 pts (A4) |\n| Pages | 2 |\n| Producer | ReportLab PDF Library - (opensource) |\n| Subject | (unspecified) |\n| Suspects | no |\n| Tagged | no |\n| Title | (anonymous) |\n| UserProperties | no |\n| exif_Author | (anonymous) |\n| exif_CreateDate | 2026:04:14 08:58:50+00:00 |\n| exif_Creator | (unspecified) |\n| exif_ExifToolVersion | 13.55 |\n| exif_FileModifyDate | 2026:04:16 16:01:34+01:00 |\n| exif_FileName | Spending_Controls_Guidance.pdf |\n| exif_FilePermissions | -rw-r--r-- |\n| exif_FileSize | 4.6 kB |\n| exif_FileType | PDF |\n| exif_FileTypeExtension | pdf |\n| exif_Linearized | No |\n| exif_MIMEType | application/pdf |\n| exif_ModifyDate | 2026:04:14 08:58:50+00:00 |\n| exif_PDFVersion | 1.4 |\n| exif_PageCount | 2 |\n| exif_PageMode | UseNone |\n| exif_Producer | ReportLab PDF Library - (opensource) |\n| exif_Subject | (unspecified) |\n| exif_Title | (anonymous) |\n| exif_Trapped | False |\n\n## Related Notes\n\n- [Knowledge base index](../index.md)\n- [Lint report](../lint-report.md)"},"sources/uf-staff-directory-extract-q4-2023-staff-directory-extract-q4-2023.md":{"id":"sources/uf-staff-directory-extract-q4-2023-staff-directory-extract-q4-2023.md","type":"Source","title":"Staff Directory Extract Q4 2023","description":"Source note for UF-STAFF-DIRECTORY-EXTRACT-Q4-2023: Staff Directory Extract Q4 2023.","timestamp":"2026-06-27","aliases":"UF-STAFF-DIRECTORY-EXTRACT-Q4-2023 policy when travelling on official business.\n\n2\\. Travel\n\n2.1 Rail\n\nStandard class is the default. First class may be used where the journey is over 3 hours and the traveller needs to work during the journey.\n\n2.2 Air\n\nFlights within the UK mainland are not normally approved. Economy class for all international travel.\n\n2.3 Car\n\nMileage rates:\n\n|             |                                             |\n|-------------|---------------------------------------------|\n| **Vehicle** | **Rate**                                    |\n| Car         | 45p per mile (first 10,000), 25p thereafter |\n| Motorcycle  | 24p per mile                                |\n\n3\\. Subsistence Rates\n\n|                  |                      |\n|------------------|----------------------|\n| **Item**         | **Amount**           |\n| Breakfast        | £4.50                |\n| Lunch            | £4.50                |\n| Evening meal     | £12.50               |\n| London overnight | up to £120 per night |\n| Elsewhere        | up to £75 per night  |\n\n4\\. Claims\n\nClaims must be submitted within 2 months. Receipts required for items over £10.\n\n5\\. Approvals\n\nAll claims approved by line manager.\n\nNext review: April 2022\n\n## Raw Metadata\n\n| Field | Value |\n| --- | --- |\n| created | 2026-04-14T09:02:53.439Z |\n| creator | Un-named |\n| exif_CreateDate | 2026:04:14 09:02:53.439Z |\n| exif_Creator | Un-named |\n| exif_ExifToolVersion | 13.55 |\n| exif_FileModifyDate | 2026:04:16 16:01:34+01:00 |\n| exif_FileName | travel-and-subsistence-policy-v2.0.docx |\n| exif_FilePermissions | -rw-r--r-- |\n| exif_FileSize | 9.8 kB |\n| exif_FileType | DOCX |\n| exif_FileTypeExtension | docx |\n| exif_LastModifiedBy | Un-named |\n| exif_MIMEType | application/vnd.openxmlformats-officedocument.wordprocessingml.document |\n| exif_ModifyDate | 2026:04:14 09:02:53.440Z |\n| exif_RevisionNumber | 1 |\n| exif_ZipBitFlag | 0 |\n| exif_ZipCRC | 0x00000000 |\n| exif_ZipCompres oner. Mae’r adroddiad hwn yn nodi cydymffurfiaeth yr Adran â Safonau’r Gymraeg yn ystod y...\n\n## Metadata\n\n| Field | Value |\n| --- | --- |\n| Source ID | UF-WELSH-LANGUAGE-STANDARDS-COMPLIANCE-REPORT-2023 |\n| Title | Adroddiad Cydymffurfiaeth Safonau’r Gymraeg |\n| Raw source | [Welsh_Language_Standards_Compliance_Report_2023.pdf](../../unstructured_files/Welsh_Language_Standards_Compliance_Report_2023.pdf) |\n| Format | pdf |\n| Document type | report |\n| Department |  |\n| Owner |  |\n| Status | unknown |\n| Version |  |\n| Publication date |  |\n| Last updated |  |\n| Audience |  |\n| Topics | incident-risk-and-assurance, welsh-language-standards |\n| Data origin | Challenge 2 corpus data is synthetic hackathon fixture data. |\n| Contains real personal data | false |\n| Contains synthetic identifiers | false |\n| SHA-256 | eac9d5e1d7428b6f41d11c88164956a77bab10da352a2d3d52e2a3626942ba1e |\n\n## Navigation\n\n- Topic: [Incident Risk And Assurance](../topics/incident-risk-and-assurance.md)\n- Topic: [Welsh Language Standards](../topics/welsh-language-standards.md)\n\n## Extracted Tables\n\n### Table 1\n\n| Standard category | Number of standards |  |  |  |\n| --- | --- | --- | --- | --- |\n| Fully compliant | Partially compliant Non-compliant |  |  |  |\n| Service delivery | 84 | 71 | 9 | 4 |\n| Policy making | 18 | 16 | 2 | 0 |\n| Operational | 34 | 30 | 3 | 1 |\n| Record keeping | 12 | 12 | 0 | 0 |\n| Total | 148 | 129 (87%) | 14 (9%) | 5 (3%) |\n\n### Table 2\n\n| Category | Amount |\n| --- | --- |\n| Translation services | £489,000 |\n| Bilingual signage and print | £67,000 |\n| Welsh language training | £31,000 |\n| Welsh language adviser salaries | £412,000 |\n| Digital service localisation | £198,000 |\n| Other | £50,000 |\n\n### Table 3\n\n| Uned y Gymraeg / Welsh Language Unit: welsh.language@] | .gov.uk |\n| --- | --- |\n| Swyddfa’r Comisiynydd y Gymraeg / Office of the Welsh Language | Commissioner: |\n\n## Extracted Content\n\nOFFICIAL\n\n\n       Adroddiad Cydymffurfiaeth Safonau’r Gymraeg\n      2022–23 Welsh Language Standards Compliance\n                     Report 2022–23\n[Adran y Llywodraeth C]                     / [GOVERNMENT DEPARTMENT C]\n\nCyhoeddwyd / Published: March 2024 | Perchennog / Owner: Welsh Language Unit\n\n\n1. Cyflwyniad / Introduction\n                          [DEPT-C]\nThis report sets out    ’s compliance with the Welsh Language Standards during the reporting period 1\nApril 2022 to 31 March 2023. It is published in accordance with the Welsh Language (Wales) Measure\n                                         [DEPT-C]\n2011 and the compliance notice issued to          by the Welsh Language Commissioner.\n\nMae’r adroddiad hwn yn nodi cydymffurfiaeth yr Adran â Safonau’r Gymraeg yn ystod y cyfnod adrodd 1\nEbrill 2022 i 31 Mawrth 2023.\n\n\n\n2. Summary of compliance\n\n       Standard category               Number of standards\n                                                         Fully compliant   Partially compliant Non-compliant\n\n       Service delivery                84                71                9                 4\n\n       Policy making                   18                16                2                 0\n\n       Operational                     34                30                3                 1\n\n       Record keeping                  12                12                0                 0\n\n       Total                           148               129 (87%)         14 (9%)           5 (3%)\n\n\n\n\n3. Areas of non-compliance\n\n3.1 Telephone services\n                            [DEPT-C]\nStandard 8 requires          to offer a Welsh language option on all telephone helplines serving Wales.\nDuring the reporting period, 4 helplines did not provide this option:\n\n       • Universal Credit helpline (Welsh callers routed to English-speaking agents)\n\n       • Disability benefits helpline\n\n       • Carer’s Allowance helpline\n\n       • Debt Management helpline\n\fRemedial action: Welsh language advisers are being recruited. Target for full compliance: September\n2023.\n\n      [NOTE: As of the date of publication (March 2024), the UC helpline and Debt Management helpline\n      remain non-compliant. The September 2023 target was missed.]\n\n\n3.2 Digital services\n\nStandard 36 requires Welsh language versions of all new and redesigned digital services serving Welsh\nusers. The following services were launched without Welsh language versions during the reporting period:\n\n      • UC journal messaging feature (launched June 2022)\n\n      • PIP online claim tracking tool (launched November 2022)\n\nBoth services now have Welsh language versions (delivered January and March 2023 respectively).\n\n\n3.3 Signage\n                                                       [DEPT-C]\nStandard 61 requires bilingual signage at all sites in Wales. An audit in February 2023 found that 3 of\n47 Jobcentre Plus sites in Wales had English-only signage: Rhyl Jobcentre, Bangor Jobcentre,\nAberystwyth Jobcentre.\n\nAll three sites were rectified by April 2023.\n\n\n\n4. Complaints\n                                  [DEPT-C]\nDuring the reporting period,                 received 23 complaints related to Welsh language provision. Of these:\n\n      • 14 related to telephone services (inability to conduct business in Welsh)\n\n      • 5 related to correspondence received in English only\n\n      • 3 related to digital services\n\n      • 1 related to a Jobcentre Plus site\n\nAll complaints were resolved within the 20 working day target. The Welsh Language Commissioner was\nnotified of 2 complaints that required formal investigation.\n\n\n\n5. Welsh language skills\n                       [DEPT-C]\nAs at 31 March 2023,              employed 3,247 staff in Wales, of whom:\n\n      • 412 (12.7%) self-reported as Welsh speakers\n\n      • 186 (5.7%) were in designated Welsh essential posts\n\n      • 89 (2.7%) were in designated Welsh desirable posts\n\nThe department offers Welsh language learning through the National Centre for Learning Welsh. During\nthe reporting period, 34 staff enrolled in Welsh language courses.\n\f6. Costs\n\nTotal expenditure on Welsh language compliance during 2022-23: £1,247,000\n\n                   Category                                              Amount\n\n                   Translation services                                  £489,000\n\n                   Bilingual signage and print                           £67,000\n\n                   Welsh language training                               £31,000\n\n                   Welsh language adviser salaries                       £412,000\n\n                   Digital service localisation                          £198,000\n\n                   Other                                                 £50,000\n\n\n\n\n7. Cynlluniau ar gyfer 2023-24 / Plans for 2023-24\n\n      • Achieve full compliance with telephone service standards by December 2023\n\n      • Launch Welsh language chatbot pilot on GOV.UK (subject to GOV.UK App development)\n\n      • Increase number of designated Welsh essential posts by 15%\n\n      • Implement simultaneous publication of all new policy documents in Welsh and English\n\n      [Several of these targets for 2023-24 have since passed their deadlines. An updated compliance report\n      for 2023-24 is expected by March 2025 but has not yet been published.]\n\n\nContact:\n                                                               [DEPT-C\nUned y Gymraeg / Welsh Language Unit: welsh.language@]                   .gov.uk\n\nSwyddfa’r Comisiynydd y Gymraeg / Office of the Welsh Language                                   Commissioner:\nwww.comisiynyddygymraeg.cymru / www.welshlanguagecommissioner.wales\n\n## Raw Metadata\n\n| Field | Value |\n| --- | --- |\n| Author | (anonymous) |\n| CreationDate | Tue Apr 14 09:58:50 2026 BST |\n| Creator | (unspecified) |\n| Custom Metadata | no |\n| Encr Run\n\nFrom the repository root:\n\n```bash\ncd challenge-2/workbench\npnpm install\npnpm dev\n```\n\nOpen the local URL printed by Vite. The default Playwright/dev port is `5174`.\n\n## Main Modes\n\n- **No AI:** use the question box, search, dynamic facets, source cards, order-by stack, grid/outline/graph/timeline views, reader view, workbook table view, saved context sets, local collections, and deterministic demo checks.\n- **Reader:** source notes open as rendered Markdown preview by default, with a Text toggle for exact Markdown/frontmatter inspection and a local source-note endpoint for opening the Markdown directly.\n- **Browser AI:** copy or download the current context as JSON, copy a browser-AI prompt, or download a Markdown evidence bundle. The export includes the current question.\n- **MCP:** run `python3 challenge-2/tools/workbench_mcp.py` so desktop AI clients can search, read, and build context from the same source set.\n\n## SeeLinks-Style Controls\n\nThe workbench now mirrors the key SeeLinks/Micropedia control surfaces inside this repo:\n\n- resizable left rail, dataset/import status, Order by stack, metadata toggle, facet open/pin/reorder controls, value ordering, Links, Collections, Printing, AI export, Tile Text, and browser-only Editing panels;\n- click/right-click/double-click facet-value workflows for filter/mark, adjusted highlight sets, and view reductions;\n- Choose highlighted, Choose unhighlighted, Undo view, Reset, history chips, drag-facet-to-grid colouring, and drag-value-to-grid rollups;\n- a docked grid detail panel with tile strip, previous/next/close, Overview/Images tabs, source links, thumbnails, and metadata.\n\nCollections are stored in browser IndexedDB through Dexie. Per-pack UI preferences are stored in `localStorage`. Editing operates only on the in-browser working copy and does not write Challenge 2 raw sources, HMRC narrative files, or generated pack JSON.\n\nThe parity matrix is [SeeLinks Micropedia parity matrix](../../research/hmrc-beyond-hype/narrative/notes/seelinks-micropedia-parity-matrix.md).\n\n## Question Box\n\nThe question box records the user need before source selection. Typed questions are included in Browser AI JSON, browser prompts, and Markdown evidence bundles. Running a saved check fills the question box with that check's demo question so the exported context shows both the evidence and the question it was assembled to answer.\n\n## What It Uses\n\n- [Source register](data/source-register.json)\n- [Source notes](sources/doc-hb-001-housing-benefit-check-if-you-re-eligible-gov-uk.md)\n- [Lint report](lint-report.md)\n- [Architecture overview](architecture.md)\n\n## Validation\n\nThe workbench includes unit, component, MCP, and Playwright tests:\n\n```bash\ncd challenge-2/workbench\npnpm test\npnpm test:ui\npnpm build\npnpm test:coverage\n```\n\nCoverage enforcement is intentionally optional through `pnpm test:coverage` so feature tests can run quickly during iteration."}},"edges":[["architecture.md","index.md"],["architecture.md","lint-report.md"],["architecture.md","maps/housing-and-benefits.md"],["architecture.md","topics/procurement-and-spending-controls.md"],["demonstration-guide.md","architecture.md"],["demonstration-guide.md","evaluation-benchmark.md"],["demonstration-guide.md","index.md"],["demonstration-guide.md","lint-report.md"],["demonstration-guide.md","sources/doc-hb-002-discretionary-housing-payments-guidance-for-local-autho.md"],["demonstration-guide.md","sources/doc-hb-003-council-tax-reduction-schemes-regulatory-framework-and.md"],["demonstration-guide.md","sources/doc-hb-006-housing-benefit-claim-form-hb1-completion-instructions.md"],["demonstration-guide.md","sources/doc-hb-009-council-tax-reduction-schemes-prescribed-requirements-e.md"],["demonstration-guide.md","sources/uf-foi-response-template-template-freedom-of-information-act-2000-response.md"],["demonstration-guide.md","sources/uf-information-security-policy-draf-draft-not-for-distributi function inline(s){return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\[([^\]]+)\]\(([^)]+)\)/g,(_,label,href)=>linkFor(href,esc(label)));}
function md(text){const lines=String(text||"").split("\n");let html="",inList=false,inCode=false,buf=[];function closeList(){if(inList){html+="</ul>";inList=false;}}function flushCode(){if(inCode){html+=`<pre><code>${esc(buf.join("\n"))}</code></pre>`;buf=[];inCode=false;}}for(const line of lines){if(line.startsWith("```")){if(inCode)flushCode();else{closeList();inCode=true;buf=[];}continue;}if(inCode){buf.push(line);continue;}if(!line.trim()){closeList();continue;}let m;if((m=/^###\s+(.+)/.exec(line))){closeList();html+=`<h3>${inline(m[1])}</h3>`;}else if((m=/^##\s+(.+)/.exec(line))){closeList();html+=`<h2>${inline(m[1])}</h2>`;}else if((m=/^#\s+(.+)/.exec(line))){closeList();html+=`<h1>${inline(m[1])}</h1>`;}else if((m=/^-\s+(.+)/.exec(line))){if(!inList){html+="<ul>";inList=true;}html+=`<li>${inline(m[1])}</li>`;}else{closeList();html+=`<p>${inline(line)}</p>`;}}flushCode();closeList();return html;}
function renderDetail(){const n=G.nodes[selected];const outgoing=[...out[selected]].sort();const incoming=[...inc[selected]].sort();detail.innerHTML=`<span class="badge">${esc(n.type)}</span><h2 class="title">${esc(n.title)}</h2><div class="path"><a href="${esc(n.source)}">${esc(n.source)}</a></div><p class="desc">${esc(n.description)}</p><div class="chips">${outgoing.slice(0,16).map(id=>`<button class="chip" data-page="${esc(id)}">out: ${esc(G.nodes[id].title)}</button>`).join("")}${incoming.slice(0,16).map(id=>`<button class="chip" data-page="${esc(id)}">in: ${esc(G.nodes[id].title)}</button>`).join("")}</div><div class="md">${md(n.body)}</div>`;detail.querySelectorAll("[data-page]").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();pick(a.dataset.page);}));}
function renderGraph(){const w=graph.clientWidth||800,h=graph.clientHeight||600,cx=w/2,cy=h/2;graph.setAttribute("viewBox",`0 0 ${w} ${h}`);const ids=paths,sections=G.meta.sections;const pos={};sections.forEach((section,si)=>{const group=(bySection[section]||[]).slice().sort();const angle=(Math.PI*2*si/Math.max(1,sections.length))-Math.PI/2;const gx=cx+Math.cos(angle)*w*.28,gy=cy+Math.sin(angle)*h*.28;group.forEach((id,i)=>{const row=Math.floor(i/9),col=i%9;pos[id]={x:gx+(col-4)*26,y:gy+(row-(group.length/9)/2)*24};});});let svg="";if(showLinks){for(const [a,b] of G.edges){if(pos[a]&&pos[b])svg+=`<line class="edge" x1="${pos[a].x}" y1="${pos[a].y}" x2="${pos[b].x}" y2="${pos[b].y}"/>`;}}for(const id of ids){const n=G.nodes[id],p=pos[id]||{x:cx,y:cy};const r=id===selected?8:5;svg+=`<g class="node ${id===selected?"active":""}" data-page="${esc(id)}"><circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${color(n.section)}"/><title>${esc(n.title)}</title>${id===selected?`<text x="${p.x+11}" y="${p.y+4}">${esc(n.title)}</text>`:""}</g>`;}graph.innerHTML=svg;graph.querySelectorAll("[data-page]").forEach(el=>el.addEventListener("click",()=>pick(el.dataset.page)));}
document.getElementById("home").onclick=()=>pick(G.meta.root||"index.md");document.getElementById("fit").onclick=renderGraph;document.getElementById("showLinks").onclick=e=>{showLinks=!showLinks;e.currentTarget.classList.toggle("on",showLinks);renderGraph();};q.addEventListener("input",renderList);window.addEventListener("resize",renderGraph);
renderList();renderDetail();renderGraph();
</script>
</body>
