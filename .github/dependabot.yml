version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/challenge-2/workbench"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    groups:
      dark-data-workbench-stack:
        patterns:
          - "@playwright/*"
          - "@sveltejs/*"
          - "@testing-library/*"
          - "@types/*"
          - "@vitest/*"
          - "dexie"
          - "jsdom"
          - "svelte"
          - "svelte-check"
          - "typescript"
          - "vite"
          - "vitest"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:30"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
