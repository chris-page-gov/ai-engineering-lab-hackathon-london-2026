name: CKAN Fixture CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ckan-fixture-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate OKF bundles
        run: python3 scripts/check_okf_conformance.py

      - name: Validate wiki viewer
        run: python3 scripts/check_wiki_viewer.py

      - name: Validate GOV.UK CKAN bundle
        run: python3 scripts/check_gov_ckan_bundle.py

      - name: Validate stratified GOV.UK CKAN evaluation bundle
        run: |
          python3 scripts/check_gov_ckan_bundle.py gov-ckan-sample
          python3 scripts/check_gov_ckan_performance.py gov-ckan-sample
          python3 scripts/build_gov_ckan_evaluation_sample.py --check

      - name: Validate GOV.UK CKAN performance budget
        run: python3 scripts/check_gov_ckan_performance.py

      - name: Compile publication scripts
        run: python3 -m py_compile scripts/build_site.py scripts/update_viewer.py scripts/check_wiki_viewer.py scripts/check_okf_conformance.py scripts/build_gov_ckan_bundle.py scripts/build_gov_ckan_evaluation_sample.py scripts/update_gov_ckan_operational_metadata.py scripts/check_gov_ckan_bundle.py scripts/check_gov_ckan_performance.py challenge-2/tools/build_wiki.py tools/build_codex_postmortem.py

      - name: Build static site
        run: python3 scripts/build_site.py
