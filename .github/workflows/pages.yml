name: Publish GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate OKF bundles
        run: python3 scripts/check_okf_conformance.py

      - name: Validate wiki viewer
        run: python3 scripts/check_wiki_viewer.py

      - name: Validate GOV.UK CKAN bundle
        run: python3 scripts/check_gov_ckan_bundle.py

      - name: Compile publication scripts
        run: python3 -m py_compile scripts/build_site.py scripts/update_viewer.py scripts/check_wiki_viewer.py scripts/check_okf_conformance.py scripts/build_gov_ckan_bundle.py scripts/check_gov_ckan_bundle.py challenge-2/tools/build_wiki.py tools/build_codex_postmortem.py

      - name: Build static site
        run: python3 scripts/build_site.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
